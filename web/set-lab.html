<title>Жиын-лаборатория set</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
:root{--boot-bg:#F3F5F9;--boot-fg:#13203A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--boot-bg:#0D1422;--boot-fg:#E7ECF6;color-scheme:dark}}
:root[data-theme="dark"]{--boot-bg:#0D1422;--boot-fg:#E7ECF6;color-scheme:dark}
body{background:var(--boot-bg);color:var(--boot-fg)}
</style>
<template id="tpl-ru">
<style>
/* Layout: one column of lesson stations; the set machine is the visual centre; code panels are the working surface */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#13203A; --muted:#5A6680; --line:#D9DFEA;
  --a:#2C64D8; --a-soft:rgba(44,100,216,.16);
  --b:#D98A06; --b-soft:rgba(217,138,6,.18);
  --hit:#1E9E6A; --hit-soft:rgba(30,158,106,.30);
  --bad:#C83A3A; --bad-soft:rgba(200,58,58,.12); --ok-soft:rgba(30,158,106,.12);
  --on-a:#FFFFFF; --code-bg:#0F1A2E; --code-ink:#E6ECF7; --code-muted:#8A97B3;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1422; --surface:#151F33; --ink:#E7ECF6; --muted:#9AA6C0; --line:#26324B;
  --a:#6E9BFF; --a-soft:rgba(110,155,255,.20); --b:#F2B33D; --b-soft:rgba(242,179,61,.20);
  --hit:#3DD598; --hit-soft:rgba(61,213,152,.30); --bad:#FF7A7A; --bad-soft:rgba(255,122,122,.14); --ok-soft:rgba(61,213,152,.14);
  --on-a:#0B1426; --code-bg:#080E1A; --code-ink:#E6ECF7; --code-muted:#7D8AA6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#151F33; --ink:#E7ECF6; --muted:#9AA6C0; --line:#26324B;
  --a:#6E9BFF; --a-soft:rgba(110,155,255,.20); --b:#F2B33D; --b-soft:rgba(242,179,61,.20);
  --hit:#3DD598; --hit-soft:rgba(61,213,152,.30); --bad:#FF7A7A; --bad-soft:rgba(255,122,122,.14); --ok-soft:rgba(61,213,152,.14);
  --on-a:#0B1426; --code-bg:#080E1A; --code-ink:#E6ECF7; --code-muted:#7D8AA6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h2{font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:700}
h3{font-size:1rem;font-weight:500}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.92em}
code,pre,textarea,input,.dedupe,.result,.fact,.out,.op b,.sig,.opt,.badge,svg text{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
section{scroll-margin-top:60px}
a{color:var(--a)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;overflow-x:auto}
.brand{display:none}
.brand span{color:var(--a)}
nav{display:flex;flex-wrap:nowrap;gap:2px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:thin}
nav a{text-decoration:none;color:var(--muted);font-size:.8rem;padding:6px 6px;border-radius:8px;white-space:nowrap}
nav a:hover{background:var(--bg);color:var(--ink)}
.lang-sw{margin-left:auto;flex:none;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:.8rem;font-weight:600}
.lang-sw span,.lang-sw a,.lang-sw button{padding:5px 10px;text-decoration:none;border:0;background:transparent;font:inherit;color:var(--ink)}
.lang-sw span{background:var(--ink);color:var(--bg)}
.lang-sw a{color:var(--ink)}
.lang-sw a:hover{background:var(--bg)}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{padding-block:40px 28px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.hero>*{min-width:0}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:700;margin-top:10px}
.hero h1 .tri{display:block;font-size:.42em;font-weight:500;color:var(--muted);margin-top:12px;letter-spacing:.01em}
.hero p.lead{margin-top:16px;max-width:52ch;color:var(--muted)}
.goals{margin-top:14px;display:grid;gap:6px;font-size:.93rem}
.goals-title{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.objective{margin-top:18px;display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--a);border-radius:10px;background:var(--a-soft);font-size:.95rem}
.obj-code{font-family:var(--f-mono);font-weight:600;color:var(--on-a);background:var(--a);padding:3px 8px;border-radius:6px;white-space:nowrap}
.goals div{display:flex;gap:10px}
.goals b{min-width:110px;font-weight:600}
.dedupe{background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:18px;font-family:var(--f-mono);font-size:.88rem;overflow-x:auto}
.dedupe .c{color:var(--code-muted)}
.dedupe .row{white-space:pre}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chip{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:opacity .4s,transform .4s}
.chip.dup{opacity:.25;text-decoration:line-through}
.dedupe button{background:var(--b);color:#1b1300;border:0;border-radius:8px;padding:7px 12px;font-family:var(--f-body);font-weight:600}

main>section{padding-block:28px 12px}
main>section#cel{padding-block:0 12px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:48%}
.pager a.next{margin-left:auto;background:var(--a);color:var(--on-a);border-color:var(--a)}
.pager a span{display:block;font-size:.75rem;font-weight:500;opacity:.75}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:18px}
.sec-head p{color:var(--muted);max-width:62ch}

/* how we reach the objective */
table.plan td:first-child{white-space:nowrap;font-weight:600}
table.plan a{text-decoration:none;border-bottom:1px solid var(--a-soft)}
.levels-map{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;font-size:.92rem}
.levels-map div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* first three tabs */
h3.sub{font-family:var(--f-display);font-size:1rem;font-weight:500;margin:22px 0 10px}
.memo{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.memo summary,.reveal summary{cursor:pointer;color:var(--a);font-weight:600}
.memo .tbl-wrap{margin-top:10px}
.topic-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.step h3.sub{margin:0}
.answer-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer-row label{font-weight:600;font-size:.92rem}
.answer-row input[type=text]{width:90px}
.feedback{padding:8px 12px;border-radius:8px;font-size:.92rem}
.feedback.ok{background:var(--ok-soft)} .feedback.no{background:var(--bad-soft)}
.reveal{border-top:1px solid var(--line);padding-top:10px}
.reveal pre{margin:10px 0 0;background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:.86rem;padding:12px;border-radius:10px;overflow-x:auto}
.reveal .editor{margin-top:10px}
.editor.compact .ed-body{grid-template-columns:1fr}
.editor.compact .ed-side{border-left:0;border-top:1px solid var(--line)}
.editor.compact .ed-side>div:first-child{display:none}
.editor.compact textarea.code{min-height:170px}
.editor.compact .out{min-height:60px}
.qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qcard summary{cursor:pointer;font-weight:500;display:flex;gap:10px;align-items:flex-start;list-style:none}
.qcard summary::-webkit-details-marker{display:none}
.qcard .qn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--a-soft);color:var(--a);font-family:var(--f-mono);font-weight:600;font-size:.85rem;display:grid;place-items:center}
.qcard p{margin-top:8px;padding-left:34px;color:var(--muted)}
.qcard[open]{border-color:var(--a)}
.qcard.final{border-color:var(--b);background:var(--b-soft)}
.qcard.final .qn{background:var(--b);color:#1b1300}
.topic-reveal{font-family:var(--f-display);font-size:1.15rem;color:var(--ink)!important}
.topic-head{padding-top:8px}
.topic-head h1{font-size:clamp(1.6rem,4.4vw,2.6rem);font-weight:700;margin-top:8px}
.topic-head .tri{color:var(--muted);margin-top:6px;font-weight:500}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:6px}
.lvl{font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.lvl.a{background:var(--a-soft);color:var(--a)} .lvl.b{background:var(--b-soft);color:var(--b)} .lvl.c{background:var(--hit-soft);color:var(--hit)}
@media (max-width:820px){.topic-grid{grid-template-columns:1fr}}

.howto{color:var(--muted);font-size:.9rem;margin:-4px 0 10px}
h3.sub .time{font-family:var(--f-body);font-size:.8rem;font-weight:600;color:var(--b);background:var(--b-soft);padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}
.qcards.tf p b{color:var(--ink)}
.match{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.m-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
.m-col{display:grid;gap:8px;align-content:start;min-width:0}
.m-item{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:.92rem;min-height:44px}
.m-item:hover{border-color:var(--a)}
.m-item.sel{border-color:var(--a);box-shadow:0 0 0 2px var(--a-soft)}
.m-item.linked{background:var(--a-soft)}
.m-item.ok{background:var(--ok-soft);border-color:var(--hit)}
.m-item.bad{background:var(--bad-soft);border-color:var(--bad)}
.m-tag{flex:none;min-width:24px;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:.82rem;font-weight:600;display:grid;place-items:center}
.m-left .m-tag{background:var(--a);color:var(--on-a);border-color:var(--a)}
.m-code{white-space:pre;font-size:.82rem;line-height:1.45}
.m-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.m-res{font-size:.92rem;font-weight:500}
p.score{margin-top:10px;font-size:1rem}
@media (max-width:640px){.m-cols{grid-template-columns:1fr}.m-left{order:0}}

/* definition */
.definition{border:2px solid var(--a);background:var(--a-soft);border-radius:14px;padding:16px 18px;display:grid;gap:6px}
.def-label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--a)}
.def-text{font-size:1.08rem;line-height:1.6;max-width:70ch}
.def-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.prop h3{font-size:.95rem}
.prop p{font-size:.9rem;color:var(--muted)}
.prop pre{margin:0;font-family:var(--f-mono);font-size:.82rem;background:var(--bg);padding:8px;border-radius:6px;overflow-x:auto}
table.create td:first-child{font-weight:500}

/* olympiad case */
.oly{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:start}
.oly-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.oly-steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.9rem}
.oly-steps li .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.oly-steps li.done .n{background:var(--hit);color:var(--on-a);border-color:var(--hit)}
.oly-steps li.cur{border-color:var(--a);box-shadow:0 0 0 2px var(--a-soft)}
.oly-steps li.cur .n{background:var(--a);color:var(--on-a);border-color:var(--a)}
.oly-steps li.lock{opacity:.5}
.oly-steps li small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.78rem}
.oly-work{display:grid;gap:12px;min-width:0}
.oly-current{background:var(--a-soft);border:1px solid var(--a);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.oly-current h3{font-size:1rem}
.oly-current.finished{background:var(--ok-soft);border-color:var(--hit)}
.extra-h{margin-top:34px}
#olyEd textarea.code{min-height:340px}
header.top .wrap{max-width:1240px}
/* goal card */
.goal-card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;display:grid;gap:14px}
.goal-card.reached{border-color:var(--hit)}
.goal-verdict{display:flex;gap:12px;align-items:flex-start}
.goal-verdict .big{font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.goal-verdict p{color:var(--muted);margin-top:4px}
.goal-levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.glevel{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;align-content:start;background:var(--bg)}
.glevel.ok{border-color:var(--hit);background:var(--ok-soft)}
.glevel.part{border-color:var(--b)}
.glevel h4{margin:0;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.gstate{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.gstate.ok{background:var(--hit);color:var(--on-a)} .gstate.part{background:var(--b-soft);color:var(--b)} .gstate.no{background:var(--bad-soft);color:var(--bad)}
.gitem{display:flex;gap:8px;font-size:.88rem;align-items:flex-start}
.gitem .ic{flex:none;width:18px;text-align:center;font-weight:700}
.gitem.ok .ic{color:var(--hit)} .gitem.help .ic{color:var(--b)} .gitem.no .ic{color:var(--muted)}
.gitem a{color:inherit}
.gstats{display:flex;flex-wrap:wrap;gap:8px;font-size:.85rem;color:var(--muted)}
.gstats span{border:1px solid var(--line);border-radius:8px;padding:3px 8px}
@media (max-width:820px){.oly{grid-template-columns:1fr}}

table.levels-plan td{vertical-align:top;line-height:1.7}
table.levels-plan td:first-child{width:130px}
.train{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.92rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.train a{font-weight:600;text-decoration:none}
.train span{color:var(--muted)}
/* confidence scale */
.conf{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.conf-q{font-weight:500;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.conf-tag{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--a);background:var(--a-soft);padding:2px 8px;border-radius:6px}
.conf-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.conf-b{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-weight:600;font-size:1rem}
.conf-b:hover{border-color:var(--a)}
.conf-b.on{background:var(--a);border-color:var(--a);color:var(--on-a)}
.conf-val{margin-left:6px;font-size:.92rem;color:var(--muted)}
.conf-scale{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.78rem;color:var(--muted)}
.conf-sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;display:grid;gap:10px}
.conf-sum h3{font-size:1rem}
.cs-rows{display:grid;gap:4px}
.cs-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 52px;gap:10px;align-items:center;text-decoration:none;color:var(--ink);font-size:.88rem;padding:3px 0}
.cs-bar{height:10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.cs-bar span{display:block;height:100%;background:var(--a)}
.cs-bar span.lv1,.cs-bar span.lv2{background:var(--bad)}
.cs-bar span.lv3{background:var(--b)}
.cs-bar span.lv4,.cs-bar span.lv5{background:var(--hit)}
.cs-v{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);text-align:right}
.cs-note{font-size:.9rem;color:var(--muted)}

/* tab locks */
nav a.locked{opacity:.35;cursor:not-allowed}
.pager a.next.disabled{background:var(--bg);color:var(--muted);border-color:var(--line);pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:.92rem;max-width:min(520px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.conf.pulse{box-shadow:0 0 0 4px var(--b-soft);border-color:var(--b)}

/* student picker */
.picker{background:var(--surface);border:2px solid var(--b);border-radius:16px;padding:14px 16px;display:grid;gap:12px;margin-bottom:6px}
.pk-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pk-title{font-family:var(--f-display);font-weight:700}
.pk-classes{display:flex;flex-wrap:wrap;gap:6px}
.pk-cls{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;font-family:var(--f-mono);font-weight:600}
.pk-cls[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pk-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.pk-name{font-family:var(--f-display);font-size:clamp(1.2rem,3.2vw,1.9rem);font-weight:700;padding:10px 14px;border-radius:12px;background:var(--b-soft);min-height:62px;display:flex;align-items:center;color:var(--muted)}
.pk-name.picked{color:var(--ink);background:var(--ok-soft)}
.pk-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pk-opt{display:flex;gap:6px;align-items:center;font-size:.88rem}
.pk-left{font-size:.85rem;color:var(--muted)}
.pk-mini{margin-left:auto;flex:none;font-size:.75rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 9px;align-self:center}
.pk-mini:hover{border-color:var(--b)}

  <section id="svoistva">
    <div class="sec-head"><h2>Что такое множество</h2></div>
    <div class="definition">
      <div class="def-label">Определение</div>
      <p class="def-text"><b>Множество</b> (<code>set</code>, жиын) — это изменяемый набор <b>уникальных</b> элементов, которые хранятся <b>без определённого порядка</b>, поэтому у них нет индексов.</p>
    </div>
    <div class="def-grid">
      <div class="prop"><h3>Уникальность</h3><p>Повторы автоматически удаляются.</p><pre>set([1, 2, 2, 3])
# {1, 2, 3}</pre></div>
      <div class="prop"><h3>Нет порядка и индексов</h3><p>Обратиться к элементу по номеру нельзя.</p><pre>s[0]  # TypeError</pre></div>
      <div class="prop"><h3>Изменяемость</h3><p>Элементы можно добавлять и удалять.</p><pre>s.add(5)
s.discard(2)</pre></div>
    </div>
    <h3 class="sub">Как создать множество</h3>
    <div class="tbl-wrap"><table class="create">
      <thead><tr><th>Способ</th><th>Код</th><th>Результат</th></tr></thead>
      <tbody>
        <tr><td>Перечислить элементы в фигурных скобках</td><td><code>s = {1, 2, 3}</code></td><td><code>{1, 2, 3}</code></td></tr>
        <tr><td>Из списка</td><td><code>s = set([1, 2, 2, 3])</code></td><td><code>{1, 2, 3}</code></td></tr>
        <tr><td>Из строки</td><td><code>s = set("банан")</code></td><td><code>{'б', 'а', 'н'}</code> — порядок может быть другим</td></tr>
        <tr><td>Пустое множество</td><td><code>s = set()</code></td><td><code>set()</code> — а <code>{}</code> создаёт пустой словарь</td></tr>
      </tbody>
    </table></div>
    <h3 class="sub">Сравните: list, tuple и set</h3>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Свойство</th><th>list</th><th>tuple</th><th>set</th></tr></thead>
      <tbody>
        <tr><td>Пример</td><td><code>[1, 2, 2]</code></td><td><code>(1, 2, 2)</code></td><td class="hl"><code>{1, 2}</code></td></tr>
        <tr><td>Можно изменять</td><td class="y">да</td><td class="n">нет</td><td class="y hl">да</td></tr>
        <tr><td>Есть индексы <code>x[0]</code></td><td class="y">да</td><td class="y">да</td><td class="n hl">нет</td></tr>
        <tr><td>Допускает повторы</td><td class="y">да</td><td class="y">да</td><td class="n hl">нет</td></tr>
        <tr><td>Пустой объект</td><td><code>[]</code></td><td><code>()</code></td><td class="hl"><code>set()</code> — не <code>{}</code>, это словарь</td></tr>
      </tbody>
    </table></div>
    <div class="terms">
      <div class="term"><div class="kz">жиын</div>множество<div class="en">set</div></div>
      <div class="term"><div class="kz">қосу</div>добавить<div class="en">add</div></div>
      <div class="term"><div class="kz">жою</div>удалить<div class="en">remove · discard</div></div>
      <div class="term"><div class="kz">тазарту</div>очистить<div class="en">clear</div></div>
      <div class="term"><div class="kz">тиесілі</div>принадлежит<div class="en">in</div></div>
      <div class="term"><div class="kz">элемент</div>элемент<div class="en">element</div></div>
    </div>
  </section>

<script>
(function(){
const $=s=>document.querySelector(s);

/* ---------- Python runner ---------- */
function runPython(code,inputs){
  return new Promise(resolve=>{
    if(typeof Sk==='undefined'){resolve({out:'',err:'Интерпретатор Python не загрузился. Проверьте подключение к интернету и обновите страницу.'});return;}
    let out='';const q=(inputs||[]).slice();
    Sk.configure({output:t=>{out+=t},__future__:Sk.python3,execLimit:5000,yieldLimit:200,
      read:x=>{if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[x]===undefined)throw "Файл не найден: "+x;return Sk.builtinFiles.files[x];},
      inputfunTakesPrompt:true,
      inputfun:p=>{if(p)out+=p;if(!q.length)throw new Sk.builtin.EOFError("Нет входных данных для input(): впишите их в поле «Ввод»");const v=q.shift();out+=(p?'':'')+'';return v;}});
    Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,code,true))
      .then(()=>resolve({out,err:null}))
      .catch(e=>{let m=e.toString();if(/TimeLimitError/.test(m))m='Программа работает слишком долго. Возможно, бесконечный цикл.';
        else if(/bad token/.test(m)){const bare=code.replace(/#.*$/gm,'').replace(/(["']).*?\1/g,'');const ln=bare.split('\n').findIndex(l=>/[Ѐ-ӿ]/.test(l));
          if(ln>=0)m=`В строке ${ln+1} есть русские буквы вне кавычек, например в имени переменной или метода. Переключите раскладку на английскую и напишите имя латиницей.\n(${m})`;}
        resolve({out,err:m});});
  });
}
/* set printing order differs between interpreters: turn every {..} into a sorted [..] */
function splitTop(s){const parts=[];let d=0,q=null,cur='';for(const ch of s){if(q){cur+=ch;if(ch===q)q=null;continue}if(ch==="'"||ch==='"'){q=ch;cur+=ch;continue}if('([{'.includes(ch))d++;if(')]}'.includes(ch))d--;if(ch===','&&d===0){parts.push(cur.trim());cur='';continue}cur+=ch}if(cur.trim())parts.push(cur.trim());return parts}
function norm(text){
  let t=text.replace(/set\(\)/g,'[]');
  t=t.replace(/\{([^{}:]*)\}/g,(m,inner)=>{const p=splitTop(inner);const num=p.every(x=>/^-?\d+(\.\d+)?$/.test(x));
    p.sort(num?(a,b)=>a-b:(a,b)=>{const x=a.replace(/^['"]|['"]$/g,''),y=b.replace(/^['"]|['"]$/g,'');return x<y?-1:x>y?1:0});return '['+p.join(', ')+']';});
  return t.replace(/"/g,"'").replace(/[ \t]+\n/g,'\n').trim();
}

/* ---------- editor component ---------- */
function makeEditor(host,{title,code,stdin,extraBtns,compact}){
  host.classList.add('editor');if(compact)host.classList.add('compact');
  host.innerHTML=`<div class="ed-bar"><span class="title">${esc(title)}</span><button class="btn run" type="button">▶ Запустить</button></div>
  <div class="ed-body"><textarea class="code" spellcheck="false" aria-label="Код Python"></textarea>
  <div class="ed-side"><div><div class="lbl">Ввод</div><textarea class="stdin" spellcheck="false" aria-label="Входные данные"></textarea></div>
  <div><div class="lbl">Вывод</div><div class="out" aria-live="polite"></div></div></div></div>`;
  const ta=host.querySelector('textarea.code'),si=host.querySelector('textarea.stdin'),out=host.querySelector('.out'),run=host.querySelector('.run');
  ta.value=code||'';si.value=stdin||'';
  ta.addEventListener('keydown',e=>{if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('    ',s,ta.selectionEnd,'end');}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run.click();}});
  run.addEventListener('click',async()=>{run.disabled=true;out.textContent='…';
    const inputs=si.value===''?[]:si.value.split('\n');const r=await runPython(ta.value,inputs);
    out.innerHTML=esc(r.out)+(r.err?`<span class="err">${esc(r.err)}</span>`:'')||'<span style="opacity:.6">(пусто)</span>';
    if(!r.out&&!r.err)out.innerHTML='<span style="opacity:.6">(программа ничего не вывела)</span>';run.disabled=false;});
  if(extraBtns)extraBtns(host.querySelector('.ed-bar'));
  return {ta,si,out,run};
}

function matcher(host,key,pairs,codeLeft){
  const order=store.get(key+':order',null)||pairs.map((_,i)=>i).sort(()=>Math.random()-.5);store.set(key+':order',order);
  let links=store.get(key+':links',{}),sel=null,checked=false;
  host.innerHTML=`<div class="m-cols"><div class="m-col m-left"></div><div class="m-col m-right"></div></div>
   <div class="m-bar"><button class="btn alt" type="button">Проверить</button><button class="btn-ghost" type="button">Сбросить</button><span class="m-res" aria-live="polite"></span></div>`;
  const L=host.querySelector('.m-left'),Rt=host.querySelector('.m-right'),res=host.querySelector('.m-res');
  const [bCheck,bReset]=host.querySelectorAll('.m-bar button');
  function draw(){
    const usedBy={};Object.entries(links).forEach(([l,r])=>usedBy[r]=+l);
    L.innerHTML=pairs.map((pr,i)=>{const r=links[i];const st=checked&&r!==undefined?(r===i?' ok':' bad'):'';
      return `<button type="button" class="m-item${sel===i?' sel':''}${r!==undefined?' linked':''}${st}" data-l="${i}">${r!==undefined?`<span class="m-tag">${order.indexOf(r)+1}</span>`:''}${codeLeft?`<code class="m-code">${esc(pr[0])}</code>`:`<code>${esc(pr[0])}</code>`}</button>`;}).join('');
    Rt.innerHTML=order.map((ri,k)=>{const used=usedBy[ri]!==undefined;
      return `<button type="button" class="m-item m-opt${used?' linked':''}" data-r="${ri}"><span class="m-tag">${k+1}</span><span>${esc(pairs[ri][1])}</span></button>`;}).join('');
    L.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.l;checked=false;res.textContent='';
      if(links[i]!==undefined&&sel!==i){delete links[i];sel=null;}else sel=(sel===i?null:i);store.set(key+':links',links);draw();}));
    Rt.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{if(sel===null){res.textContent='Сначала выберите элемент слева.';return;}
      const r=+b.dataset.r;for(const k in links)if(links[k]===r)delete links[k];links[sel]=r;sel=null;checked=false;res.textContent='';store.set(key+':links',links);draw();}));
  }
  bCheck.addEventListener('click',()=>{const n=Object.keys(links).length;checked=true;const ok=pairs.filter((_,i)=>links[i]===i).length;
    res.textContent=n<pairs.length?`Соединено ${n} из ${pairs.length}. Верно: ${ok}.`:(ok===pairs.length?`Все ${ok} пар верны. Отлично!`:`Верно ${ok} из ${pairs.length}. Красные пары исправьте.`);draw();});
  bReset.addEventListener('click',()=>{links={};sel=null;checked=false;res.textContent='';store.set(key+':links',links);draw();});
  draw();
}

const mPresets={nums:[2,4,6,8],cities:['Астана','Алматы','Шымкент'],class:['Айгерим','Нурлан','Данияр'],empty:[]};
let S=[],log=[];
const isNumStr=x=>/^-?\d+(\.\d+)?$/.test(x);
const lit=v=>typeof v==='number'?String(v):`'${v}'`;
const toVal=x=>{x=x.trim();const q=/^(["']).*\1$/.test(x)&&x.length>=2;if(q)return x.slice(1,-1);return isNumStr(x)?Number(x):x;};
const cmpMix=(a,b)=>typeof a!==typeof b?(typeof a==='number'?-1:1):(typeof a==='number'?a-b:(a<b?-1:a>b?1:0));
const mixedTypes=()=>new Set(S.map(v=>typeof v)).size>1;
function fmtSet(){if(!S.length)return 'set()';return '{'+S.slice().sort(cmpMix).map(lit).join(', ')+'}';}
function drawSet(mark,cls){const box=$('#setbox');
  if(!S.length){box.innerHTML='<span class="empty">s = set()  — пустое множество</span>';return;}
  box.innerHTML=S.map(v=>`<span class="el${v===mark?' '+cls:''}">${esc(lit(v))}</span>`).join('');
  if(mark!==undefined)setTimeout(()=>box.querySelectorAll('.el.new,.el.hit').forEach(e=>e.classList.remove('new','hit')),900);}
function addLog(code,res,kind){log.push({code,res,kind});if(log.length>14)log.shift();
  const el=$('#labLog');el.innerHTML=log.map(l=>`${esc(l.code)}${l.res!==null?`\n<span class="${l.kind||'r'}">${esc(l.res)}</span>`:''}`).join('\n');el.scrollTop=el.scrollHeight;}

document.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>{
  const raw=$('#xval').value,x=toVal(raw),op=b.dataset.op,has=S.includes(x);
  const needX=['add','remove','discard','in'].includes(op);
  if(needX&&raw.trim()===''){addLog('# Введите значение x','',null);return;}
  if(op==='add'){const wasMixed=mixedTypes();if(!has)S.push(x);addLog(`s.add(${lit(x)})`,has?`# ${lit(x)} уже есть — множество не изменилось: ${fmtSet()}`:`# ${fmtSet()}`,has?'c':'r');
    if(!has&&!wasMixed&&mixedTypes())addLog('# Внимание: теперь в s есть и числа, и строки.','# Python это разрешает, но обычно элементы одного типа.\n# sorted(s) для такого множества даст TypeError.','c');
    drawSet(x,has?'hit':'new');}
  else if(op==='remove'){if(has){S=S.filter(v=>v!==x);addLog(`s.remove(${lit(x)})`,`# ${fmtSet()}`);drawSet();}else{addLog(`s.remove(${lit(x)})`,`KeyError: ${lit(x)}`,'e');}}
  else if(op==='discard'){if(has)S=S.filter(v=>v!==x);addLog(`s.discard(${lit(x)})`,has?`# ${fmtSet()}`:`# элемента ${lit(x)} нет, но ошибки не будет: ${fmtSet()}`,has?'r':'c');drawSet();}
  else if(op==='in'){addLog(`print(${lit(x)} in s)`,has?'True':'False');drawSet(has?x:undefined,'hit');}
  else if(op==='pop'){if(!S.length){addLog('s.pop()',"KeyError: 'pop from an empty set'",'e');}else{const i=Math.floor(Math.random()*S.length),v=S[i];S.splice(i,1);addLog('print(s.pop())',lit(v)+`   # произвольный элемент; осталось ${fmtSet()}`);drawSet();}}
  else if(op==='clear'){S=[];addLog('s.clear()','# set()');drawSet();}
  else if(op==='len'){addLog('print(len(s))',String(S.length));}
}));

const done=store.get('done',{}),tries=store.get('tries',{});
const tl=$('#tasks');
tasks.forEach(t=>{
  const box=document.createElement('div');box.className='task';box.dataset.lv=t.lv;
  box.innerHTML=`<div class="task-head"><span class="badge ${t.lv}">${t.id}</span><h3>${esc(t.title)}</h3><span class="status" id="st-${t.id}"></span></div>
   <p class="desc">${esc(t.desc)}</p><p class="expect">${esc(t.expect)}</p><div class="ed"></div><div class="verdict" hidden></div>
   <details class="sol"><summary>Решение-образец</summary><div class="solbody"></div></details>`;
  tl.appendChild(box);
  const saved=store.get('code-'+t.id,null);
  const ed=makeEditor(box.querySelector('.ed'),{title:t.id.toLowerCase()+'.py',code:saved??t.code,stdin:t.stdin||'',
    extraBtns:bar=>{const b=document.createElement('button');b.className='btn alt chk';b.type='button';b.textContent='✓ Проверить';bar.appendChild(b);}});
  ed.ta.addEventListener('input',()=>store.set('code-'+t.id,ed.ta.value));
  const verdict=box.querySelector('.verdict'),st=box.querySelector('.status'),sol=box.querySelector('.solbody');
  const renderSol=()=>{const n=tries[t.id]||0;sol.innerHTML=(n>=2||done[t.id])?`<pre>${esc(t.sol)}</pre>`:`<p style="margin-top:6px">Откроется после ${2-n} ${2-n===1?'попытки':'попыток'} проверки.</p>`;};
  const renderSt=()=>{st.className='status'+(done[t.id]?' done':'');st.textContent=done[t.id]?'Решено':'';};
  renderSol();renderSt();
  box.querySelector('.chk').addEventListener('click',async e=>{
    const btn=e.currentTarget;btn.disabled=true;verdict.hidden=false;verdict.className='verdict';verdict.textContent='Проверяю…';
    let fail=null;
    const code=ed.ta.value.replace(/#.*$/gm,'');
    const miss=(t.need||[]).filter(n=>!code.includes(n));
    if(miss.length)fail='В решении нужно использовать: '+miss.map(m=>m.trim().replace(/^\./,'').replace(/\($/,'()')).join(', ')+'.';
    if(!fail)for(const [i,tc] of t.tests.entries()){
      const r=await runPython(ed.ta.value,tc.in);
      if(r.err){fail=`Тест ${i+1}${tc.in.length?' (ввод: '+tc.in.join(', ')+')':''}: ошибка при выполнении.\n${r.err}`;break;}
      const o=norm(r.out);let pos=0,missing=null;
      for(const x of tc.exp){const k=o.indexOf(norm(x),pos);if(k<0){missing=x;break;}pos=k+norm(x).length;}
      if(missing!==null){fail=`Тест ${i+1}${tc.in.length?' (ввод: '+tc.in.join(', ')+')':''}: в выводе не найдено «${missing}» (или порядок строк другой).\nВаш вывод:\n${r.out.trim()||'(пусто)'}`;break;}
    }
    tries[t.id]=(tries[t.id]||0)+1;store.set('tries',tries);
    if(fail){verdict.className='verdict no';verdict.style.whiteSpace='pre-wrap';verdict.textContent=fail;}
    else{verdict.className='verdict ok';verdict.textContent=`Все тесты пройдены (${t.tests.length} из ${t.tests.length}). Отличная работа!`;done[t.id]=true;store.set('done',done);}
    renderSol();renderSt();btn.disabled=false;});
});

  const r=await runPython(probe,[]);let fail=null,reachTo=-1;
  const lines=r.out.split('\n'),chk=lines.find(l=>l.startsWith('@@CHK@@')),visible=lines.filter(l=>!l.startsWith('@@CHK@@')).join('\n');

/* ---------- pairs ---------- */
function prRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function prHash(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function makePairs(cls,seed,mask){const all=CLASSES[cls]||[];const a=all.filter((_,i)=>mask&(1<<i));const r=prRng(seed*7919+prHash(cls));
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  const pairs=[];for(let i=0;i+1<a.length;i+=2)pairs.push([a[i],a[i+1]]);
  if(a.length%2){if(pairs.length)pairs[pairs.length-1].push(a[a.length-1]);else pairs.push([a[a.length-1]]);}return pairs;}
function parseCode(c){const m=String(c).replace(/\s+/g,'').toUpperCase().match(/^(\d{2})-([0-9A-F]{1,4})$/);return m?{seed:+m[1],mask:parseInt(m[2],16)}:null;}

(async()=>{

  if(u!==undefined){try{owner=!!(u&&await u.isOwner());}catch(e){owner=false;}}

  const fresh=t=>t&&Date.now()-t<3*60*60*1000;
  d.doc('live/now').onSnapshot(snap=>{const box=$('#liveAns'),v=snap.exists?snap.data():null;
    if(!v||!student||v.cls!==student.cls||!v.name||!fresh(v.t)){box.hidden=true;return;}

.pk-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pk-title{font-family:var(--f-display);font-weight:700}
.pk-classes{display:flex;flex-wrap:wrap;gap:6px}
.pk-cls{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;font-family:var(--f-mono);font-weight:600}
.pk-cls[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pk-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.pk-name{font-family:var(--f-display);font-size:clamp(1.2rem,3.2vw,1.9rem);font-weight:700;padding:10px 14px;border-radius:12px;background:var(--b-soft);min-height:62px;display:flex;align-items:center;color:var(--muted)}
.pk-name.picked{color:var(--ink);background:var(--ok-soft)}
.pk-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pk-opt{display:flex;gap:6px;align-items:center;font-size:.88rem}
.pk-left{font-size:.85rem;color:var(--muted)}
.pk-mini{margin-left:auto;flex:none;font-size:.75rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 9px;align-self:center}
.pk-mini:hover{border-color:var(--b)}
.pk-chip{flex:none;font-size:.78rem;font-weight:600;background:var(--ok-soft);color:var(--ink);border-radius:999px;padding:3px 9px;align-self:center}
.qcards.tf .qcard summary{flex-wrap:wrap}
.qcards.tf .qcard summary>span:nth-child(2){flex:1 1 calc(100% - 40px)}
@media (max-width:640px){.pk-main{grid-template-columns:1fr}}

/* student login */
.start{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.start-card{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:16px}
.start-card h1{font-size:clamp(1.6rem,4vw,2.2rem)}
.start-note{color:var(--muted)}
.start-lbl{font-weight:600;font-size:.9rem;margin-bottom:8px}
.start-classes{display:flex;flex-wrap:wrap;gap:8px}
.start-classes .pk-cls{padding:9px 18px;font-size:1rem}
.start-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.st-name{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:.95rem}
.st-name:hover{border-color:var(--a)}
.st-name[aria-pressed=true]{background:var(--a);color:var(--on-a);border-color:var(--a)}
.start-go{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--ok-soft);border-radius:12px;padding:12px 14px}
.start-foot{display:flex;gap:8px;justify-content:flex-end}
body.locked-scroll{overflow:hidden}
.stu-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:.92rem}
.stu-cls{font-family:var(--f-mono);font-weight:600;background:var(--a-soft);color:var(--a);border-radius:6px;padding:1px 7px;margin-left:4px}
.stu-line{font-size:1rem;margin-bottom:10px}

/* teacher page */
body:not(.teacher) .picker,body:not(.teacher) .pk-mini,body:not(.teacher) .pk-chip{display:none!important}
.t-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;padding:10px 14px;background:var(--b-soft);border:1px solid var(--b);border-radius:12px;font-size:.92rem}

/* not in list */
.st-missing{margin-top:10px;border:1px dashed var(--muted);background:transparent;color:var(--ink);border-radius:10px;padding:9px 14px;font-size:.95rem}
.st-missing:hover{border-color:var(--a);color:var(--a)}
.st-manual{margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.st-field{display:grid;gap:4px;flex:1 1 200px}
.st-field label{font-size:.85rem;font-weight:600}
.st-field input[type=text]{font-family:var(--f-body);font-size:1rem}
.st-err{flex-basis:100%;color:var(--bad);font-size:.88rem}
.pk-cls.other{font-family:var(--f-body);font-weight:500}
.st-manual-tag{font-size:.78rem;color:var(--b);background:var(--b-soft);border-radius:6px;padding:2px 8px;margin-left:6px}

/* pairs */
body.teacher .s-only{display:none!important}
body:not(.teacher) .t-only{display:none!important}
body.teacher .match-lock{display:none!important}
body.teacher #matchA{display:block!important}
.pairs{background:var(--surface);border:2px solid var(--a);border-radius:16px;padding:14px 16px;display:grid;gap:10px;margin-bottom:12px}
.pr-cls{font-family:var(--f-mono);font-weight:600;background:var(--a-soft);color:var(--a);border-radius:6px;padding:2px 8px}
.pr-present summary{cursor:pointer;color:var(--a);font-weight:600;font-size:.9rem}
.pr-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;margin-top:8px;font-size:.9rem}
.pr-names label{display:flex;gap:6px;align-items:center}
.pr-code{font-size:1.05rem;padding:6px 12px;border-radius:10px;background:var(--b-soft)}
.pr-code b{font-family:var(--f-mono);font-size:1.3rem;letter-spacing:.04em}
.pr-list{margin:0;padding-left:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 18px;font-size:.95rem}
.pr-list:empty{display:none}
.pr-lead{font-size:.75rem;font-weight:600;color:var(--hit);background:var(--ok-soft);border-radius:6px;padding:1px 6px}
.pr-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pr-form label{font-weight:600;font-size:.9rem}
.pr-form input[type=text]{width:160px;font-size:1rem;font-family:var(--f-mono)}
.pr-mine{padding:10px 12px;border-radius:10px;font-size:.95rem}
.pr-mine.ok{background:var(--ok-soft)} .pr-mine.no{background:var(--bad-soft)}
.match-lock{background:var(--b-soft);border:2px dashed var(--b);border-radius:14px;padding:22px;text-align:center;font-size:1rem;line-height:1.6}

.pr-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.pr-role{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:500}
.pr-role .btn-ghost{padding:6px 16px;font-size:.95rem}
.pr-role .btn-ghost[aria-pressed=true]{background:var(--a);color:var(--on-a);border-color:var(--a)}
.pr-mine{background:var(--bg)}

.start-langs{display:flex;flex-wrap:wrap;gap:8px}
.start-langs .pk-cls{padding:9px 18px;font-size:1rem;font-family:var(--f-body);text-decoration:none;display:inline-block}
.start-hint{font-size:.82rem;color:var(--muted);margin-top:6px}
.live-ans{border-radius:12px;padding:12px 16px;background:var(--a-soft);border:1px solid var(--a);font-size:1.05rem;margin-bottom:10px}
.live-ans.me{background:var(--b-soft);border:2px solid var(--b);font-size:1.15rem}
.pk-live{font-size:.75rem;font-weight:600;color:var(--hit);background:var(--ok-soft);border-radius:6px;padding:2px 8px;margin-left:8px}
/* exit lesson */
.stu-btns{display:flex;flex-wrap:wrap;gap:6px}
.stu-btns .exit-btn{color:var(--bad);border-color:var(--bad)}
.exit-end{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.92rem}
.exit-main{padding:10px 18px;font-size:1rem}
.exit-dlg{position:fixed;inset:0;z-index:40;background:rgba(10,16,30,.55);display:grid;place-items:center;padding:16px}
.exit-card{max-width:440px;width:100%;background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.exit-card h2{font-size:1.2rem}
.exit-card p{color:var(--muted)}
.exit-row{display:flex;flex-wrap:wrap;gap:8px}
/* compare table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.94rem;min-width:520px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.y{color:var(--hit);font-weight:600} td.n{color:var(--bad);font-weight:600}
tr.set-col td:last-child, td.hl{background:var(--a-soft)}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}
.term .kz{font-weight:600}
.term .en{font-family:var(--f-mono);color:var(--a);font-size:.85rem}

/* set machine */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.lab>*{min-width:0}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:.85rem;font-weight:600}
input[type=text],textarea{width:100%;font:inherit;font-family:var(--f-mono);font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:.85rem}
.btn-ghost:hover{border-color:var(--a)}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.op{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;color:var(--ink)}
.op b{font-family:var(--f-mono);font-size:.95rem;display:block}
.op span{font-size:.78rem;color:var(--muted)}
.op:hover{border-color:var(--a)}
.op.danger b{color:var(--bad)}
.setbox{border:2px solid var(--a);border-radius:18px;background:var(--a-soft);padding:16px;min-height:150px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;position:relative}
.setbox::before{content:"s";position:absolute;top:-12px;left:14px;background:var(--surface);color:var(--a);font-family:var(--f-mono);font-weight:600;padding:0 6px}
.el{font-family:var(--f-mono);font-size:.92rem;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);transition:transform .3s,background .3s,opacity .3s}
.el.new{background:var(--hit-soft);transform:scale(1.08)}
.el.hit{background:var(--b-soft);border-color:var(--b)}
.el.gone{opacity:0;transform:scale(.6)}
.setbox .empty{color:var(--muted);font-family:var(--f-mono);font-size:.9rem;align-self:center}
.result{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:12px 14px;font-family:var(--f-mono);font-size:.86rem;overflow:auto;white-space:pre;max-height:230px}
.result .c{color:var(--code-muted)} .result .e{color:#FF8A8A} .result .r{color:#7FE0B4}
.venn-box{display:grid;gap:12px;align-content:start}

/* methods */
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.method{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.method .sig{font-family:var(--f-mono);font-weight:600;color:var(--a)}
.method .grp{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.method p{font-size:.9rem}
.method pre{margin:0;font-family:var(--f-mono);font-size:.8rem;background:var(--bg);padding:8px;border-radius:6px;overflow-x:auto}
.method button{justify-self:start}

/* editor */
.editor{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ed-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.ed-bar .title{font-weight:600;font-size:.9rem;margin-right:auto}
.ed-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.ed-body textarea.code{border:0;border-radius:0;background:var(--code-bg);color:var(--code-ink);min-height:260px;resize:vertical;line-height:1.5;padding:14px;tab-size:4;font-size:.88rem}
.ed-side{display:grid;grid-template-rows:auto 1fr;border-left:1px solid var(--line);min-width:0}
.ed-side .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 12px 0;font-weight:600}
.ed-side textarea.stdin{border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:56px;resize:vertical;background:var(--surface)}
.out{font-family:var(--f-mono);font-size:.86rem;padding:10px 12px;white-space:pre-wrap;word-break:break-word;min-height:120px;overflow:auto}
.out .err{color:var(--bad)}
.btn{background:var(--a);color:var(--on-a);border:0;border-radius:8px;padding:7px 14px;font-weight:600;font-size:.9rem}
.btn.alt{background:var(--hit)}
.btn:disabled{opacity:.5;cursor:wait}

/* tasks */
.levels{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lv{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.9rem}
.lv[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.task-list{display:grid;gap:18px}
.task{display:grid;gap:10px}
.task-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--a-soft);color:var(--a)}
.badge.B{background:var(--b-soft);color:var(--b)} .badge.C{background:var(--hit-soft);color:var(--hit)}
.status{font-size:.82rem;padding:3px 8px;border-radius:6px;margin-left:auto}
.status.done{background:var(--ok-soft);color:var(--hit);font-weight:600}
.task .desc{max-width:75ch}
.task .expect{font-size:.88rem;color:var(--muted)}
.verdict{padding:10px 12px;border-radius:8px;font-size:.92rem}
.verdict.ok{background:var(--ok-soft)} .verdict.no{background:var(--bad-soft)}
details{font-size:.9rem}
details summary{cursor:pointer;color:var(--a);font-weight:600}
details pre{font-family:var(--f-mono);font-size:.84rem;background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto}

/* quiz */
.quiz{display:grid;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.q pre{margin:0;background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:.88rem;padding:10px 12px;border-radius:8px;overflow-x:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;text-align:left;font-family:var(--f-mono);font-size:.86rem}
.opt.right{background:var(--ok-soft);border-color:var(--hit)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.q .why{font-size:.9rem;color:var(--muted)}
.score{font-family:var(--f-display);font-size:1.1rem}

/* reflection */
.refl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.93rem}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--hit)}
.card textarea{font-family:var(--f-body);min-height:52px;resize:vertical}
.card label{font-size:.88rem;font-weight:600}
footer{padding-block:28px 40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
.reset-box{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.reset-btn{color:var(--bad);border-color:var(--bad)}
.reset-ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink)}
.reset-ask[hidden],.reset-done[hidden]{display:none}
.btn.danger{background:var(--bad);color:var(--on-a)}

@media (max-width:820px){
  .hero,.lab{grid-template-columns:1fr}
  .ed-body{grid-template-columns:1fr}
  .ed-side{border-left:0;border-top:1px solid var(--line)}
  .brand{display:none}
  nav{margin-left:0;flex-wrap:nowrap;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CUR_LANG='kz';
const store={get(k,d){try{const v=localStorage.getItem('setlab2:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('setlab2:'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- Python runner ---------- */
function runPython(code,inputs){
  return new Promise(resolve=>{
    if(typeof Sk==='undefined'){resolve({out:'',err:'Python интерпретаторы жүктелмеді. Интернетке қосылуды тексеріп, бетті жаңартыңыз.'});return;}
    let out='';const q=(inputs||[]).slice();
    Sk.configure({output:t=>{out+=t},__future__:Sk.python3,execLimit:5000,yieldLimit:200,
      read:x=>{if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[x]===undefined)throw "Файл табылмады: "+x;return Sk.builtinFiles.files[x];},
      inputfunTakesPrompt:true,
      inputfun:p=>{if(p)out+=p;if(!q.length)throw new Sk.builtin.EOFError("input() үшін кіріс деректері жоқ: оларды «Енгізу» өрісіне жазыңыз");const v=q.shift();out+=(p?'':'')+'';return v;}});
    Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,code,true))
      .then(()=>resolve({out,err:null}))
      .catch(e=>{let m=e.toString();if(/TimeLimitError/.test(m))m='Бағдарлама тым ұзақ жұмыс істеп тұр. Мүмкін, шексіз цикл.';
        else if(/bad token/.test(m)){const bare=code.replace(/#.*$/gm,'').replace(/(["']).*?\1/g,'');const ln=bare.split('\n').findIndex(l=>/[Ѐ-ӿ]/.test(l));
          if(ln>=0)m=`${ln+1}-жолда тырнақшадан тыс кирилл әріптері бар, мысалы айнымалының немесе әдістің атында. Пернетақтаны ағылшын тіліне ауыстырып, атын латынша жазыңыз.\n(${m})`;}
        resolve({out,err:m});});
  });
}
/* set printing order differs between interpreters: turn every {..} into a sorted [..] */
function splitTop(s){const parts=[];let d=0,q=null,cur='';for(const ch of s){if(q){cur+=ch;if(ch===q)q=null;continue}if(ch==="'"||ch==='"'){q=ch;cur+=ch;continue}if('([{'.includes(ch))d++;if(')]}'.includes(ch))d--;if(ch===','&&d===0){parts.push(cur.trim());cur='';continue}cur+=ch}if(cur.trim())parts.push(cur.trim());return parts}
function norm(text){
  let t=text.replace(/set\(\)/g,'[]');
  t=t.replace(/\{([^{}:]*)\}/g,(m,inner)=>{const p=splitTop(inner);const num=p.every(x=>/^-?\d+(\.\d+)?$/.test(x));
    p.sort(num?(a,b)=>a-b:(a,b)=>{const x=a.replace(/^['"]|['"]$/g,''),y=b.replace(/^['"]|['"]$/g,'');return x<y?-1:x>y?1:0});return '['+p.join(', ')+']';});
  return t.replace(/"/g,"'").replace(/[ \t]+\n/g,'\n').trim();
}

/* ---------- editor component ---------- */
function makeEditor(host,{title,code,stdin,extraBtns,compact}){
  host.classList.add('editor');if(compact)host.classList.add('compact');
  host.innerHTML=`<div class="ed-bar"><span class="title">${esc(title)}</span><button class="btn run" type="button">▶ Іске қосу</button></div>
  <div class="ed-body"><textarea class="code" spellcheck="false" aria-label="Python коды"></textarea>
  <div class="ed-side"><div><div class="lbl">Енгізу</div><textarea class="stdin" spellcheck="false" aria-label="Кіріс деректері"></textarea></div>
  <div><div class="lbl">Шығару</div><div class="out" aria-live="polite"></div></div></div></div>`;
  const ta=host.querySelector('textarea.code'),si=host.querySelector('textarea.stdin'),out=host.querySelector('.out'),run=host.querySelector('.run');
  ta.value=code||'';si.value=stdin||'';
  ta.addEventListener('keydown',e=>{if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('    ',s,ta.selectionEnd,'end');}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run.click();}});
  run.addEventListener('click',async()=>{run.disabled=true;out.textContent='…';
    const inputs=si.value===''?[]:si.value.split('\n');const r=await runPython(ta.value,inputs);
    out.innerHTML=esc(r.out)+(r.err?`<span class="err">${esc(r.err)}</span>`:'')||'<span style="opacity:.6">(бос)</span>';
    if(!r.out&&!r.err)out.innerHTML='<span style="opacity:.6">(бағдарлама ештеңе шығармады)</span>';run.disabled=false;});
  if(extraBtns)extraBtns(host.querySelector('.ed-bar'));
  return {ta,si,out,run};
}

function matcher(host,key,pairs,codeLeft){
  const order=store.get(key+':order',null)||pairs.map((_,i)=>i).sort(()=>Math.random()-.5);store.set(key+':order',order);
  let links=store.get(key+':links',{}),sel=null,checked=false;
  host.innerHTML=`<div class="m-cols"><div class="m-col m-left"></div><div class="m-col m-right"></div></div>
   <div class="m-bar"><button class="btn alt" type="button">Тексеру</button><button class="btn-ghost" type="button">Тазалау</button><span class="m-res" aria-live="polite"></span></div>`;
  const L=host.querySelector('.m-left'),Rt=host.querySelector('.m-right'),res=host.querySelector('.m-res');
  const [bCheck,bReset]=host.querySelectorAll('.m-bar button');
  function draw(){
    const usedBy={};Object.entries(links).forEach(([l,r])=>usedBy[r]=+l);
    L.innerHTML=pairs.map((pr,i)=>{const r=links[i];const st=checked&&r!==undefined?(r===i?' ok':' bad'):'';
      return `<button type="button" class="m-item${sel===i?' sel':''}${r!==undefined?' linked':''}${st}" data-l="${i}">${r!==undefined?`<span class="m-tag">${order.indexOf(r)+1}</span>`:''}${codeLeft?`<code class="m-code">${esc(pr[0])}</code>`:`<code>${esc(pr[0])}</code>`}</button>`;}).join('');
    Rt.innerHTML=order.map((ri,k)=>{const used=usedBy[ri]!==undefined;
      return `<button type="button" class="m-item m-opt${used?' linked':''}" data-r="${ri}"><span class="m-tag">${k+1}</span><span>${esc(pairs[ri][1])}</span></button>`;}).join('');
    L.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.l;checked=false;res.textContent='';
      if(links[i]!==undefined&&sel!==i){delete links[i];sel=null;}else sel=(sel===i?null:i);store.set(key+':links',links);draw();}));
    Rt.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{if(sel===null){res.textContent='Алдымен сол жақтағы элементті таңдаңыз.';return;}
      const r=+b.dataset.r;for(const k in links)if(links[k]===r)delete links[k];links[sel]=r;sel=null;checked=false;res.textContent='';store.set(key+':links',links);draw();}));
  }
  bCheck.addEventListener('click',()=>{const n=Object.keys(links).length;checked=true;const ok=pairs.filter((_,i)=>links[i]===i).length;
    res.textContent=n<pairs.length?`${pairs.length} жұптың ${n} жалғанды. Дұрысы: ${ok}.`:(ok===pairs.length?`Барлық ${ok} жұп дұрыс. Керемет!`:`${pairs.length} жұптың ${ok} дұрыс. Қызыл жұптарды түзетіңіз.`);draw();});
  bReset.addEventListener('click',()=>{links={};sel=null;checked=false;res.textContent='';store.set(key+':links',links);draw();});
  draw();
}

const isNumStr=x=>/^-?\d+(\.\d+)?$/.test(x);
const lit=v=>typeof v==='number'?String(v):`'${v}'`;
const toVal=x=>{x=x.trim();const q=/^(["']).*\1$/.test(x)&&x.length>=2;if(q)return x.slice(1,-1);return isNumStr(x)?Number(x):x;};
const cmpMix=(a,b)=>typeof a!==typeof b?(typeof a==='number'?-1:1):(typeof a==='number'?a-b:(a<b?-1:a>b?1:0));
const mixedTypes=()=>new Set(S.map(v=>typeof v)).size>1;
function fmtSet(){if(!S.length)return 'set()';return '{'+S.slice().sort(cmpMix).map(lit).join(', ')+'}';}
function drawSet(mark,cls){const box=$('#setbox');
  if(!S.length){box.innerHTML='<span class="empty">s = set()  — бос жиын</span>';return;}
  box.innerHTML=S.map(v=>`<span class="el${v===mark?' '+cls:''}">${esc(lit(v))}</span>`).join('');
  if(mark!==undefined)setTimeout(()=>box.querySelectorAll('.el.new,.el.hit').forEach(e=>e.classList.remove('new','hit')),900);}
function addLog(code,res,kind){log.push({code,res,kind});if(log.length>14)log.shift();
  const el=$('#labLog');el.innerHTML=log.map(l=>`${esc(l.code)}${l.res!==null?`\n<span class="${l.kind||'r'}">${esc(l.res)}</span>`:''}`).join('\n');el.scrollTop=el.scrollHeight;}
function loadM(k){S=mPresets[k].slice();log=[];$('#labLog').innerHTML='';addLog('s = '+fmtSet(),null);drawSet();}
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>loadM(b.dataset.preset)));
document.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>{
  const raw=$('#xval').value,x=toVal(raw),op=b.dataset.op,has=S.includes(x);
  const needX=['add','remove','discard','in'].includes(op);
  if(needX&&raw.trim()===''){addLog('# x мәнін енгізіңіз','',null);return;}
  if(op==='add'){const wasMixed=mixedTypes();if(!has)S.push(x);addLog(`s.add(${lit(x)})`,has?`# ${lit(x)} бар — жиын өзгерген жоқ: ${fmtSet()}`:`# ${fmtSet()}`,has?'c':'r');
    if(!has&&!wasMixed&&mixedTypes())addLog('# Назар аударыңыз: енді s ішінде сандар да, жолдар да бар.','# Python бұған рұқсат береді, бірақ әдетте элементтер бір типті болады.\n# Мұндай жиын үшін sorted(s) TypeError береді.','c');
    drawSet(x,has?'hit':'new');}
  else if(op==='remove'){if(has){S=S.filter(v=>v!==x);addLog(`s.remove(${lit(x)})`,`# ${fmtSet()}`);drawSet();}else{addLog(`s.remove(${lit(x)})`,`KeyError: ${lit(x)}`,'e');}}
  else if(op==='discard'){if(has)S=S.filter(v=>v!==x);addLog(`s.discard(${lit(x)})`,has?`# ${fmtSet()}`:`# ${lit(x)} элементі жоқ, бірақ қате болмайды: ${fmtSet()}`,has?'r':'c');drawSet();}
  else if(op==='in'){addLog(`print(${lit(x)} in s)`,has?'True':'False');drawSet(has?x:undefined,'hit');}
  else if(op==='pop'){if(!S.length){addLog('s.pop()',"KeyError: 'pop from an empty set'",'e');}else{const i=Math.floor(Math.random()*S.length),v=S[i];S.splice(i,1);addLog('print(s.pop())',lit(v)+`   # кез келген элемент; қалғаны ${fmtSet()}`);drawSet();}}
  else if(op==='clear'){S=[];addLog('s.clear()','# set()');drawSet();}
  else if(op==='len'){addLog('print(len(s))',String(S.length));}
}));

let qState=store.get('quiz',{});
function renderQuiz(){
  $('#quiz').innerHTML=quiz.map((q,i)=>`<div class="q"><h3>${i+1}-сұрақ</h3>${q[0].startsWith('НЕ')?`<p>${esc(q[0])}</p>`:`<pre>${esc(q[0])}</pre>`}
    <div class="opts">${q[1].map((o,j)=>`<button class="opt" type="button" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join('')}</div><p class="why" hidden></p></div>`).join('');
  document.querySelectorAll('#quiz .opt').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.q;if(qState[i]!==undefined)return;qState[i]=+b.dataset.o;store.set('quiz',qState);paintQ(i);score();}));
  Object.keys(qState).forEach(i=>{if(quiz[+i])paintQ(+i);});score();
}

$('#olyCheck').addEventListener('click',async()=>{
  if(olyDone>=olySteps.length)return;const st=olySteps[olyDone],v=$('#olyVerdict');v.hidden=false;v.className='verdict';v.textContent='Тексерілуде…';
  const code=olyEd.ta.value,clean=code.replace(/#.*$/gm,'');
  const probe=code+"\ntry:\n    print('@@CHK@@', isinstance(participants, set), len(participants), sorted(participants))\nexcept NameError:\n    print('@@CHK@@ NONE')\n";
  const r=await runPython(probe,[]);let fail=null,reachTo=-1;
  const lines=r.out.split('\n'),chk=lines.find(l=>l.startsWith('@@CHK@@')),visible=lines.filter(l=>!l.startsWith('@@CHK@@')).join('\n');
  if(r.err)fail='Бағдарлама қатемен аяқталды:\n'+r.err;
  else if(!chk||chk.includes('NONE')){const w=cyrName(code,'participants');
    fail=w?`«${w}» айнымалысының атында кирилл әріптері бар (олар латын әріптеріне ұқсайды). Пернетақтаны ағылшын тіліне ауыстырып, атын қайта жазыңыз: participants`:'participants айнымалысы табылмады. Атын дәл осылай, латын әріптерімен жазыңыз: participants';}
  else{const isSet=chk.includes('@@CHK@@ True'),mm=chk.match(/@@CHK@@ \w+ (\d+) (.*)$/),len=mm?+mm[1]:-1,lst=mm?mm[2]:'';
    const evalStep=k=>{const S=olySteps[k].state;
      if(S.len!==undefined&&len!==S.len)return `Қазір participants ішінде ${len} элемент бар, ал ${S.len} болуы керек.\nҚазір: ${lst}`;
      const miss=(S.has||[]).filter(x=>!lst.includes(`'${x}'`));if(miss.length)return `participants ішінде мыналар жетіспейді: ${miss.join(', ')}.`;
      const extra=(S.not||[]).filter(x=>lst.includes(`'${x}'`));if(extra.length)return `participants ішінде мыналар болмауы керек: ${extra.join(', ')}.`;
      return null;};
    const outsMiss=(from,to)=>{const o=norm(visible);let pos=0;for(let k=from;k<=to;k++)for(const x of (olySteps[k].out||[])){const q=o.indexOf(norm(x),pos);if(q<0)return [k,x];pos=q+norm(x).length;}return null;};
    const needMiss=k=>olySteps[k].need.filter(n=>!clean.includes(n));
    if(!isSet)fail='participants тізім емес, жиын (set) болуы керек.';
    else{
      for(let k=olySteps.length-1;k>=olyDone;k--){
        if(evalStep(k)||outsMiss(olyDone,k))continue;
        let ok=true;for(let q=olyDone;q<=k;q++)if(needMiss(q).length){ok=false;break;}
        if(ok){reachTo=k;break;}
      }
      if(reachTo<0){
        fail=evalStep(olyDone);
        if(!fail){const om=outsMiss(olyDone,olyDone);if(om)fail=`Нәтижеде «${om[1]}» табылмады. ${st.d}\nКеңес: ${st.hint}\n\nСіздің нәтижеңіз:\n${visible.trim()||'(бос)'}`;}
        if(!fail){const miss=needMiss(olyDone);if(miss.length)fail='Нәтиже дұрыс, бірақ осы қадамда мынаны қолдану керек: '+miss.map(m=>m.trim().replace(/^\./,'').replace(/\($/,'()')).join(', ')+'.';}
        if(!fail)fail='Қадам әзірге орындалмады. Тапсырма мен кеңесті қайта оқыңыз.';
      }
    }
  }
  olyTries[olyDone]=(olyTries[olyDone]||0)+1;store.set('olyTries',olyTries);
  if(fail){v.className='verdict no';v.style.whiteSpace='pre-wrap';v.textContent=fail;renderOly();return;}
  const from=olyDone+1,to=reachTo+1;
  v.className='verdict ok';v.textContent=(from===to?`${from}-қадам орындалды!`:`${from}–${to}-қадамдар орындалды!`)+(to<olySteps.length?` ${to+1}-қадам ашылды: кодты төменде жалғастырыңыз.`:'');
  olyDone=to;store.set('olyDone',olyDone);
  if(olyDone<olySteps.length){olyEd.ta.value=olyEd.ta.value.replace(/(\s*# \d+-қадам:[^\n]*)+\s*$/,'').replace(/\s*$/,'')+`\n\n# ${olyDone+1}-қадам: ${olySteps[olyDone].t.charAt(0).toLowerCase()+olySteps[olyDone].t.slice(1)}\n`;store.set('olyCode',olyEd.ta.value);}
  renderOly();
});

/* ---------- pairs ---------- */
function prRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function prHash(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function makePairs(cls,seed,mask){const all=CLASSES[cls]||[];const a=all.filter((_,i)=>mask&(1<<i));const r=prRng(seed*7919+prHash(cls));
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  const pairs=[];for(let i=0;i+1<a.length;i+=2)pairs.push([a[i],a[i+1]]);
  if(a.length%2){if(pairs.length)pairs[pairs.length-1].push(a[a.length-1]);else pairs.push([a[a.length-1]]);}return pairs;}
function parseCode(c){const m=String(c).replace(/\s+/g,'').toUpperCase().match(/^(\d{2})-([0-9A-F]{1,4})$/);return m?{seed:+m[1],mask:parseInt(m[2],16)}:null;}
// teacher side
let prPresentCls=null,prPresentSet=null;
function prDrawTeacher(){const cls=pkClass;$('#prCls').textContent=cls||'';
  if(!cls||!CLASSES[cls]){$('#prPresent').innerHTML='';$('#prHint').hidden=false;$('#prMake').disabled=true;return;}
  $('#prHint').hidden=true;$('#prMake').disabled=false;
  if(prPresentCls!==cls){prPresentCls=cls;prPresentSet=new Set(CLASSES[cls]);$('#prList').innerHTML='';$('#prCode').hidden=true;}
  $('#prPresent').innerHTML=CLASSES[cls].map((n,i)=>`<label><input type="checkbox" data-i="${i}" ${prPresentSet.has(n)?'checked':''}> ${esc(n)}</label>`).join('');
  $('#prPresent').querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{const n=CLASSES[cls][+cb.dataset.i];if(cb.checked)prPresentSet.add(n);else prPresentSet.delete(n);}));}
$('#prMake').addEventListener('click',()=>{const cls=pkClass;if(!cls||!CLASSES[cls])return;
  let mask=0;CLASSES[cls].forEach((n,i)=>{if(prPresentSet.has(n))mask|=(1<<i);});
  if(!mask){toast('Кемінде бір қатысып отырған оқушыны белгілеңіз.');return;}
  const seed=10+Math.floor(Math.random()*90);const code=`${seed}-${mask.toString(16).toUpperCase()}`;
  const pairs=makePairs(cls,seed,mask);liveWrite('pairs',{cls,pairs:pairs.map(x=>({m:x})),t:Date.now()});
  $('#prList').innerHTML=pairs.map(pr=>`<li><b>${esc(pr[0])}</b> <span class="pr-lead">орындайды</span> — ${pr.slice(1).map(esc).join(', ')}</li>`).join('');});

  else{box.innerHTML=`Серігің: <b>${esc(prState.partner)}</b>. Сәйкестендіруді серігің орындайды.`;board.hidden=true;lock.hidden=false;
    lock.innerHTML=`<b>Тапсырманы серігің орындайды — ${esc(prState.partner)}.</b><br>Серігіңнің компьютеріне барып, бірге жұмыс істеңдер: әр жұпты талқылап, «Тексеру» батырмасын бірге басыңдар.`;}}

/* ---------- owner check + live link teacher -> students ---------- */
const capUse=n=>(window.claude&&typeof window.claude.use==='function')?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(undefined);
let liveDb=null;
async function liveWrite(key,data){if(!teacherMode||!liveDb)return;try{await liveDb.doc('live/'+key).set(data);}catch(e){toast('Оқушыларға жіберу мүмкін болмады: '+(e&&e.code||'қате'));}}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{store.set('lang',b.dataset.lang);try{history.replaceState(null,'',location.pathname+location.search+(teacherMode?'#uchitel':''));}catch(e){}location.reload();}));
(async()=>{
  const u=await capUse('user');let owner=true;
  if(u!==undefined){try{owner=!!(u&&await u.isOwner());}catch(e){owner=false;}}
  if(!owner&&teacherMode){teacherMode=false;store.set('teacher',false);updateLocks();drawStudent();showTab();if(!student)openStart('first');prShowMine();toast('Мұғалім беті тек сайт иесінде ашылады.');}
  const d=await capUse('db');if(!d)return;liveDb=d;
  if(teacherMode){$('#pkLive').hidden=false;return;}
  const fresh=t=>t&&Date.now()-t<3*60*60*1000;
  d.doc('live/now').onSnapshot(snap=>{const box=$('#liveAns'),v=snap.exists?snap.data():null;
    if(!v||!student||v.cls!==student.cls||!v.name||!fresh(v.t)){box.hidden=true;return;}
    const me=v.name===student.name;box.hidden=false;box.className='live-ans s-only'+(me?' me':'');
    box.innerHTML=me?`<b>Қазір сен жауап бересің!</b>${v.q?` №${v.q} тұжырым.`:''}`:`Қазір жауап беретін: <b>${esc(v.name)}</b>${v.q?` — №${v.q} тұжырым`:''}`;},()=>{});
  d.doc('live/pairs').onSnapshot(snap=>{const v=snap.exists?snap.data():null;
    if(!v||!student||v.cls!==student.cls||!fresh(v.t)||!Array.isArray(v.pairs))return;
    const pr=v.pairs.map(x=>x&&x.m).find(m=>Array.isArray(m)&&m.includes(student.name));if(!pr)return;
    if(prState&&prState.t===v.t)return;
    const lead=pr[0]===student.name;prState={partner:lead?pr.slice(1).join(', '):pr[0],role:lead?'me':'partner',t:v.t,auto:true};store.set('pair',prState);prShowMine();
    const h=$('#prHow');if(h)h.textContent='Жұптарды мұғалім тағайындады. Қажет болса, серікті қолмен таңдауға болады.';},()=>{});
})();
