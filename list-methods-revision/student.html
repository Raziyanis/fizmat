<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Методы списка — повторение</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #15181d; --muted: #5b6471;
    --line: #dfe3e8; --accent: #1f6feb; --ok: #137333; --ok-bg: #e6f4ea;
    --bad: #b3261e; --bad-bg: #fce8e6; --warn: #8a5a00; --warn-bg: #fff4d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); padding: 16px;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .who { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .who b { color: var(--text); }
  .who button { width: auto; padding: 4px 10px; font-size: 13px; margin-left: 8px; }
  label.name { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 11px 12px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick button { width: auto; flex: 0 0 auto; }
  .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .names button { width: 100%; text-align: left; font-weight: 500; }
  .qnum { font-size: 13px; color: var(--muted); font-weight: 600; }
  .qtext { margin: 6px 0 10px; font-weight: 600; }
  pre {
    background: #11161d; color: #e8edf3; padding: 12px 14px; border-radius: 8px; overflow-x: auto;
    font: 14px/1.5 "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; margin: 0 0 12px;
  }
  .opt { display: block; margin: 0 0 8px; }
  .opt input { position: absolute; opacity: 0; }
  .opt span {
    display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    font: 15px/1.4 "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  .opt input:checked + span { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: #eef4ff; }
  .opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 13px 20px;
    font: 600 16px/1.2 inherit; font-family: inherit; cursor: pointer; width: 100%;
  }
  button:disabled { opacity: .55; cursor: default; }
  button.secondary { background: var(--card); color: var(--accent); border: 1px solid var(--accent); }
  button.quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .msg { padding: 11px 13px; border-radius: 8px; margin-bottom: 14px; font-size: 15px; }
  .msg.err { background: var(--bad-bg); color: var(--bad); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .progress { color: var(--muted); font-size: 14px; text-align: center; margin: 10px 0 18px; }
  .score { font-size: 34px; font-weight: 700; margin: 0; }
  .fb { border-left: 4px solid var(--line); padding-left: 12px; }
  .fb.ok { border-color: var(--ok); }
  .fb.bad { border-color: var(--bad); }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .fb .ans { font: 14px/1.5 "SF Mono", Menlo, Consolas, monospace; margin: 4px 0; }
  .fb .note { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .loading { color: var(--muted); text-align: center; padding: 40px 0; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171c22; --text: #e9edf2; --muted: #9aa5b1; --line: #2b323b;
      --accent: #4c8dff; --ok: #6fd58f; --ok-bg: #16301f; --bad: #ff8a80; --bad-bg: #351b19;
      --warn: #ffc06e; --warn-bg: #332814;
    }
    .opt input:checked + span { background: #1b2740; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="banner"></div>

  <div id="screen-loading" class="loading">Загружаем задания…</div>

  <!-- 1. выбор класса и фамилии -->
  <div id="screen-who" style="display:none">
    <h1>Методы списка: повторение</h1>
    <div class="sub">Выберите свой класс, затем найдите себя в списке.</div>

    <div class="card">
      <label class="name">Класс</label>
      <div class="pick" id="class-list"></div>
    </div>

    <div class="card" id="name-card" style="display:none">
      <label class="name">Фамилия и имя</label>
      <div class="names" id="name-list"></div>
      <div style="margin-top:12px">
        <button class="quiet" id="not-listed">Меня нет в списке</button>
      </div>
    </div>

    <div class="card" id="manual-card" style="display:none">
      <label class="name" for="manual-name">Напишите фамилию и имя</label>
      <input type="text" id="manual-name" autocomplete="name" placeholder="Например: Ахметов Алихан">
      <div class="sub" style="margin:8px 0 12px">Так, как вас записывают в журнале. Вас добавят в список класса.</div>
      <button id="manual-ok">Продолжить</button>
    </div>
  </div>

  <!-- 2. тест -->
  <div id="screen-test" style="display:none">
    <h1>Методы списка: повторение</h1>
    <div class="sub">Python. <span id="count"></span> заданий, по 1 баллу. После сдачи сразу увидите разбор своих ошибок.</div>
    <div class="who" id="who-line"></div>
    <div id="questions"></div>
    <div class="progress" id="progress"></div>
    <button id="submit">Сдать работу</button>
  </div>

  <!-- 3. результат -->
  <div id="screen-result" style="display:none">
    <h1>Результат</h1>
    <div class="card" style="text-align:center">
      <p class="score" id="score"></p>
      <div class="sub" id="score-sub" style="margin:0"></div>
    </div>
    <div id="feedback"></div>
    <button class="secondary" id="again">Пройти ещё раз</button>
  </div>

</div>

<script>
var DATA = null;
var answers = {};
var chosen = { klass: '', name: '', manual: false };
var QUEUE_KEY = 'listmethods.pending.v1';
var sending = false;

/* ---------- вспомогательное ---------- */

function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function show(id) {
  ['screen-loading', 'screen-who', 'screen-test', 'screen-result'].forEach(function (s) {
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
  window.scrollTo(0, 0);
}

function banner(text, kind) {
  var box = document.getElementById('banner');
  box.textContent = '';
  if (!text) return;
  box.appendChild(el('div', 'msg ' + (kind || 'err'), text));
}

function uid() {
  return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ---------- очередь на случай обрыва связи ---------- */

function queueRead() {
  try {
    return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  } catch (err) {
    return [];
  }
}

function queueWrite(list) {
  try {
    localStorage.setItem(QUEUE_KEY, JSON.stringify(list));
    return true;
  } catch (err) {
    return false;   // приватный режим или запрет хранилища
  }
}

function queueAdd(submission) {
  var list = queueRead();
  list.push(submission);
  return queueWrite(list);
}

function queueDrop(id) {
  queueWrite(queueRead().filter(function (s) { return s.uid !== id; }));
}

/** Пытается отправить всё, что лежит в очереди. */
function flushQueue(onDone) {
  var list = queueRead();
  if (!list.length || sending) {
    if (onDone) onDone(false);
    return;
  }
  sending = true;
  var item = list[0];

  google.script.run
    .withSuccessHandler(function (result) {
      sending = false;
      queueDrop(item.uid);
      banner('Ответ отправлен учителю.', 'ok');
      if (document.getElementById('screen-result').style.display !== 'block') {
        showResult(result);
      }
      flushQueue(onDone);
    })
    .withFailureHandler(function () {
      sending = false;
      if (onDone) onDone(false);
    })
    .submitAnswers(item);
}

function pendingNotice() {
  var n = queueRead().length;
  if (n) {
    banner('Ответ сохранён на этом устройстве и будет отправлен, когда появится интернет. ' +
           'Не закрывайте страницу надолго и не очищайте данные браузера.', 'warn');
  }
}

/* ---------- загрузка ---------- */

function start() {
  google.script.run
    .withSuccessHandler(function (data) {
      DATA = data;
      banner('');
      renderWho();
      pendingNotice();
      flushQueue();
    })
    .withFailureHandler(function (err) {
      document.getElementById('screen-loading').textContent = '';
      banner('Не удалось загрузить задания: ' + (err && err.message ? err.message : err) +
             ' — покажите это сообщение учителю.', 'err');
    })
    .getStudentData();
}

/* ---------- экран выбора ---------- */

function renderWho() {
  show('screen-who');
  var box = document.getElementById('class-list');
  box.textContent = '';

  if (!DATA.classes || !DATA.classes.length) {
    document.getElementById('class-list').parentNode.style.display = 'none';
    document.getElementById('manual-card').style.display = 'block';
    return;
  }

  DATA.classes.forEach(function (c) {
    var b = el('button', 'secondary', c.klass);
    b.addEventListener('click', function () { chooseClass(c); });
    box.appendChild(b);
  });
}

function chooseClass(c) {
  chosen.klass = c.klass;
  chosen.name = '';
  chosen.manual = false;

  document.getElementById('name-card').style.display = 'block';
  document.getElementById('manual-card').style.display = 'none';

  var list = document.getElementById('name-list');
  list.textContent = '';
  c.students.forEach(function (name) {
    var b = el('button', 'secondary', name);
    b.addEventListener('click', function () {
      chosen.name = name;
      chosen.manual = false;
      renderTest();
    });
    list.appendChild(b);
  });

  document.getElementById('name-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('not-listed').addEventListener('click', function () {
  document.getElementById('manual-card').style.display = 'block';
  document.getElementById('manual-name').focus();
});

document.getElementById('manual-ok').addEventListener('click', function () {
  var name = document.getElementById('manual-name').value.trim();
  if (name.split(/\s+/).length < 2) {
    banner('Напишите и фамилию, и имя.', 'err');
    return;
  }
  banner('');
  chosen.name = name;
  chosen.manual = true;
  if (!chosen.klass && DATA.classes && DATA.classes.length) {
    banner('Сначала выберите класс.', 'err');
    return;
  }
  renderTest();
});

/* ---------- экран теста ---------- */

function renderTest() {
  show('screen-test');
  document.getElementById('count').textContent = DATA.total;

  var who = document.getElementById('who-line');
  who.textContent = '';
  who.appendChild(el('span', null, 'Отвечает: '));
  who.appendChild(el('b', null, (chosen.klass ? chosen.klass + ', ' : '') + chosen.name));
  var change = el('button', 'quiet', 'Это не я');
  change.addEventListener('click', function () { renderWho(); });
  who.appendChild(change);

  var box = document.getElementById('questions');
  if (box.childNodes.length) return;   // задания уже отрисованы

  DATA.questions.forEach(function (q, i) {
    var card = el('div', 'card');
    card.appendChild(el('div', 'qnum', 'Задание ' + (i + 1) + ' · ' + q.topic));
    card.appendChild(el('div', 'qtext', q.text));
    card.appendChild(el('pre', null, q.code));

    q.options.forEach(function (opt, idx) {
      var label = el('label', 'opt');
      var radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = q.id;
      radio.value = String(idx);
      radio.addEventListener('change', function () {
        answers[q.id] = idx;
        updateProgress();
      });
      label.appendChild(radio);
      label.appendChild(el('span', null, opt));
      card.appendChild(label);
    });
    box.appendChild(card);
  });
  updateProgress();
}

function updateProgress() {
  document.getElementById('progress').textContent =
    'Отвечено ' + Object.keys(answers).length + ' из ' + DATA.total;
}

/* ---------- сдача ---------- */

document.getElementById('submit').addEventListener('click', function () {
  var missing = DATA.questions.filter(function (q) { return !(q.id in answers); });
  if (missing.length) {
    banner('Не отвечено заданий: ' + missing.length + '. Ответьте на все и сдайте работу.', 'err');
    return;
  }
  banner('');

  var button = this;
  button.disabled = true;
  button.textContent = 'Отправляем…';

  var submission = {
    uid: uid(),
    klass: chosen.klass,
    name: chosen.name,
    addToClass: chosen.manual,
    answers: answers
  };

  google.script.run
    .withSuccessHandler(function (result) {
      button.disabled = false;
      button.textContent = 'Сдать работу';
      banner('');
      showResult(result);
    })
    .withFailureHandler(function (err) {
      button.disabled = false;
      button.textContent = 'Сдать работу';
      var saved = queueAdd(submission);
      if (saved) {
        banner('Нет связи с сервером. Ответ сохранён на этом устройстве и уйдёт сам, ' +
               'когда появится интернет — не закрывайте вкладку.', 'warn');
        retryLater();
      } else {
        banner('Нет связи, и сохранить ответ на устройстве не удалось: ' +
               (err && err.message ? err.message : err) +
               '. Не закрывайте страницу и нажмите «Сдать работу» ещё раз, когда появится интернет.', 'err');
      }
    })
    .submitAnswers(submission);
});

var retryTimer = null;
function retryLater() {
  if (retryTimer) return;
  retryTimer = setInterval(function () {
    if (!queueRead().length) {
      clearInterval(retryTimer);
      retryTimer = null;
      return;
    }
    flushQueue();
  }, 20000);
}

window.addEventListener('online', function () {
  banner('Интернет появился, отправляем ответ…', 'warn');
  flushQueue();
});

/* ---------- результат ---------- */

function showResult(result) {
  show('screen-result');
  document.getElementById('score').textContent = result.score + ' / ' + result.total;
  var wrong = result.total - result.score;
  document.getElementById('score-sub').textContent = wrong === 0
    ? 'Все задания верно.'
    : 'Ошибок: ' + wrong + '. Разбор ниже.';

  var box = document.getElementById('feedback');
  box.textContent = '';
  result.feedback.forEach(function (f, i) {
    var card = el('div', 'card');
    var fb = el('div', 'fb ' + (f.ok ? 'ok' : 'bad'));
    fb.appendChild(el('div', 'qnum', 'Задание ' + (i + 1) + ' · ' + f.topic));
    fb.appendChild(el('span', 'tag ' + (f.ok ? 'ok' : 'bad'), f.ok ? 'Верно' : 'Ошибка'));
    fb.appendChild(el('div', 'qtext', f.text));
    fb.appendChild(el('pre', null, f.code));
    if (!f.ok) {
      fb.appendChild(el('div', 'ans', 'Ваш ответ: ' + (f.given >= 0 ? f.options[f.given] : '—')));
      fb.appendChild(el('div', 'ans', 'Правильно: ' + f.options[f.correct]));
    } else {
      fb.appendChild(el('div', 'ans', 'Ответ: ' + f.options[f.correct]));
    }
    fb.appendChild(el('div', 'note', f.note));
    card.appendChild(fb);
    box.appendChild(card);
  });
}

document.getElementById('again').addEventListener('click', function () {
  window.location.reload();
});

start();
</script>
</body>
</html>
