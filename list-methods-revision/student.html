<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Методы списка — повторение</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #15181d;
    --muted: #5b6471;
    --line: #dfe3e8;
    --accent: #1f6feb;
    --ok: #137333;
    --ok-bg: #e6f4ea;
    --bad: #b3261e;
    --bad-bg: #fce8e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label.name { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%;
    padding: 11px 12px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .qnum { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .qtext { margin: 6px 0 10px; font-weight: 600; }
  pre {
    background: #11161d;
    color: #e8edf3;
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    font: 14px/1.5 "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    margin: 0 0 12px;
  }
  .opt { display: block; margin: 0 0 8px; }
  .opt input { position: absolute; opacity: 0; }
  .opt span {
    display: block;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    font: 15px/1.4 "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  .opt input:checked + span { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: #eef4ff; }
  .opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 13px 20px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: .55; cursor: default; }
  button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .msg { padding: 11px 13px; border-radius: 8px; margin-bottom: 14px; font-size: 15px; }
  .msg.err { background: var(--bad-bg); color: var(--bad); }
  .progress { color: var(--muted); font-size: 14px; text-align: center; margin: 10px 0 18px; }
  .score { font-size: 34px; font-weight: 700; margin: 0; }
  .fb { border-left: 4px solid var(--line); padding-left: 12px; margin-bottom: 18px; }
  .fb.ok { border-color: var(--ok); }
  .fb.bad { border-color: var(--bad); }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .fb .ans { font: 14px/1.5 "SF Mono", Menlo, Consolas, monospace; margin: 4px 0; }
  .fb .note { color: var(--muted); font-size: 14px; margin-top: 6px; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171c22; --text: #e9edf2; --muted: #9aa5b1;
      --line: #2b323b; --accent: #4c8dff; --ok: #6fd58f; --ok-bg: #16301f;
      --bad: #ff8a80; --bad-bg: #351b19;
    }
    .opt input:checked + span { background: #1b2740; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="screen-test">
    <h1>Методы списка: повторение</h1>
    <div class="sub">Python. <span id="count"></span> заданий, по 1 баллу. Ответьте на все вопросы и нажмите «Сдать» — сразу увидите разбор своих ошибок.</div>

    <div id="error" class="msg err" style="display:none"></div>

    <div class="card">
      <label class="name" for="name">Фамилия и имя</label>
      <input type="text" id="name" autocomplete="name" placeholder="Например: Ахметов Алихан">
    </div>

    <div id="questions"></div>

    <div class="progress" id="progress"></div>
    <button id="submit">Сдать работу</button>
  </div>

  <div id="screen-result" style="display:none">
    <h1>Результат</h1>
    <div class="card" style="text-align:center">
      <p class="score" id="score"></p>
      <div class="sub" id="score-sub" style="margin:0"></div>
    </div>
    <div id="feedback"></div>
    <button class="secondary" id="again">Пройти ещё раз</button>
  </div>

</div>

<script>
var DATA = <?!= payload ?>;
var answers = {};

function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function render() {
  document.getElementById('count').textContent = DATA.total;
  if (DATA.email) {
    var input = document.getElementById('name');
    input.value = DATA.email;
    input.readOnly = true;
  }

  var box = document.getElementById('questions');
  DATA.questions.forEach(function (q, i) {
    var card = el('div', 'card');
    card.appendChild(el('div', 'qnum', 'Задание ' + (i + 1) + ' · ' + q.topic));
    card.appendChild(el('div', 'qtext', q.text));
    card.appendChild(el('pre', null, q.code));

    q.options.forEach(function (opt, idx) {
      var label = el('label', 'opt');
      var radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = q.id;
      radio.value = String(idx);
      radio.addEventListener('change', function () {
        answers[q.id] = idx;
        updateProgress();
      });
      label.appendChild(radio);
      label.appendChild(el('span', null, opt));
      card.appendChild(label);
    });

    box.appendChild(card);
  });
  updateProgress();
}

function updateProgress() {
  var done = Object.keys(answers).length;
  document.getElementById('progress').textContent = 'Отвечено ' + done + ' из ' + DATA.total;
}

function showError(text) {
  var node = document.getElementById('error');
  node.textContent = text;
  node.style.display = text ? 'block' : 'none';
  if (text) window.scrollTo(0, 0);
}

document.getElementById('submit').addEventListener('click', function () {
  var name = document.getElementById('name').value.trim();
  if (!name) {
    showError('Укажите фамилию и имя.');
    return;
  }

  var missing = DATA.questions.filter(function (q) { return !(q.id in answers); });
  if (missing.length) {
    showError('Не отвечено заданий: ' + missing.length + '. Ответьте на все и сдайте работу.');
    return;
  }
  showError('');

  var button = this;
  button.disabled = true;
  button.textContent = 'Отправляем…';

  google.script.run
    .withSuccessHandler(showResult)
    .withFailureHandler(function (err) {
      button.disabled = false;
      button.textContent = 'Сдать работу';
      showError('Не удалось отправить: ' + err.message);
    })
    .submitAnswers({ name: name, answers: answers });
});

function showResult(result) {
  document.getElementById('screen-test').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';

  document.getElementById('score').textContent = result.score + ' / ' + result.total;
  var wrong = result.total - result.score;
  document.getElementById('score-sub').textContent = wrong === 0
    ? 'Все задания верно.'
    : 'Ошибок: ' + wrong + '. Разбор ниже.';

  var box = document.getElementById('feedback');
  box.textContent = '';
  result.feedback.forEach(function (f, i) {
    var card = el('div', 'card');
    var fb = el('div', 'fb ' + (f.ok ? 'ok' : 'bad'));
    fb.appendChild(el('div', 'qnum', 'Задание ' + (i + 1) + ' · ' + f.topic));
    fb.appendChild(el('span', 'tag ' + (f.ok ? 'ok' : 'bad'), f.ok ? 'Верно' : 'Ошибка'));
    fb.appendChild(el('div', 'qtext', f.text));
    fb.appendChild(el('pre', null, f.code));
    if (!f.ok) {
      fb.appendChild(el('div', 'ans', 'Ваш ответ: ' + (f.given >= 0 ? f.options[f.given] : '—')));
      fb.appendChild(el('div', 'ans', 'Правильно: ' + f.options[f.correct]));
    } else {
      fb.appendChild(el('div', 'ans', 'Ответ: ' + f.options[f.correct]));
    }
    fb.appendChild(el('div', 'note', f.note));
    card.appendChild(fb);
    box.appendChild(card);
  });

  window.scrollTo(0, 0);
}

document.getElementById('again').addEventListener('click', function () {
  window.location.reload();
});

render();
</script>
</body>
</html>
