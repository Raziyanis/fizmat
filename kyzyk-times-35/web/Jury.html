  .wrap { max-width: 1560px; margin: 0 auto; padding: 14px 16px 60px 40px; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header img { width: 120px; }
  header h1 { font-size: 20px; margin: 0; }
  header .upd { margin-left: auto; font-size: 12px; color: var(--ink-2); }
  .bar { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); }
  .bar .lbl { font-size: 12px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; }
  .stages button, .tabs button, .chipbtn {
    border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .stages button.on { background: var(--gold); border-color: var(--gold-d); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 14px; border: 0; font: inherit; font-weight: 700; cursor: pointer; color: #fff; }
  .toggle.open { background: var(--ok); } .toggle.closed { background: var(--bad); }
  .toggle.res { background: var(--ink-2); } .toggle.res.on { background: var(--sky-d); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tabs button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-left: 6px; vertical-align: middle; }
  section { margin-top: 14px; }
  h2 { font-size: 22px; margin: 6px 0 4px; }
  .sub { color: var(--sky-d); margin: 0 0 12px; }
  .muted { color: var(--ink-2); font-size: 13px; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  thead th { background: var(--soft); font-size: 12px; color: var(--ink-2); position: sticky; top: 0; }
  thead th .key { display: block; font-weight: 600; color: var(--sky-d); text-transform: none; font-size: 12px; margin-top: 2px; }
  td.team { font-weight: 700; min-width: 120px; }
  td.sum, th.sum { text-align: right; font-weight: 800; font-size: 16px; }
  .cell { min-width: 96px; }
  table[data-round="r1"] .ans { font-size: 13px; }
  .ans { display: block; font-size: 14px; margin-bottom: 4px; word-break: break-word; }
  .ans.empty { color: #9AA9B8; font-style: italic; }
  .mark { border: 0; border-radius: 8px; padding: 3px 8px; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
  .mark.yes { background: var(--ok-l); color: var(--ok); } .mark.no { background: var(--bad-l); color: var(--bad); } .mark.unk { background: var(--gold-l); color: var(--gold-d); }
  .mark.ov { outline: 2px solid currentColor; }
  .mk { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .mk button { border: 1.5px solid var(--line); background: #fff; border-radius: 7px; padding: 2px 8px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; color: #9AA9B8; }
  .mk button.y.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .mk button.n.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .mk .ov { font-size: 11px; color: var(--gold-d); font-weight: 700; }
  .mk .lnk { border: 0; background: none; color: var(--sky-d); text-decoration: underline; font-weight: 600; font-size: 12px; padding: 2px 2px; }
  .syn { display: inline-flex; align-items: center; gap: 2px; background: var(--ok-l); color: var(--ok); border-radius: 6px; padding: 1px 6px; font-size: 11px; font-weight: 700; margin: 2px 2px 0 0; text-transform: none; }
  .syn button { border: 0; background: none; color: var(--ok); cursor: pointer; font-weight: 800; padding: 0 2px; }
  .adj { display: grid; gap: 2px; justify-items: end; margin-top: 6px; font-size: 11px; color: var(--ink-2); font-weight: 600; }
  .adj input { width: 64px; text-align: right; }
  .unlock { margin-top: 6px; }
  input[type=number], input[type=text], input[type=password], select, textarea {
    font: inherit; padding: 7px 9px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
  }
  input[type=number] { width: 64px; }
  input:focus, select:focus, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; background: var(--ink); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .btn.danger { background: var(--bad); } .btn.light { background: var(--sky-l); color: var(--ink); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .idea { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #fff; }
  .idea h3 { margin: 0 0 6px; font-size: 18px; }
  .idea p { margin: 4px 0; font-size: 14px; white-space: pre-wrap; }
  .idea .crit { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .crit label { font-size: 12px; color: var(--ink-2); display: grid; gap: 3px; }
  .place { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--sky-l); font-weight: 800; }
  .place.p1 { background: var(--gold); } .place.p2 { background: #DDE5EC; } .place.p3 { background: #F1D3B0; }
  .ok { color: var(--ok); font-weight: 800; } .no { color: #9AA9B8; }
  .login { max-width: 360px; margin: 60px auto; border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: #fff; }
  .login input { width: 100%; font-size: 20px; letter-spacing: .3em; margin: 10px 0; }
  .msg { margin-top: 10px; padding: 9px 12px; border-radius: 10px; font-size: 14px; }
  .msg.err { background: var(--bad-l); color: #8A2A10; } .msg.ok { background: var(--ok-l); color: #11663A; } .msg.warn { background: var(--gold-l); color: #6B4E00; }
  .keyedit { display: grid; gap: 8px; margin-bottom: 14px; padding: 12px; border: 1px dashed var(--gold-d); border-radius: 12px; background: var(--gold-l); }
  .keyedit .row { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; }
  .keyedit input { width: 100%; }
  .toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 10px; font-size: 13px; color: var(--ink-2); align-items: center; }
</style>
</head>

      b.onclick = function () {
        var s = b.getAttribute('data-s');
        act('j_setState', [{ stage: s, open: true }], 'Кезең: ' + b.textContent).then(function () { tab = s === 'final' ? 'results' : s; renderAll(); });
      };
    });
    var ob = $('openBtn');
    ob.className = 'toggle ' + (st.open ? 'open' : 'closed');
    ob.textContent = st.open ? 'Жауап қабылдау: АШЫҚ · Приём открыт' : 'Жауап қабылдау: ЖАБЫҚ · Приём закрыт';
    ob.onclick = function () { act('j_setState', [{ open: !st.open }], st.open ? 'Қабылдау жабылды' : 'Қабылдау ашылды'); };
    var rb = $('resBtn');
    rb.className = 'toggle res' + (st.showResults ? ' on' : '');
    rb.textContent = st.showResults ? 'Нәтиже қатысушыларға көрінеді' : 'Нәтиже жасырын · Итоги скрыты';
    rb.onclick = function () { act('j_setState', [{ showResults: !st.showResults }], 'Сақталды'); };
    $('tabs').innerHTML = TABS.map(function (t) {
      var live = (t[0] === st.stage) || (t[0] === 'results' && st.stage === 'final');
      return '<button type="button" data-t="' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + (/^r\d$/.test(t[0]) ? 'Раунд ' : '') + t[1] + (live ? '<span class="dot" title="Қазіргі кезең"></span>' : '') + '</button>';
    }).join('');
    $('tabs').querySelectorAll('button').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); renderAll(); }; });
    renderView();
  }

  function compOf(id) { return D.computed.filter(function (c) { return c.id === id; })[0]; }

  // ------------------------------------------------------------ вкладки
  function renderView() {
    var v = $('view');
    if (tab === 'teams') v.innerHTML = teamsView();
    else if (tab === 'r1' || tab === 'r2' || tab === 'r3' || tab === 'r4') v.innerHTML = qView(tab);
    else if (tab === 'r5') v.innerHTML = r5View();
    else if (tab === 'r6') v.innerHTML = r6View();
    else if (tab === 'results') v.innerHTML = resultsView();
    else v.innerHTML = settingsView();
    bindView();
  }

  function teamsView() {
    if (!D.teams.length) return '<h2>Командалар</h2><p class="muted">Әзірге тіркелген команда жоқ. Қатысушылар өз бетінде тіркеледі. · Пока нет команд.</p>';
    var rows = D.teams.map(function (t, i) {
      var a = D.answers[t.id] || {};
      var subm = ['r1', 'r2', 'r3', 'r4', 'r6'].map(function (r) {
        var n = RT[r].n, got = a[r] ? (n ? a[r].answers.length : 1) : 0, full = n ? got >= n : got > 0;
        return '<span class="' + (got ? 'ok' : 'no') + '">' + r.slice(1) + (n ? ':' + got + '/' + n : (full ? '✓' : '·')) + '</span>';
      }).join(' ');
      var del = confirmDel === t.id
        ? '<button class="btn danger" type="button" data-del-yes="' + t.id + '">Иә, жою</button> <button class="btn light" type="button" data-del-no="1">Жоқ</button>'
        : '<button class="chipbtn" type="button" data-del="' + t.id + '">Жою</button>';
      return '<tr><td>' + (i + 1) + '</td><td class="team">' + esc(t.name) + (t.cls ? ' <span class="muted">' + esc(t.cls) + '</span>' : '') + '</td><td><b>' + esc(t.code) + '</b></td><td>' + esc(t.captain) + '</td><td>' + esc(t.motto) + '</td><td>' + (t.members || []).map(esc).join(', ') + '</td><td>' + subm + '</td><td>' + del + '</td></tr>';
    }).join('');
    return '<h2>Командалар · ' + D.teams.length + '</h2><p class="sub">Код — басқа құрылғыдан кіру үшін. Жауаптар: ✓ жіберілген раундтар.</p>' +
      '<div class="scroll"><table><thead><tr><th>№</th><th>Команда</th><th>Код</th><th>Капитан</th><th>Ұраны</th><th>Мүшелері</th><th>Жауаптар</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function keyLabel(rd, i) {
    if (rd === 'r4') return D.key.r4[i] === 'true' ? 'Ақиқат' : 'Жалған';
    if (rd === 'r3') return D.key.r3[i] ? D.key.r3[i].split(';')[0] : '— кілт жоқ —';
    return D.key[rd][i][0];
  }
  function ansLabel(rd, a) {
    if (rd === 'r4') return a === 'true' ? 'Ақиқат' : a === 'false' ? 'Жалған' : '';
    return a;
  }
  var unlockAsk = null;
  function unlockBtn(teamId, rd) {
    var k = teamId + ':' + rd;
    return unlockAsk === k
      ? '<div class="unlock"><button class="chipbtn" type="button" data-unlock-yes="' + rd + '" data-t="' + teamId + '" style="background:#FDE9E3">Растау: жауапты өшіру</button> <button class="chipbtn" type="button" data-unlock-no="1">Жоқ</button></div>'
      : '<div class="unlock"><button class="chipbtn" type="button" data-unlock="' + rd + '" data-t="' + teamId + '" title="Команда жауапты қайта жібере алады">Қайта ашу</button></div>';
  }
  function qView(rd) {
    var R = RT[rd];
    var head = '<h2>' + R.title + '</h2><p class="sub">Дұрыс жауап — ' + R.pts + ' ұпай. Жауапты қолмен бағалау: ✓ / ✗. «+ кілт» — жауапты синоним ретінде кілтке қосу (сол жауапты жазған барлық командаға есептеледі). «± түзету» — раунд ұпайын қолмен өзгерту.</p>';
    var keyEdit = '';
    if (rd === 'r3') {
      keyEdit = '<div class="keyedit"><b>Жауап кілті (әндер) · Ключ ответов</b><span class="muted">Әр әуенге дұрыс нұсқаларды «;» арқылы жазыңыз: мысалы «Димаш; Dimash; Махаббат бер маған». Кілт болмаса — белгіні қолмен қойыңыз.</span>' +
        [0, 1, 2, 3, 4].map(function (i) { return '<div class="row"><b>' + (i + 1) + '</b><input type="text" id="k3_' + i + '" value="' + esc(D.key.r3[i]) + '"></div>'; }).join('') +
        '<div><button class="btn" type="button" id="saveK3">Кілтті сақтау</button></div></div>';
    }
    if (!D.teams.length) return head + keyEdit + '<p class="muted">Команда жоқ.</p>';
    var th = '<th>Команда</th>';
    for (var i = 0; i < R.n; i++) {
      var syn = ((D.extra[rd] || {})[i] || []).map(function (v) { return '<span class="syn">' + esc(v) + '<button type="button" title="Синонимді алып тастау" data-unsyn="' + i + '" data-v="' + esc(v) + '">×</button></span>'; }).join('');
      th += '<th class="cell">' + (i + 1) + '<span class="key">' + esc(keyLabel(rd, i)) + '</span>' + syn + '</th>';
    }
    th += '<th class="sum">Ұпай</th>';
    var rows = D.teams.map(function (t) {
      var c = compOf(t.id) || { marks: {}, rounds: {} };
      var sub = (D.answers[t.id] || {})[rd];
      var ans = sub ? sub.answers : [];
      var tds = '';
      for (var j = 0; j < R.n; j++) {
        var m = (c.marks[rd] || [])[j] || { final: false };
        var a = ansLabel(rd, ans[j]);
        var canSyn = rd !== 'r4' && ans[j] && String(ans[j]).trim() && m.final !== true;
        tds += '<td class="cell"><span class="ans' + (a ? '' : ' empty') + '">' + (a ? esc(a) : 'жауап жоқ') + '</span><div class="mk">' +
          '<button type="button" class="y' + (m.final === true ? ' on' : '') + '" data-mark="true" data-t="' + t.id + '" data-i="' + j + '" title="Дұрыс">✓</button>' +
          '<button type="button" class="n' + (m.final === false ? ' on' : '') + '" data-mark="false" data-t="' + t.id + '" data-i="' + j + '" title="Қате">✗</button>' +
          (m.final === null ? '<span class="ov">кілт жоқ</span>' : '') +
          (m.override ? '<button type="button" class="lnk" data-mark="auto" data-t="' + t.id + '" data-i="' + j + '" title="Автотексеруге қайтару">авто</button>' : '') +
          (canSyn ? '<button type="button" class="lnk" data-syn="' + j + '" data-v="' + esc(ans[j]) + '" title="Осы жауапты дұрыс синоним ретінде қосу">+ кілт</button>' : '') +
          '</div></td>';
      }
      var adj = (c.adj || {})[rd] || 0;
      return '<tr><td class="team">' + esc(t.name) + (sub ? '<div class="muted">' + new Date(sub.at).toLocaleTimeString('kk-KZ') + '</div>' + unlockBtn(t.id, rd) : '<div class="muted">жіберілмеді</div>') + '</td>' + tds +
        '<td class="sum">' + (c.rounds[rd] || 0) + ' / ' + R.max + '<label class="adj">± түзету<input type="number" step="1" min="-20" max="20" data-adj="' + rd + '" data-t="' + t.id + '" value="' + (adj || '') + '" placeholder="0"></label></td></tr>';
    }).join('');
    return head + keyEdit + '<div class="scroll"><table data-round="' + rd + '"><thead><tr>' + th + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function critInputs(rd, t) {
    var sc = (D.scores[t.id] || {})[rd] || {};
    return RT[rd].crit.map(function (c) {
      var v = sc[c[0]] == null ? '' : sc[c[0]];
      return '<label>' + c[1] + ' (0–' + c[2] + ')<input type="number" min="0" max="' + c[2] + '" step="1" data-score="' + rd + '" data-t="' + t.id + '" data-f="' + c[0] + '" value="' + esc(v) + '"></label>';
    }).join('');
  }
  function r5View() {
    var R = RT.r5;
    var head = '<h2>' + R.title + '</h2><p class="sub">Тапсырма сахнада орындалады. Әр команданы критерийлер бойынша бағалаңыз (барлығы 5 ұпай).</p>';
    if (!D.teams.length) return head + '<p class="muted">Команда жоқ.</p>';
    var rows = D.teams.map(function (t) {
      var c = compOf(t.id) || { rounds: {} };
      return '<tr><td class="team">' + esc(t.name) + '</td><td><div class="crit" style="display:flex;gap:14px;flex-wrap:wrap">' + critInputs('r5', t) + '</div></td><td class="sum">' + (c.rounds.r5 || 0) + ' / 5</td></tr>';
    }).join('');
    return head + '<div class="scroll"><table><thead><tr><th>Команда</th><th>Критерийлер</th><th class="sum">Ұпай</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function r6View() {
    var R = RT.r6;
    var head = '<h2>' + R.title + '</h2><p class="sub">Командалардың идеялары. Таныстырылымнан кейін критерийлер бойынша бағалаңыз (барлығы 15 ұпай).</p>';
    if (!D.teams.length) return head + '<p class="muted">Команда жоқ.</p>';
    return head + '<div class="grid2">' + D.teams.map(function (t) {
      var c = compOf(t.id) || { rounds: {} };
      var a = ((D.answers[t.id] || {}).r6 || {}).answers;
      var body = a ? '<h3>' + esc(a.title || 'Атаусыз идея') + '</h3>' +
        (a.problem ? '<p><b>Мәселе:</b> ' + esc(a.problem) + '</p>' : '') +
        (a.solution ? '<p><b>Шешім:</b> ' + esc(a.solution) + '</p>' : '') +
        (a.benefit ? '<p><b>Пайдасы:</b> ' + esc(a.benefit) + '</p>' : '')
        : '<p class="muted">Идея жіберілмеді (ауызша таныстыруды бағалауға болады).</p>';
      return '<div class="idea"><div class="muted">' + esc(t.name) + '</div>' + (a ? unlockBtn(t.id, 'r6') : '') + body + '<div class="crit">' + critInputs('r6', t) + '<div style="margin-left:auto;align-self:end;font-weight:800;font-size:18px">' + (c.rounds.r6 || 0) + ' / 15</div></div></div>';
    }).join('') + '</div>';
  }

  function resultsView() {
    var rows = D.computed.slice().sort(function (a, b) { return a.place - b.place; });
    var tr = rows.map(function (r) {
      return '<tr><td><span class="place p' + r.place + '">' + r.place + '</span></td><td class="team">' + esc(r.name) + '</td>' +
        ['r1', 'r2', 'r3', 'r4', 'r5', 'r6'].map(function (k) { return '<td>' + r.rounds[k] + '</td>'; }).join('') + '<td class="sum">' + r.total + '</td></tr>';
    }).join('');
    var opts = function (sel) {
      return '<option value="">—</option>' + D.teams.map(function (t) { return '<option value="' + t.id + '"' + (sel === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('');
    };
    var noms = NOMS.map(function (n) {
      return '<label style="display:grid;gap:4px;font-weight:600">' + n[1] + '<select data-nom="' + n[0] + '">' + opts(D.noms[n[0]]) + '</select></label>';
    }).join('');
    var tie = rows.length > 1 && rows[0].total === rows[1].total && rows[0].total > 0;
    return '<h2>Нәтиже · Итоги</h2><p class="sub">Ұпайлар автоматты түрде есептеледі. Сол нәтиже Google Таблицаның «Нәтиже» парағына да жазылады.</p>' +
      (tie ? '<div class="msg warn">Бірінші орынға тең ұпай! Қазылар шешімі керек.</div>' : '') +
      '<div class="scroll"><table><thead><tr><th>Орын</th><th>Команда</th><th>Бәйге /10</th><th>Көр де тап /10</th><th>Әуен /10</th><th>AI /10</th><th>Қызық /5</th><th>Болашақ /15</th><th class="sum">Барлығы /60</th></tr></thead><tbody>' +
      (tr || '<tr><td colspan="9" class="muted">Команда жоқ</td></tr>') + '</tbody></table></div>' +
      '<h2 style="margin-top:20px">Номинациялар</h2><div class="grid2">' + noms + '</div>' +
      '<p class="muted" style="margin-top:14px">«Нәтиже жасырын» батырмасын бассаңыз, қорытынды кезеңде нәтиже мен номинациялар қатысушылардың экранында көрінеді.</p>';
  }

  function settingsView() {
    return '<h2>Баптау · Настройки</h2>' +
      '<p>Репетициядан кейін барлық командаларды, жауаптарды және ұпайларды өшіру:</p>' +
      (confirmDel === '__reset'
        ? '<div class="msg warn">Барлық дерек өшіріледі, қайтару мүмкін емес. Сенімдісіз бе? <button class="btn danger" type="button" id="resetYes">Иә, бәрін өшіру</button> <button class="btn light" type="button" id="resetNo">Жоқ</button></div>'
        : '<button class="btn danger" type="button" id="reset">Барлығын тазалау · Очистить всё</button>') +
      '<h2 style="margin-top:22px">Қатысушылар сілтемесі · Ссылка для участников</h2>' +
      '<p><input type="text" id="plink" readonly value="' + esc(SCRIPT_URL) + '" style="width:100%;max-width:760px"> <button class="btn light" type="button" id="copyLink">Көшіру · Копировать</button></p>' +
      '<p class="muted">Қазылар беті: осы сілтеме + <b>?page=jury</b>. QR код презентацияның 3-слайдында.</p>' +
      '<p class="muted" style="margin-top:18px">Жауап кілттері (1, 2, 4-раундтар) Code.gs файлында өзгертіледі.</p>';
  }

  // ------------------------------------------------------------ события
  function bindView() {
    var v = $('view');
    v.querySelectorAll('[data-mark]').forEach(function (b) {
      b.onclick = function () {
        var m = b.getAttribute('data-mark'), val = m === 'true' ? true : m === 'false' ? false : null;
        act('j_mark', [b.getAttribute('data-t'), b.closest('table').getAttribute('data-round'), Number(b.getAttribute('data-i')), val]);
      };
    });
    v.querySelectorAll('[data-syn]').forEach(function (b) {
      b.onclick = function () { act('j_variant', [b.closest('table').getAttribute('data-round'), Number(b.getAttribute('data-syn')), b.getAttribute('data-v'), false], 'Синоним кілтке қосылды'); };
    });
    v.querySelectorAll('[data-unsyn]').forEach(function (b) {
      b.onclick = function () { act('j_variant', [b.closest('table').getAttribute('data-round'), Number(b.getAttribute('data-unsyn')), b.getAttribute('data-v'), true], 'Синоним алынды'); };
    });
    v.querySelectorAll('input[data-adj]').forEach(function (inp) {
      inp.onchange = function () { act('j_adj', [inp.getAttribute('data-t'), inp.getAttribute('data-adj'), inp.value], 'Түзету сақталды'); };
    });
    v.querySelectorAll('[data-unlock]').forEach(function (b) { b.onclick = function () { unlockAsk = b.getAttribute('data-t') + ':' + b.getAttribute('data-unlock'); renderView(); }; });
    v.querySelectorAll('[data-unlock-no]').forEach(function (b) { b.onclick = function () { unlockAsk = null; renderView(); }; });
    v.querySelectorAll('[data-unlock-yes]').forEach(function (b) {
      b.onclick = function () { unlockAsk = null; act('j_unlock', [b.getAttribute('data-t'), b.getAttribute('data-unlock-yes')], 'Команда жауапты қайта жібере алады'); };
    });
    v.querySelectorAll('input[data-score]').forEach(function (inp) {
      inp.onchange = function () {
        act('j_score', [inp.getAttribute('data-t'), inp.getAttribute('data-score'), inp.getAttribute('data-f'), inp.value], 'Сақталды');
      };
    });
    v.querySelectorAll('select[data-nom]').forEach(function (s) {
      s.onchange = function () { act('j_setNom', [s.getAttribute('data-nom'), s.value], 'Сақталды'); };
    });
    if ($('saveK3')) $('saveK3').onclick = function () {
      act('j_setR3Key', [[0, 1, 2, 3, 4].map(function (i) { return $('k3_' + i).value; })], 'Кілт сақталды');
    };
    v.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { confirmDel = b.getAttribute('data-del'); renderView(); }; });
    v.querySelectorAll('[data-del-no]').forEach(function (b) { b.onclick = function () { confirmDel = null; renderView(); }; });
    v.querySelectorAll('[data-del-yes]').forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-del-yes'); confirmDel = null; act('j_deleteTeam', [id], 'Команда жойылды'); }; });
    if ($('reset')) $('reset').onclick = function () { confirmDel = '__reset'; renderView(); };
    if ($('resetNo')) $('resetNo').onclick = function () { confirmDel = null; renderView(); };
    if ($('copyLink')) $('copyLink').onclick = function () {
      var inp = $('plink');
      var done = function () { toast('Көшірілді'); };
      try { navigator.clipboard.writeText(inp.value).then(done, function () { inp.select(); document.execCommand('copy'); done(); }); }
      catch (e) { inp.select(); document.execCommand('copy'); done(); }
    };
    if ($('resetYes')) $('resetYes').onclick = function () { confirmDel = null; act('j_reset', [], 'Тазаланды'); };
  }
</script>
</body>
</html>
