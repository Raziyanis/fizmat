<style>
/* Layout: тема спрятана в строках таблицы; задания открывают буквы, после разгадки открывается тема и цель */

}

    --c: #4cc093; --bad: #f07b6e; --refc: #8aaaff; --tgt: #3a3317; --tgtb: #e0b23a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151a; --surface: #162028; --ink: #e5ecf0; --muted: #98a9b5; --line: #2b3a45; --head: #1d2a33;

}
[hidden] { display: none !important; }
*, *::before, *::after { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }

}
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }

  <div class="panel" id="learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
    <div>
      <h1>Как таблица обрабатывает ряд чисел</h1>
      <p class="lead">Статистическая функция смотрит сразу на весь ряд чисел — оценки, температуры, цены — и отвечает одним числом: какое в среднем, какое самое большое, какое самое маленькое.</p>
    </div>

    <section class="block">
      <h2>Три функции на одном ряду</h2>
      <div class="anatomy">
        <div class="part"><span class="tok">=</span><span class="lab">«Сейчас будет формула»</span></div>
        <div class="part"><span class="tok fnc">СРЗНАЧ</span><span class="lab">что сделать</span></div>
        <div class="part"><span class="tok">(</span><span class="lab">открыли</span></div>
        <div class="part"><span class="tok arg">B2:B8</span><span class="lab">с каким рядом<br>(от B2 до B8)</span></div>
        <div class="part"><span class="tok">)</span><span class="lab">закрыли</span></div>
      </div>
      <p class="tip">МАКС и МИН записываются так же: <code>=МАКС(B2:B8)</code>, <code>=МИН(B2:B8)</code>. Меняется только имя функции, а ряд чисел тот же.</p>
      <div class="tablewrap"><table class="th-args"><tr><th>Температура, °C</th><th>12</th><th>15</th><th>9</th><th>18</th><th>21</th><th>24</th><th>20</th></tr><tr><td><code>=СРЗНАЧ(…)</code></td><td colspan="7">17 — если бы все дни были одинаковыми, каждый был бы 17°</td></tr><tr><td><code>=МАКС(…)</code></td><td colspan="7">24 — самый тёплый день</td></tr><tr><td><code>=МИН(…)</code></td><td colspan="7">9 — самый холодный день</td></tr></table></div>
    </section>

    <section class="block theory-intro">
      <h2>Основные понятия</h2>
      <div class="concepts">
        <div><b>Ряд данных</b><p>набор чисел об одном и том же: оценки ученика, цены товара, температура по дням. В таблице это диапазон, например <code>B2:B8</code>.</p></div>
        <div><b>Среднее арифметическое</b><p>сумма всех чисел, делённая на их количество: (2 + 4 + 9) : 3 = 5.</p></div>
        <div><b>Наибольшее и наименьшее</b><p>самое большое и самое маленькое число ряда. У отрицательных больше то, что ближе к нулю: −1 &gt; −8.</p></div>
        <div><b>Размах</b><p>разница между наибольшим и наименьшим: <code>=МАКС(…)-МИН(…)</code>. Показывает, насколько разбросаны данные.</p></div>
        <div><b>Пусто и ноль</b><p>пустую ячейку и текст функции пропускают, а 0 — это число, и он участвует в расчёте.</p></div>
        <div><b>Статистика</b><p>наука о сборе и обработке данных. Средний балл, рекорд, самая низкая цена — это статистические показатели.</p></div>
      </div>
    </section>

    <div class="fpills" role="tablist" aria-label="Функции">

    <!-- СРЗНАЧ -->
    <section class="block fcard" data-card="0">
      <p class="fname"><code>СРЗНАЧ()</code> — среднее значение</p>
      <p class="simple"><b>Простыми словами:</b> «если бы всё поделили поровну». Пятеро друзей сложили конфеты в одну кучу и разделили поровну — сколько досталось каждому? Это и есть среднее.</p>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Средний балл за четверть:</span> <code>=СРЗНАЧ(B2:F2)</code></li><li><span>Средняя температура за неделю:</span> <code>=СРЗНАЧ(B2:B8)</code></li><li><span>Сколько в среднем шагов в день:</span> <code>=СРЗНАЧ(C2:C31)</code></li></ul><p class="apply-no"><b>Не подходит:</b> когда нужно «всего вместе», а не «в среднем» → СУММ.</p></div>
      <p class="how"><span>Как записать:</span> <code>=СРЗНАЧ(A1:A5)</code></p>

      <div class="theory">
      <h3>Определение</h3>
      <p>СРЗНАЧ возвращает среднее арифметическое: складывает числа и делит сумму на их количество.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>=СРЗНАЧ(число1; [число2]; …)</code></p>
      <div class="tablewrap"><table class="th-args"><tr><th>Аргумент</th><th>Что это</th><th>Нужен?</th></tr><tr><td><code>число1</code></td><td>число, ячейка или диапазон, например A1:A5</td><td>да</td></tr><tr><td><code>число2; …</code></td><td>ещё числа или диапазоны через «;»</td><td>нет</td></tr></table></div>
      <h3>Примеры</h3>
      <p class="small-note">Данные для примеров — в таблице ниже. Нажми на формулу: эти данные и формула появятся в таблице «Попробуй сам», а формула — в ячейке H10.</p>
      <p class="ex-cap">Данные для примеров</p><div class="tablewrap"><table class="mini ex-data"><tr><th></th><th>A</th><th>C</th></tr><tr><th>1</th><td class="n">4</td><td class="n">10</td></tr><tr><th>2</th><td class="n">5</td><td class="n">20</td></tr><tr><th>3</th><td class="n">3</td><td class="n">0</td></tr><tr><th>4</th><td class="n">5</td><td class="t"></td></tr><tr><th>5</th><td class="t">н</td><td class="t"></td></tr></table></div><div class="tablewrap"><table class="th-ex"><tr><th>Формула</th><th>Результат</th><th>Почему</th></tr><tr><td><button type="button" class="tryf" data-f="=СРЗНАЧ(2;4;6)" data-cells="{&quot;A1&quot;: &quot;4&quot;, &quot;A2&quot;: &quot;5&quot;, &quot;A3&quot;: &quot;3&quot;, &quot;A4&quot;: &quot;5&quot;, &quot;A5&quot;: &quot;н&quot;, &quot;C1&quot;: &quot;10&quot;, &quot;C2&quot;: &quot;20&quot;, &quot;C3&quot;: &quot;0&quot;}" title="Открыть в таблице ниже">=СРЗНАЧ(2;4;6)</button></td><td class="r">4</td><td>(2 + 4 + 6) : 3</td></tr><tr><td><button type="button" class="tryf" data-f="=СРЗНАЧ(A1:A4)" data-cells="{&quot;A1&quot;: &quot;4&quot;, &quot;A2&quot;: &quot;5&quot;, &quot;A3&quot;: &quot;3&quot;, &quot;A4&quot;: &quot;5&quot;, &quot;A5&quot;: &quot;н&quot;, &quot;C1&quot;: &quot;10&quot;, &quot;C2&quot;: &quot;20&quot;, &quot;C3&quot;: &quot;0&quot;}" title="Открыть в таблице ниже">=СРЗНАЧ(A1:A4)</button></td><td class="r">4,25</td><td>(4 + 5 + 3 + 5) : 4 = 17 : 4</td></tr><tr><td><button type="button" class="tryf" data-f="=СРЗНАЧ(A1:A5)" data-cells="{&quot;A1&quot;: &quot;4&quot;, &quot;A2&quot;: &quot;5&quot;, &quot;A3&quot;: &quot;3&quot;, &quot;A4&quot;: &quot;5&quot;, &quot;A5&quot;: &quot;н&quot;, &quot;C1&quot;: &quot;10&quot;, &quot;C2&quot;: &quot;20&quot;, &quot;C3&quot;: &quot;0&quot;}" title="Открыть в таблице ниже">=СРЗНАЧ(A1:A5)</button></td><td class="r">4,25</td><td>текст «н» в A5 пропускается: делим на 4, а не на 5</td></tr><tr><td><button type="button" class="tryf" data-f="=СРЗНАЧ(C1:C3)" data-cells="{&quot;A1&quot;: &quot;4&quot;, &quot;A2&quot;: &quot;5&quot;, &quot;A3&quot;: &quot;3&quot;, &quot;A4&quot;: &quot;5&quot;, &quot;A5&quot;: &quot;н&quot;, &quot;C1&quot;: &quot;10&quot;, &quot;C2&quot;: &quot;20&quot;, &quot;C3&quot;: &quot;0&quot;}" title="Открыть в таблице ниже">=СРЗНАЧ(C1:C3)</button></td><td class="r">10</td><td>ноль — это число: (10 + 20 + 0) : 3</td></tr><tr><td><button type="button" class="tryf" data-f="=СУММ(A1:A4)/4" data-cells="{&quot;A1&quot;: &quot;4&quot;, &quot;A2&quot;: &quot;5&quot;, &quot;A3&quot;: &quot;3&quot;, &quot;A4&quot;: &quot;5&quot;, &quot;A5&quot;: &quot;н&quot;, &quot;C1&quot;: &quot;10&quot;, &quot;C2&quot;: &quot;20&quot;, &quot;C3&quot;: &quot;0&quot;}" title="Открыть в таблице ниже">=СУММ(A1:A4)/4</button></td><td class="r">4,25</td><td>то же самое «вручную»: сумма : количество</td></tr><tr><td><button type="button" class="tryf" data-f="=СРЗНАЧ(A1:A4;5)" data-cells="{&quot;A1&quot;: &quot;4&quot;, &quot;A2&quot;: &quot;5&quot;, &quot;A3&quot;: &quot;3&quot;, &quot;A4&quot;: &quot;5&quot;, &quot;A5&quot;: &quot;н&quot;, &quot;C1&quot;: &quot;10&quot;, &quot;C2&quot;: &quot;20&quot;, &quot;C3&quot;: &quot;0&quot;}" title="Открыть в таблице ниже">=СРЗНАЧ(A1:A4;5)</button></td><td class="r">4,4</td><td>к оценкам добавили ещё одну пятёрку: 22 : 5</td></tr></table></div>
      <h3>Важно знать</h3>
      <ul><li><b>Пустые ячейки и текст</b> СРЗНАЧ пропускает, а <b>0 считает</b>. Отсутствие («н») и ноль — разные вещи: ноль снижает среднее.</li><li>Среднее часто получается дробным. Лишние знаки убирает кнопка <b>«Уменьшить разрядность»</b> на вкладке «Главная».</li><li>Если в диапазоне нет ни одного числа, будет ошибка <code>#ДЕЛ/0!</code>: делить не на что.</li><li>Не включай в диапазон строку «Итого»: сумма попадёт в среднее и испортит его.</li></ul>
      <h3>Связь с математикой</h3>
      <p>Среднее арифметическое: (a₁ + a₂ + … + aₙ) : n. Среднее чувствительно к очень большим и очень маленьким числам: одна двойка заметно снижает средний балл.</p>
      </div>
      <div class="tryxl"><span class="trylab">Попробуй сам в таблице</span><div class="xl" data-sheet="avg"></div></div>
      <p class="remember"><b>Запомни:</b> СРЗНАЧ = СУММ : количество чисел. Пустые ячейки не считаются, нули — считаются.</p>
    </section>

    <!-- МАКС -->
    <section class="block fcard" data-card="1" hidden>
      <p class="fname"><code>МАКС()</code> — самое большое</p>
      <p class="simple"><b>Простыми словами:</b> как судья на соревнованиях, который из всех результатов называет рекорд. МАКС просматривает все числа и показывает наибольшее.</p>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Самая высокая температура за месяц:</span> <code>=МАКС(B2:B31)</code></li><li><span>Лучший прыжок в длину:</span> <code>=МАКС(C2:C25)</code></li><li><span>Самая дорогая покупка:</span> <code>=МАКС(D2:D20)</code></li></ul><p class="apply-no"><b>Не подходит:</b> если «лучший» — это наименьшее (время бега, цена) → МИН.</p></div>
      <p class="how"><span>Как записать:</span> <code>=МАКС(A1:A5)</code></p>

      <div class="theory">
      <h3>Определение</h3>
      <p>МАКС возвращает наибольшее число из всех аргументов.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>=МАКС(число1; [число2]; …)</code></p>
      <h3>Примеры</h3>
      <p class="small-note">Данные для примеров — в таблице ниже. Нажми на формулу: она появится в таблице «Попробуй сам» в ячейке H10.</p>

t;B1&quot;: &quot;-3&quot;, &quot;B2&quot;: &quot;-8&quot;, &quot;B3&quot;: &quot;-1&quot;}" title="Открыть в таблице ниже">=МАКС(A1:A4;50)</button></td><td class="r">50</td><td>число 50 тоже участвует в сравнении</td></tr><tr><td><button type="button" class="tryf" data-f="=МАКС(A1:A4)-МИН(A1:A4)" data-cells="{&quot;A1&quot;: &quot;12&quot;, &quot;A2&quot;: &quot;-5&quot;, &quot;A3&quot;: &quot;30&quot;, &quot;A4&quot;: &quot;18&quot;, &quot;B1&quot;: &quot;-3&quot;, &quot;B2&quot;: &quot;-8&quot;, &quot;B3&quot;: &quot;-1&quot;}" title="Открыть в таблице ниже">=МАКС(A1:A4)-МИН(A1:A4)</button></td><td class="r">35</td><td>размах: от −5 до 30</td></tr></table></div>

      <h3>Связь с математикой</h3>
      <p>Наибольшее значение ряда — самое правое число на числовой прямой. Размах ряда = наибольшее − наименьшее.</p>

    <!-- МИН -->
    <section class="block fcard" data-card="2" hidden>
      <p class="fname"><code>МИН()</code> — самое маленькое</p>
      <p class="simple"><b>Простыми словами:</b> как покупатель, который ищет самую низкую цену. МИН просматривает все числа и показывает наименьшее.</p>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Самая низкая цена в пяти магазинах:</span> <code>=МИН(B2:F2)</code></li><li><span>Лучшее время в беге (меньше — лучше):</span> <code>=МИН(C2:C25)</code></li><li><span>Самая холодная ночь месяца:</span> <code>=МИН(B2:B31)</code></li></ul><p class="apply-no"><b>Не подходит:</b> если рекорд — это «больше» (прыжок, баллы) → МАКС.</p></div>
      <p class="how"><span>Как записать:</span> <code>=МИН(A1:A5)</code></p>

      <div class="theory">
      <h3>Определение</h3>
      <p>МИН возвращает наименьшее число из всех аргументов.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>=МИН(число1; [число2]; …)</code></p>
      <h3>Примеры</h3>
      <p class="ex-cap">Данные для примеров</p><div class="tablewrap"><table class="mini ex-data"><tr><th></th><th>A</th><th>B</th></tr><tr><th>1</th><td class="n">450</td><td class="n">9,8</td></tr><tr><th>2</th><td class="n">380</td><td class="n">10,4</td></tr><tr><th>3</th><td class="n">520</td><td class="n">9,2</td></tr><tr><th>4</th><td class="t"></td><td class="t"></td></tr><tr><th>5</th><td class="t">нет</td><td class="t"></td></tr></table></div><div class="tablewrap"><table class="th-ex"><tr><th>Формула</th><th>Результат</th><th>Почему</th></tr><tr><td><button type="button" class="tryf" data-f="=МИН(7;2;5)" data-cells="{&quot;A1&quot;: &quot;450&quot;, &quot;A2&quot;: &quot;380&quot;, &quot;A3&quot;: &quot;520&quot;, &quot;A5&quot;: &quot;нет&quot;, &quot;B1&quot;: &quot;9,8&quot;, &quot;B2&quot;: &quot;10,4&quot;, &quot;B3&quot;: &quot;9,2&quot;}" title="Открыть в таблице ниже">=МИН(7;2;5)</button></td><td class="r">2</td><td>самое маленькое из трёх чисел</td></tr><tr><td><button type="button" class="tryf" data-f="=МИН(A1:A5)" data-cells="{&quot;A1&quot;: &quot;450&quot;, &quot;A2&quot;: &quot;380&quot;, &quot;A3&quot;: &quot;520&quot;, &quot;A5&quot;: &quot;нет&quot;, &quot;B1&quot;: &quot;9,8&quot;, &quot;B2&quot;: &quot;10,4&quot;, &quot;B3&quot;: &quot;9,2&quot;}" title="Открыть в таблице ниже">=МИН(A1:A5)</button></td><td class="r">380</td><td>пустая ячейка A4 и слово «нет» в A5 пропускаются</td></tr><tr><td><button type="button" class="tryf" data-f="=МИН(B1:B3)" data-cells="{&quot;A1&quot;: &quot;450&quot;, &quot;A2&quot;: &quot;380&quot;, &quot;A3&quot;: &quot;520&quot;, &quot;A5&quot;: &quot;нет&quot;, &quot;B1&quot;: &quot;9,8&quot;, &quot;B2&quot;: &quot;10,4&quot;, &quot;B3&quot;: &quot;9,2&quot;}" title="Открыть в таблице ниже">=МИН(B1:B3)</button></td><td class="r">9,2</td><td>лучшее время в беге — самое маленькое</td></tr><tr><td><button type="button" class="tryf" data-f="=МИН(-4;0;3)" data-cells="{&quot;A1&quot;: &quot;450&quot;, &quot;A2&quot;: &quot;380&quot;, &quot;A3&quot;: &quot;520&quot;, &quot;A5&quot;: &quot;нет&quot;, &quot;B1&quot;: &quot;9,8&quot;, &quot;B2&quot;: &quot;10,4&quot;, &quot;B3&quot;: &quot;9,2&quot;}" title="Открыть в таблице ниже">=МИН(-4;0;3)</button></td><td class="r">-4</td><td>отрицательное число меньше нуля</td></tr><tr><td><button type="button" class="tryf" data-f="=МИН(A1:A3;0)" data-cells="{&quot;A1&quot;: &quot;450&quot;, &quot;A2&quot;: &quot;380&quot;, &quot;A3&quot;: &quot;520&quot;, &quot;A5&quot;: &quot;нет&quot;, &quot;B1&quot;: &quot;9,8&quot;, &quot;B2&quot;: &quot;10,4&quot;, &quot;B3&quot;: &quot;9,2&quot;}" title="Открыть в таблице ниже">=МИН(A1:A3;0)</button></td><td class="r">0</td><td>ноль — тоже число, и он оказался самым маленьким</td></tr></table></div>
      <h3>Важно знать</h3>
      <ul><li>Пустую ячейку МИН пропускает, а <b>0 считает</b>. Не пиши 0 вместо «нет данных», иначе минимумом станет 0.</li><li>Если чисел нет совсем, ответ — 0.</li></ul>
      <h3>Связь с математикой</h3>
      <p>Наименьшее значение ряда — самое левое число на числовой прямой: −7 &lt; −2 &lt; 0.</p>
      </div>
      <div class="tryxl"><span class="trylab">Попробуй сам в таблице</span><div class="xl" data-sheet="min"></div></div>
      <p class="remember"><b>Запомни:</b> пусто — не ноль. Пустую ячейку МИН не видит, а ноль считает самым маленьким числом.</p>
    </section>

        <div><b>Бос және нөл</b><p>бос ұяшық пен мәтінді функциялар өткізіп жібереді, ал 0 — бұл сан, ол есептеуге қатысады.</p></div>
        <div><b>Статистика</b><p>деректерді жинау және өңдеу туралы ғылым. Орташа балл, рекорд, ең төмен баға — бұл статистикалық көрсеткіштер.</p></div>
      </div>

    <!-- СРЗНАЧ -->
    <section class="block fcard" data-card="0">
      <p class="fname"><code>СРЗНАЧ()</code> — орташа мән</p>
      <p class="simple"><b>Қарапайым тілмен:</b> «бәрін тең бөлсек» дегендей. Бес дос кәмпиттерді бір үйінге жинап, тең бөлді — әрқайсысына қанша тиді? Міне, бұл орташа.</p>
      <div class="apply"><p class="apply-h">Қайда қолданылады</p><ul><li><span>Тоқсандағы орташа балл:</span> <code>=СРЗНАЧ(B2:F2)</code></li><li><span>Аптадағы орташа температура:</span> <code>=СРЗНАЧ(B2:B8)</code></li><li><span>Күніне орташа есеппен қанша қадам:</span> <code>=СРЗНАЧ(C2:C31)</code></li></ul><p class="apply-no"><b>Сәйкес келмейді:</b> «орташа есеппен» емес, «барлығы бірге» керек болса → СУММ.</p></div>
      <p class="how"><span>Қалай жазылады:</span> <code>=СРЗНАЧ(A1:A5)</code></p>

      <div class="theory">
      <h3>Анықтама</h3>
      <p>СРЗНАЧ арифметикалық ортаны қайтарады: сандарды қосып, қосындыны олардың санына бөледі.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>=СРЗНАЧ(сан1; [сан2]; …)</code></p>
      <div class="tablewrap"><table class="th-args"><tr><th>Аргумент</th><th>Бұл не</th><th>Міндетті ме?</th></tr><tr><td><code>сан1</code></td><td>сан, ұяшық немесе ауқым, мысалы, A1:A5</td><td>иә</td></tr><tr><td><code>сан2; …</code></td><td>«;» арқылы басқа сандар немесе ауқымдар</td><td>жоқ</td></tr></table></div>
      <h3>Мысалдар</h3>
      <p class="small-note">Мысалдарға арналған деректер — төмендегі кестеде. Формуланы бас: осы деректер мен формула «Өзің байқап көр» кестесінде пайда болады, ал формула H10 ұяшығына түседі.</p>

="{&quot;A1&quot;: &quot;4&quot;, &quot;A2&quot;: &quot;5&quot;, &quot;A3&quot;: &quot;3&quot;, &quot;A4&quot;: &quot;5&quot;, &quot;A5&quot;: &quot;ж&quot;, &quot;C1&quot;: &quot;10&quot;, &quot;C2&quot;: &quot;20&quot;, &quot;C3&quot;: &quot;0&quot;}" title="Төмендегі кестеде ашу">=СРЗНАЧ(C1:C3)</button></td><td class="r">10</td><td>нөл — бұл сан: (10 + 20 + 0) : 3</td></tr><tr><td><button type="button" class="tryf" data-f="=СУММ(A1:A4)/4" data-cells="{&quot;A1&quot;: &quot;4&quot;, &quot;A2&quot;: &quot;5&quot;, &quot;A3&quot;: &quot;3&quot;, &quot;A4&quot;: &quot;5&quot;, &quot;A5&quot;: &quot;ж&quot;, &quot;C1&quot;: &quot;10&quot;, &quot;C2&quot;: &quot;20&quot;, &quot;C3&quot;: &quot;0&quot;}" title="Төмендегі кестеде ашу">=СУММ(A1:A4)/4</button></td><td class="r">4,25</td><td>дәл сол «қолмен»: қосынды : саны</td></tr><tr><td><button type="button" class="tryf" data-f="=СРЗНАЧ(A1:A4;5)" data-cells="{&quot;A1&quot;: &quot;4&quot;, &quot;A2&quot;: &quot;5&quot;, &quot;A3&quot;: &quot;3&quot;, &quot;A4&quot;: &quot;5&quot;, &quot;A5&quot;: &quot;ж&quot;, &quot;C1&quot;: &quot;10&quot;, &quot;C2&quot;: &quot;20&quot;, &quot;C3&quot;: &quot;0&quot;}" title="Төмендегі кестеде ашу">=СРЗНАЧ(A1:A4;5)</button></td><td class="r">4,4</td><td>бағаларға тағы бір бесті қостық: 22 : 5</td></tr></table></div>
      <h3>Білу маңызды</h3>
      <ul><li><b>Бос ұяшықтар мен мәтінді</b> СРЗНАЧ өткізіп жібереді, ал <b>0-ді есептейді</b>. Болмау («ж») мен нөл — әртүрлі нәрсе: нөл орташаны төмендетеді.</li><li>Орташа жиі бөлшек болып шығады. Артық таңбаларды мына батырма алып тастайды: <b>«Разрядтылықты азайту»</b> «Басты» қойындысында.</li><li>Ауқымда бірде-бір сан болмаса, мына қате шығады: <code>#ДЕЛ/0!</code>: бөлетін ештеңе жоқ.</li><li>Ауқымға «Жиыны» жолын қоспа: сома орташаға түсіп, оны бұзады.</li></ul>
      <h3>Математикамен байланысы</h3>
      <p>Арифметикалық орта: (a₁ + a₂ + … + aₙ) : n. Орташа өте үлкен және өте кіші сандарға сезімтал: бір екілік орташа балды айтарлықтай төмендетеді.</p>
      </div>
      <div class="tryxl"><span class="trylab">Кестеде өзің байқап көр</span><div class="xl" data-sheet="avg"></div></div>
      <p class="remember"><b>Есте сақта:</b> СРЗНАЧ = СУММ : сандар саны. Бос ұяшықтар есептелмейді, нөлдер — есептеледі.</p>
    </section>

uot;: &quot;-3&quot;, &quot;B2&quot;: &quot;-8&quot;, &quot;B3&quot;: &quot;-1&quot;}" title="Төмендегі кестеде ашу">=МАКС(A1:A4;50)</button></td><td class="r">50</td><td>50 саны да салыстыруға қатысады</td></tr><tr><td><button type="button" class="tryf" data-f="=МАКС(A1:A4)-МИН(A1:A4)" data-cells="{&quot;A1&quot;: &quot;12&quot;, &quot;A2&quot;: &quot;-5&quot;, &quot;A3&quot;: &quot;30&quot;, &quot;A4&quot;: &quot;18&quot;, &quot;B1&quot;: &quot;-3&quot;, &quot;B2&quot;: &quot;-8&quot;, &quot;B3&quot;: &quot;-1&quot;}" title="Төмендегі кестеде ашу">=МАКС(A1:A4)-МИН(A1:A4)</button></td><td class="r">35</td><td>құлаш: −5-тен 30-ға дейін</td></tr></table></div>

function startLesson() {

const ROWS = ["СТАТИСТИЧЕСКИЕ", "ФУНКЦИИ"];

  { n: 3, chart: "t", q: "В какой день было холоднее всего?", ans: "Ср",

  { n: 4, chart: "t", q: "Какая самая низкая температура за неделю?", ans: "9",
    opts: [["12", "Ы", "12° — понедельник, но есть день холоднее."], ["0", "Й", "Такой температуры на диаграмме нет: смотри на подписи над столбиками."], ["15", "Ю", "15° — вторник. Найди самый низкий столбик."], ["9", "И"]] },
  { n: 5, chart: "t", q: "Какая температура была в среднем за неделю? Сложи все семь температур и раздели на 7.", ans: "17",
    opts: [["119", "Б", "119 — это сумма. Её ещё нужно разделить на количество дней — на 7."], ["17", "Ч"], ["18", "Щ", "18° — это четверг. Среднее считают по всем дням: сумма : 7."], ["24", "Ж", "24° — самый тёплый день, а не среднее."]] },
  { n: 6, chart: "t", q: "На сколько градусов самый тёплый день теплее самого холодного?", ans: "15",
    opts: [["33", "З", "Температуры не складывают, а вычитают: самая высокая − самая низкая."], ["15", "Е"], ["12", "О", "Найди самую высокую и самую низкую температуру и вычти одну из другой."], ["3", "Г", "Сравни именно самый тёплый и самый холодный день."]] },
  { n: 7, chart: "t", q: "Сколько дней температура была выше средней (17°)?", ans: "4",
    opts: [["3", "Г", "Посчитай ещё раз все столбики выше 17°: 18, 21, 24, 20."], ["4", "К"], ["5", "Х", "Столбики выше 17° — это только 18, 21, 24 и 20."], ["7", "Л", "Не все дни теплее среднего: 12, 15 и 9 — ниже."]] },
  { n: 8, chart: "i", q: "В какой день продали больше всего мороженого?", ans: "Сб",
    opts: [["Пт", "В", "В пятницу 75 штук, а есть день, когда продали больше."], ["Вс", "Д", "В воскресенье 65 штук. Найди самый высокий столбик."], ["Сб", "Ф"], ["Чт", "П", "В четверг 60 штук — это не самый высокий столбик."]] },
  { n: 9, chart: "i", q: "Сколько мороженого продавали в среднем за день? Сложи все продажи и раздели на 7.", ans: "55",
    opts: [["385", "Ы", "385 — это сумма за неделю. Раздели её на 7 дней."], ["90", "Ю", "90 — самая большая продажа, а не среднее."], ["55", "У"], ["60", "О", "60 — продажа в четверг. Среднее считают по всем дням."]] },
  { n: 10, chart: "i", q: "Какая самая маленькая продажа за неделю?", ans: "20",
    opts: [["30", "М", "30 — понедельник, но есть день, когда продали меньше."], ["20", "Н"], ["0", "П", "Дней без продаж на диаграмме нет: смотри на подписи."], ["45", "Л", "45 — вторник. Найди самый низкий столбик."]] },
  { n: 11, chart: "both", q: "Сравни две диаграммы. Когда на улице теплее, мороженого продают…", ans: "больше",
    opts: [["меньше", "Ш", "Посмотри на субботу: самый тёплый день и самая большая продажа."], ["больше", "Ц"], ["столько же", "Щ", "Продажи меняются: в среду 20 штук, в субботу 90."], ["не связано", "Ж", "Сравни: самый холодный день — среда — и самая маленькая продажа тоже в среду."]] }
];
TASKS.forEach(t => { const o = t.opts.find(x => x[0] === t.ans); t.letter = o[1]; });

const BY_LETTER = {}; TASKS.forEach(t => [...t.letter].forEach(ch => { BY_LETTER[ch] = t; }));

const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} if (window.__onStore) window.__onStore(k); },
  del(k) { try { localStorage.removeItem(NS + k); } catch (e) {} if (window.__onStore) window.__onStore(k); }
};

/* picks: номер вопроса → выбранный вариант */
let picks = store.get(KEY, {});
let solved = new Set(TASKS.filter(t => picks[t.n] === t.ans).map(t => t.n));

/* Столбчатая диаграмма: один ряд, подписи значений над столбиками, бледная сетка */
function barChart(c) {
  const W = 360, H = 220, L = 34, R = 8, T = 22, B = 26, iw = W - L - R, ih = H - T - B, slot = iw / c.values.length, bw = slot * .58;
  const y = v => T + ih - v / c.max * ih;
  let g = "";
  for (let v = 0; v <= c.max; v += c.step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="ch-grid"/><text x="${L - 6}" y="${y(v) + 4}" class="ch-ax" text-anchor="end">${v}</text>`;
  const bars = c.values.map((v, i) => {
    const x = L + i * slot + (slot - bw) / 2, top = y(v), r = 4, base = y(0);
    const d = `M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${base}Z`;
    return `<g class="ch-bar"><title>${DAYS[i]}: ${v} ${c.unit}</title><rect x="${L + i * slot}" y="${T}" width="${slot}" height="${ih + B}" fill="transparent"/><path d="${d}"/><text x="${x + bw / 2}" y="${top - 5}" class="ch-val" text-anchor="middle">${v}</text><text x="${x + bw / 2}" y="${H - 8}" class="ch-ax" text-anchor="middle">${DAYS[i]}</text></g>`;
  }).join("");
  return `<figure class="chart" id="chart-${c.id}"><figcaption>${c.title}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.title}: ${c.values.map((v, i) => DAYS[i] + " " + v).join(", ")}">${g}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" class="ch-base"/>${bars}</svg>
    <details><summary>Показать таблицей</summary><table class="mini"><tr>${DAYS.map(d => `<th>${d}</th>`).join("")}</tr><tr>${c.values.map(v => `<td>${v}</td>`).join("")}</tr></table></details></figure>`;
}
document.getElementById("charts").innerHTML = CHARTS.map(barChart).join("");

function buildGrid() {
  const width = Math.max(...ROWS.map(r => r.length));
  let html = "<tr><th class=\"rh\"></th>" + [...COLS.slice(0, width)].map(c => `<th>${c}</th>`).join("") + "</tr>";
  ROWS.forEach((row, ri) => {
    html += `<tr><th class="rh">${ri + 1}</th>`;
    for (let i = 0; i < width; i++) {
      const ch = row[i];
      if (!ch) { html += "<td class=\"gap\"></td>"; continue; }
      const t = BY_LETTER[ch];
      html += `<td data-n="${t.n}" data-ch="${ch}" aria-label="ячейка ${COLS[i]}${ri + 1}, вопрос ${t.n}"><div class="cell"><span class="ch">?</span><span class="no">${t.n}</span></div></td>`;
    }
    html += "</tr>";
  });
  document.getElementById("grid").innerHTML = html;
}

function buildTasks() {
  const where = { t: "диаграмма «Температура»", i: "диаграмма «Мороженое»", both: "обе диаграммы" };
  document.getElementById("tasks").innerHTML = TASKS.map(t => `
    <div class="task fork" id="task-${t.n}">
      <div class="hd"><span class="tn">Вопрос ${t.n}</span><span class="fn">${where[t.chart]}</span></div>
      <p class="fork-q">${t.q}</p>
      <div class="fork-br opts4" role="group" aria-label="Ответ на вопрос ${t.n}">
        ${t.opts.map(o => `<button type="button" class="fork-b" data-n="${t.n}" data-b="${o[0]}" aria-pressed="false"><span>${o[0]}</span><span class="lt">?</span></button>`).join("")}
      </div>
      <p class="msg" id="msg-${t.n}" aria-live="polite"></p>
    </div>`).join("");
}

function render(animateN) {
  document.querySelectorAll("#grid td[data-n]").forEach(td => {
    const n = +td.dataset.n, t = TASKS[n - 1], p = picks[n];
    const open = solved.has(n), wrong = !!p && !open, o = wrong ? t.opts.find(x => x[0] === p) : null;
    td.classList.toggle("open", open);
    td.classList.toggle("wrongl", wrong);
    td.querySelector(".ch").textContent = open ? td.dataset.ch : o ? o[1][[...t.letter].indexOf(td.dataset.ch)] : "?";
    if (p && n === animateN) { td.classList.remove("flip"); void td.offsetWidth; td.classList.add("flip"); }
  });
  TASKS.forEach(t => {
    const box = document.getElementById("task-" + t.n), p = picks[t.n], done = solved.has(t.n);
    box.classList.toggle("done", done);
    box.classList.toggle("wrongp", !!p && !done);
    box.querySelectorAll(".fork-b").forEach(b => {
      const mine = b.dataset.b === p, o = t.opts.find(x => x[0] === b.dataset.b);
      b.setAttribute("aria-pressed", mine);
      b.classList.toggle("ok", mine && done);
      b.classList.toggle("no", mine && !done);
      b.querySelector(".lt").textContent = mine ? o[1] : "?";
      b.disabled = done;
    });
    const msg = document.getElementById("msg-" + t.n);
    const o = p ? t.opts.find(x => x[0] === p) : null;
    if (done) { msg.className = "msg ok"; msg.textContent = `Верно! Открыта буква «${t.letter}».`; }
    else if (o) { msg.className = "msg bad"; msg.textContent = `Буква «${o[1]}» ломает слово. ${o[2] || ""} Выбери другой ответ.`; }
    else { msg.className = "msg"; msg.textContent = ""; }
  });
  const total = ANSWER.length;
  const open = [...ANSWER].filter(ch => solved.has(BY_LETTER[ch].n)).length;
  document.getElementById("pbar").style.width = (open / total * 100) + "%";
  document.getElementById("pnum").textContent = `Открыто букв: ${open} из ${total}`;
  if (open === total) unlock();
}

function choose(n, b) {
  const t = TASKS[n - 1];
  if (solved.has(n)) return;
  picks[n] = b;
  const ok = b === t.ans;
  if (ok) solved.add(n);
  if (window.__onAttempt) window.__onAttempt("2. Разгадка темы", "Вопрос " + n, b, ok, ok ? "" : "верно: " + t.ans);
  store.set(KEY, picks);
  render(n);
}

document.getElementById("tasks").addEventListener("click", e => {
  const b = e.target.closest(".fork-b"); if (b && !b.disabled) choose(+b.dataset.n, b.dataset.b);
});

function norm(s) { return s.toUpperCase().replace(/Ё/g, "Е").replace(/[^А-ЯЁӘҒҚҢӨҰҮҺІA-Z]/g, ""); }
function guess() {
  const inp = document.getElementById("guessIn"), msg = document.getElementById("guessMsg");
  inp.classList.remove("wrong");
  if (norm(inp.value) === ANSWER) {
    TASKS.forEach(t => { picks[t.n] = t.ans; solved.add(t.n); }); store.set(KEY, picks);
    msg.className = "msg ok"; msg.textContent = "Верно! Тема открыта.";
    render();
  } else {
    void inp.offsetWidth; inp.classList.add("wrong");
    msg.className = "msg bad"; msg.textContent = "Пока не то. Откройте ещё несколько букв.";
  }
}
document.getElementById("guessBtn").addEventListener("click", guess);
document.getElementById("guessIn").addEventListener("keydown", e => { if (e.key === "Enter") guess(); });

let unlocked = false;

/* Ожидания ученика: пока хранятся только в его браузере */

/* Новая тема: карточки функций по одной и живые примеры */
const F_NAMES = ["СРЗНАЧ", "МАКС", "МИН", "Шпаргалка и ошибки"];
const F_LAST = F_NAMES.length - 1;
let fCur = 0;
function showCard(i) {
  fCur = i;
  document.querySelectorAll(".fcard").forEach(c => { c.hidden = +c.dataset.card !== i; });
  document.querySelectorAll(".fpill").forEach(p => p.setAttribute("aria-selected", +p.dataset.f === i));
  document.getElementById("fPrev").textContent = i === 0 ? "← Вспомним" : "← Назад";
  document.getElementById("fNext").textContent = i === F_LAST ? "Дальше: какая функция? →" : "Дальше: " + F_NAMES[i + 1] + " →";
}
document.querySelectorAll(".fpill").forEach(p => p.addEventListener("click", () => showCard(+p.dataset.f)));
document.getElementById("fPrev").addEventListener("click", () => { if (fCur === 0) show("actual"); else showCard(fCur - 1); });

  if (fCur === F_LAST) { show("match"); window.scrollTo({ top: 0, behavior: "smooth" }); } else showCard(fCur + 1);
});

const XL_ERR = {

function xlMount(root, examples, opts = {}) {
  const ROWS = opts.rows || 10, COLS = XL_COLS.slice(0, opts.cols || XL_COLS.length);
  const S = { cells: {}, cache: new Map(), sel: "A1", ex: 0, timer: null };
  root.innerHTML = `
    <div class="xl-top"${opts.task ? " hidden" : ""}>
      <div class="xl-ex">${examples.map((e, i) => `<button type="button" class="xl-chip" data-ex="${i}">${e.name}</button>`).join("")}</div>
      <div class="xl-act">
        <button type="button" class="btn xl-rand">Случайные числа</button>
        <button type="button" class="btn xl-play" aria-pressed="false">▶ Автопоказ</button>
        <button type="button" class="btn xl-reset">Сбросить</button>

    </div>
    <p class="xl-text"${opts.task ? " hidden" : ""}></p>
    <div class="xl-keys" aria-label="Вставить в формулу">
      <span class="xl-keys-lab">Вставить:</span>
      ${["=", "СРЗНАЧ(", "МАКС(", "МИН(", "СУММ(", "ЕСЛИ(", ":", ";", ")", "-", "/", ">", "\"\""].map(k => `<button type="button" class="xl-key" data-ins="${k.replace(/"/g, "&quot;")}">${k.replace(/</g, "&lt;")}</button>`).join("")}
    </div>
    <div class="xl-bar">
      <span class="xl-name" aria-live="polite"></span>
      <span class="xl-fx">fx</span>
      <input type="text" class="xl-in" autocomplete="off" spellcheck="false" aria-label="Строка формул">
    </div>
    <div class="xl-wrap"><table class="xl-grid">
      <tr><th class="xl-corner"></th>${COLS.map(c => `<th>${c}</th>`).join("")}</tr>
      ${Array.from({ length: ROWS }, (_, r) => `<tr><th>${r + 1}</th>${COLS.map(c => `<td tabindex="-1" data-k="${c}${r + 1}"></td>`).join("")}</tr>`).join("")}
    </table></div>
    <p class="xl-explain"></p>
    <p class="xl-hint">Нажми на ячейку — её содержимое появится в строке <b>fx</b>. <b>Пишешь формулу?</b> Щёлкни по ячейке, и её адрес вставится сам. Протяни мышью по нескольким ячейкам — вставится диапазон, например A1:A5. Раскладку менять не нужно.</p>`;
  const $ = s => root.querySelector(s);
  const inp = $(".xl-in"), grid = $(".xl-grid"), playBtn = $(".xl-play");

  function recalc() { S.cache = new Map(); }
  function render() {
    let refs = new Set();
    const raw = String(S.cells[S.sel] ?? "");
    let ast = null;
    if (raw.trim().startsWith("=")) { try { ast = xlParse(raw.trim().slice(1)); refs = xlRefs(ast, new Set()); } catch (e) { if (!(e instanceof XSyntax)) throw e; } }
    grid.querySelectorAll("td").forEach(td => {
      const k = td.dataset.k, v = xlEvalCell(S, k, new Set());
      const isF = String(S.cells[k] ?? "").trim().startsWith("=");
      td.textContent = xlFmt(v);
      td.className = (typeof v === "number" ? "n" : typeof v === "boolean" ? "b" : v instanceof XErr ? "e" : "") + (isF ? " f" : "") + (refs.has(k) ? " ref" : "") + (opts.targets && opts.targets.includes(k) ? " target" : "") + (k === S.sel ? " sel" : "");
      td.tabIndex = k === S.sel ? 0 : -1;
    });
    $(".xl-name").textContent = S.sel;
    explain(raw, ast);
  }
  function explain(raw, ast) {
    const box = $(".xl-explain");
    box.className = "xl-explain";
    const t = raw.trim();
    if (!t) { box.textContent = "Ячейка пустая. Впиши число или формулу в строку fx."; return; }
    if (!t.startsWith("=")) {
      if (/^(ИСТИНА|ЛОЖЬ)$/i.test(t)) { box.textContent = `В ячейке логическое значение ${t.toUpperCase()}. Его можно взять условием: =ЕСЛИ(${S.sel};"да";"нет").`; return; }
      box.textContent = xlNum(t) !== null ? `В ячейке просто число ${xlFmt(xlNum(t))}. Поменяй его, и формулы, которые на него ссылаются, пересчитаются.` : "В ячейке текст — подпись. Формулы его не складывают.";
      return;
    }
    let parsed = ast;
    if (!parsed) {
      try { parsed = xlParse(t.slice(1)); } catch (e) {
        if (!(e instanceof XSyntax)) throw e;
        box.classList.add("bad"); box.textContent = "Ошибка в записи формулы: " + e.message + " В Excel такую формулу не дадут ввести: появится окно с сообщением о проблеме в формуле."; return;
      }
    }
    const v = xlEvalCell(S, S.sel, new Set());
    const lines = [];
    if (v instanceof XErr && v.code === "#ОШИБКА") {
      const call = xlFind(parsed, n => n.t === "call" && XL_ARGS[n.f] && (() => { try { xlCall(S, n, new Set()); return false; } catch (e) { return e instanceof XArity; } })());
      box.classList.add("bad");
      box.textContent = call ? `У функции ${call.f} должно быть ${XL_ARGS[call.f]}.` + (t.includes(",") ? " Похоже, вместо «;» стоит запятая." : "") : "Ошибка в записи формулы.";
      box.textContent += " В Excel такую формулу не дадут ввести: появится окно с сообщением о проблеме в формуле.";
      return;
    }
    lines.push(`<span class="xl-step">Подставляем значения:</span> <code></code> → <b></b>`);
    box.innerHTML = lines.join("");
    box.querySelector("code").textContent = "=" + xlShow(S, parsed);
    box.querySelector("b").textContent = v === "" ? "пусто (\"\")" : xlFmt(v);
    if (!(v instanceof XErr) && parsed.t === "call" && parsed.f === "ЕСЛИ" && parsed.args.length >= 2) {
      const c = xlEv(S, parsed.args[0], new Set());
      if (typeof c === "boolean" || typeof c === "number") {
        const yes = typeof c === "boolean" ? c : c !== 0, p = document.createElement("span");
        p.className = "xl-if";
        p.textContent = `Условие ${xlShow(S, parsed.args[0])} → ${yes ? "ИСТИНА" : "ЛОЖЬ"}, поэтому ЕСЛИ ` + (yes ? "берёт второй аргумент — ответ для «да»." : parsed.args.length > 2 ? "берёт третий аргумент — ответ для «нет»." : "показывает ЛОЖЬ: третьего аргумента нет.");
        box.appendChild(p);
      }
    }
    if (v instanceof XErr) {
      box.classList.add("bad");
      const p = document.createElement("span");
      p.className = "xl-why";
      const en = xlFind(parsed, n => n.t === "call" && XL_EN[n.f]);
      const bad = xlFind(parsed, n => n.t === "badref");
      p.textContent = en ? `В русской версии эта функция называется ${XL_EN[en.f]}.` : bad ? `В адресе «${bad.v}» буква набрана по-русски. Адреса ячеек пишут латинскими буквами: A1, B2.` : (XL_ERR[v.code] || "");
      box.appendChild(p);
    }
  }
  function select(k, focusCell) {
    S.sel = k;
    inp.value = S.cells[k] ?? "";
    render();
    if (focusCell) grid.querySelector(`td[data-k="${k}"]`).focus();
  }
  function load(i) {
    S.ex = i;
    const e = examples[i];
    S.cells = { ...e.cells };
    recalc();
    root.querySelectorAll(".xl-chip").forEach(c => c.setAttribute("aria-pressed", +c.dataset.ex === i));
    $(".xl-text").textContent = e.text;
    $(".xl-rand").hidden = !e.rand;
    select(e.sel);
  }
  function randomize() {
    const r = examples[S.ex].rand; if (!r) return;
    rndFill(r, S.cells);
    recalc(); inp.value = S.cells[S.sel] ?? ""; render();
  }
  function stopPlay() { clearInterval(S.timer); S.timer = null; playBtn.setAttribute("aria-pressed", "false"); playBtn.textContent = "▶ Автопоказ"; }
  playBtn.addEventListener("click", () => {
    if (S.timer) return stopPlay();
    playBtn.setAttribute("aria-pressed", "true"); playBtn.textContent = "■ Стоп";
    const step = () => { if (examples[S.ex].rand && Math.random() < .5) randomize(); else load((S.ex + 1) % examples.length); };
    step(); S.timer = setInterval(step, 3500);
  });
  root.querySelector(".xl-ex").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) { stopPlay(); load(+b.dataset.ex); } });
  $(".xl-rand").addEventListener("click", () => { stopPlay(); randomize(); });
  $(".xl-reset").addEventListener("click", () => { stopPlay(); load(S.ex); });
  /* Режим указания: пока пишется формула, щелчок по ячейке вставляет её адрес, протягивание — диапазон */
  let point = null, pointed = false;
  /* Как в Excel: адрес вставляется, только если курсор стоит там, где ожидается ссылка (после = ( ; : + - * / ^) */
  const editingFormula = () => {
    if (document.activeElement !== inp || !inp.value.trim().startsWith("=")) return false;
    const before = inp.value.slice(0, inp.selectionStart).replace(/\s+$/, "");
    return /[=(;:+\-*\/^<>]$/.test(before);
  };
  function rangeText(a, b) {

/* Физминутка: 4 упражнения по 15 секунд */
const BREAK = [
  ["Глаза", "Посмотри вдаль, в окно, а потом на кончик носа. Повтори несколько раз."],
  ["Восьмёрка", "Не поворачивая головы, нарисуй глазами большую восьмёрку. Потом в другую сторону."],
  ["Кисти рук", "Сожми кулаки и разожми. Покрути кистями в одну и в другую сторону."],
  ["Потянись", "Встань, подними руки вверх и потянись. Медленно наклони голову вправо и влево."]
];
let brkTimer = null, brkI = 0, brkLeft = 0;
function breakStep(i) {
  brkI = i;
  if (i >= BREAK.length) return breakEnd();
  document.getElementById("brkStep").textContent = `${i + 1} из ${BREAK.length} · ${BREAK[i][0]}`;
  document.getElementById("brkText").textContent = BREAK[i][1];
  brkLeft = 15; breakTick();
}
function breakTick() {
  document.getElementById("brkTime").textContent = brkLeft;
  document.getElementById("brkBar").style.width = ((brkI * 15 + (15 - brkLeft)) / (BREAK.length * 15) * 100) + "%";
}
function breakStart() {
  clearInterval(brkTimer);
  document.getElementById("breakOv").hidden = false;
  breakStep(0);
  brkTimer = setInterval(() => { brkLeft--; if (brkLeft < 0) breakStep(brkI + 1); else breakTick(); }, 1000);
}
function breakEnd() {
  clearInterval(brkTimer); brkTimer = null;
  document.getElementById("breakOv").hidden = true;
  if (window.__onBreakEnd) window.__onBreakEnd();
}
window.__breakStart = breakStart;
["breakBtn", "breakBtn2"].forEach(id => document.getElementById(id).addEventListener("click", breakStart));
document.getElementById("brkSkip").addEventListener("click", () => breakStep(brkI + 1));
document.getElementById("brkEnd").addEventListener("click", breakEnd);

function exNum(v) {

function exGrid(data) {
  const keys = Object.keys(data);
  const maxC = Math.max(...keys.map(k => k.charCodeAt(0))), maxR = Math.max(...keys.map(k => +k.slice(1)));
  const cols = []; for (let c = 65; c <= maxC; c++) cols.push(String.fromCharCode(c));
  let h = '<div class="tablewrap"><table class="mini ex-data ex-grid"><tr><th></th>' + cols.map(c => `<th>${c}</th>`).join("") + "</tr>";
  for (let r = 1; r <= maxR; r++) h += `<tr><th>${r}</th>` + cols.map(c => { const v = data[c + r] ?? ""; return `<td class="${exNum(v) !== null ? "n" : "t"}">${v.replace(/</g, "&lt;")}</td>`; }).join("") + "</tr>";
  return h + "</table></div>";
}

}
function loginUI() {
  const ov = document.getElementById("login"), body = document.getElementById("loginBody");
  ov.hidden = false;
  body.innerHTML = `<p class="lg-q">Впиши свои данные</p>
    <label class="lg-l" for="lgCls">Класс</label><input id="lgCls" class="lg-in" maxlength="20" placeholder="например, 8А" autocomplete="off">
    <label class="lg-l" for="lgName">Фамилия и имя</label><input id="lgName" class="lg-in" maxlength="80" placeholder="например, Сейткали Айдана" autocomplete="off">
    <p class="lg-err" id="lgErr" aria-live="polite"></p>
    <button type="button" class="btn main lg-big" id="lgGo">Начать урок</button>`;
  const go = () => {
    const c = normClass(document.getElementById("lgCls").value), n = normName(document.getElementById("lgName").value);
    const err = document.getElementById("lgErr");
    if (!/^\d{1,2}[А-ЯЁӘҒҚҢӨҰҮҺІ]?$/.test(c)) { err.textContent = "Класс пишется так: цифра и буква, например 8А."; return; }
    if (n.split(" ").length < 2 || n.length < 5) { err.textContent = "Впиши фамилию и имя через пробел."; return; }
    err.textContent = "Сохраняю…";
    document.getElementById("lgGo").disabled = true;
    const old = document.getElementById("lgSug"); if (old) old.remove();
    register(c, n).then(r => { document.getElementById("lgGo").disabled = false; if (r && r.suggest) suggest(r); else enter(r); })
      .catch(e => { document.getElementById("lgGo").disabled = false; err.textContent = (e && e.message) ? e.message : "Не получилось. Проверь связь и попробуй ещё раз."; });
  };
  function suggest(r) {
    const err = document.getElementById("lgErr"); err.textContent = "";
    const box = document.createElement("div"); box.className = "lg-sug"; box.id = "lgSug";
    box.innerHTML = `<p>Такого ученика нет в списке. Может быть, ты — <b></b>?</p><div class="lg-row"><button type="button" class="btn main" id="sugYes">Да, это я</button><button type="button" class="btn" id="sugNo">Нет</button></div>`;
    box.querySelector("b").textContent = `${r.suggest}, ${r.cls}`;
    err.after(box);
    document.getElementById("sugYes").onclick = () => { box.remove(); err.textContent = "Вхожу…"; register(r.cls, r.suggest).then(enter).catch(e => { err.textContent = e.message || "Не получилось."; }); };
    document.getElementById("sugNo").onclick = () => { box.remove(); err.textContent = "Тогда проверь, как написаны фамилия и имя, или скажи учителю, чтобы он добавил тебя в список."; };
  }
  document.getElementById("lgGo").onclick = go;
  ["lgCls", "lgName"].forEach(id => document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
  document.getElementById("lgCls").focus();
  function enter(st) {
    me = st;
    NS = "st:" + st.id + ":";
    ov.hidden = true;
    document.getElementById("whoName").textContent = `${st.name}, ${st.cls}`;
    document.getElementById("who").hidden = false;
    startLesson();
    if (!ONLINE) return;
    syncNow();
    setInterval(syncNow, 60000);
    pollQuestion(); setInterval(pollQuestion, 5000);
  }
}

/* Вопрос учителя всплывает у всех учеников */
let shownQ = null;
function pollQuestion() {
  gsr("getQuestion").then(q => {
    setNet(true);
    const answered = lsGet(NS + "answered", []);
    const modal = document.getElementById("qModal");
    if (q && q.open && q.type === "break") {
      if (!answered.includes(q.id) && shownQ !== q.id) {
        shownQ = q.id;
        window.__onBreakEnd = () => { const a = lsGet(NS + "answered", []); if (!a.includes(q.id)) { a.push(q.id); lsSet(NS + "answered", a); } shownQ = null; };
        window.__breakStart();
      }
      return;
    }
    if (q && q.open && !answered.includes(q.id)) {
      if (shownQ !== q.id) {
        shownQ = q.id;
        document.getElementById("qText").textContent = q.text;
        document.getElementById("qAns").value = "";
        document.getElementById("qErr").textContent = "";
        modal.hidden = false;
        document.getElementById("qAns").focus();
      }
    } else if (!modal.hidden) {
      modal.hidden = true; shownQ = null;
      if (q && !q.open) toast("Учитель закрыл вопрос.");
    }
  }).catch(() => setNet(false));
}
function sendAnswer() {
  const text = document.getElementById("qAns").value.trim(), err = document.getElementById("qErr");
  if (!text) { err.textContent = "Напиши ответ."; return; }
  const btn = document.getElementById("qSend"); btn.disabled = true; err.textContent = "Отправляю…";
  gsr("submitAnswer", { qid: shownQ, text, cls: me.cls, name: me.name, id: me.id }).then(() => {
    const a = lsGet(NS + "answered", []); a.push(shownQ); lsSet(NS + "answered", a);
    document.getElementById("qModal").hidden = true; shownQ = null; btn.disabled = false;
    toast("Ответ отправлен учителю.");
  }).catch(e => { btn.disabled = false; err.textContent = (e && e.message) || "Не получилось отправить. Попробуй ещё раз."; });
}
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3500); }

function onlineBoot() {
  window.__onStore = syncSoon;
  window.__onStage = id => { curStage = id; syncSoon(); };
  window.__onAttempt = (stage, task, answer, ok, note) => { if (me) gsr("logAttempt", { id: me.id, cls: me.cls, name: me.name, stage, task, answer: String(answer), ok: !!ok, note: note || "" }).catch(() => setNet(false)); };
  document.getElementById("qSend").addEventListener("click", sendAnswer);
  document.getElementById("qAns").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendAnswer(); });
  document.getElementById("whoChange").addEventListener("click", () => { document.getElementById("whoHint").hidden = false; });
  loginUI();
}
if (ONLINE) onlineBoot();
else {
  loginUI();
  const n = document.getElementById("netState"); n.textContent = "ответы сохраняются на этом компьютере"; n.className = "net";
  document.getElementById("whoChange").addEventListener("click", () => { document.getElementById("whoHint").hidden = false; });
}


}
function L_kz() {

/* Урок запускается сразу; в онлайн-версии — после того, как ученик выбрал себя */
const ONLINE = !!(window.google && window.google.script && window.google.script.run);
let NS = "";
function startLesson() {

/* Тема в двух строках листа; буквы открываются ответами на вопросы детектива по двум диаграммам */
const ROWS = ["СТАТИСТИКАЛЫҚ", "ФУНКЦИЯЛАР"];

const CHARTS = [

/* opts: [вариант, буква, пояснение для неверного варианта] — верный вариант в ans */

  { n: 3, chart: "t", q: "Қай күні ең суық болды?", ans: "Ср",

  { n: 4, chart: "t", q: "Аптадағы ең төмен температура қандай?", ans: "9",
    opts: [["12", "Ы", "12° — дүйсенбі, бірақ одан да суық күн бар."], ["0", "Й", "Диаграммада мұндай температура жоқ: бағандардың үстіндегі жазуларға қара."], ["15", "Ю", "15° — сейсенбі. Ең аласа бағанды тап."], ["9", "И"]] },
  { n: 5, chart: "t", q: "Аптада орташа есеппен температура қандай болды? Жеті температураны қосып, 7-ге бөл.", ans: "17",
    opts: [["119", "Б", "119 — бұл қосынды. Оны әлі күн санына — 7-ге бөлу керек."], ["17", "К"], ["18", "Щ", "18° — бұл бейсенбі. Орташа барлық күн бойынша есептеледі: қосынды : 7."], ["24", "Ж", "24° — ең жылы күн, орташа емес."]] },
  { n: 6, chart: "t", q: "Ең жылы күн ең суық күннен қанша градусқа жылы?", ans: "15",
    opts: [["33", "З", "Температураларды қоспайды, алады: ең жоғарысы − ең төмені."], ["15", "Л"], ["12", "О", "Ең жоғары және ең төмен температураны тауып, біреуінен екіншісін ал."], ["3", "Г", "Дәл ең жылы және ең суық күнді салыстыр."]] },
  { n: 7, chart: "t", q: "Неше күн температура орташадан (17°) жоғары болды?", ans: "4",
    opts: [["3", "Г", "17°-тан жоғары барлық бағанды қайта сана: 18, 21, 24, 20."], ["4", "Ы"], ["5", "Х", "17°-тан жоғары бағандар — тек 18, 21, 24 және 20."], ["7", "Л", "Барлық күн орташадан жылы емес: 12, 15 және 9 — төмен."]] },
  { n: 8, chart: "i", q: "Қай күні балмұздақ ең көп сатылды?", ans: "Сн",
    opts: [["Жм", "В", "Жұмада 75 дана, ал одан да көп сатылған күн бар."], ["Жс", "Д", "Жексенбіде 65 дана. Ең биік бағанды тап."], ["Сн", "Қ"], ["Бс", "П", "Бейсенбіде 60 дана — бұл ең биік баған емес."]] },
  { n: 9, chart: "i", q: "Күніне орташа есеппен қанша балмұздақ сатылды? Барлық сатылымды қосып, 7-ге бөл.", ans: "55",
    opts: [["385", "Ы", "385 — бұл апталық қосынды. Оны 7 күнге бөл."], ["90", "Ю", "90 — ең үлкен сатылым, орташа емес."], ["55", "Ф"], ["60", "О", "60 — бейсенбідегі сатылым. Орташа барлық күн бойынша есептеледі."]] },
  { n: 10, chart: "i", q: "Аптадағы ең аз сатылым қандай?", ans: "20",
    opts: [["30", "ҮМ", "30 — дүйсенбі, бірақ азырақ сатылған күн бар."], ["20", "УН"], ["0", "ӨП", "Диаграммада сатылымсыз күн жоқ: жазуларға қара."], ["45", "ЮЛ", "45 — сейсенбі. Ең аласа бағанды тап."]] },
  { n: 11, chart: "both", q: "Екі диаграмманы салыстыр. Далада жылырақ болғанда балмұздақ … сатылады.", ans: "көбірек",
    opts: [["азырақ", "ШӘП", "Сенбіге қара: ең жылы күн және ең үлкен сатылым."], ["көбірек", "ЦЯР"], ["сонша", "ЩЕЗ", "Сатылым өзгереді: сәрсенбіде 20 дана, сенбіде 90."], ["байланысы жоқ", "ЖІВ", "Салыстыр: ең суық күн — сәрсенбі, ал ең аз сатылым да сәрсенбіде."]] }
];
TASKS.forEach(t => { const o = t.opts.find(x => x[0] === t.ans); t.letter = o[1]; });
/* буква может открываться группой («УН»): каждая буква листа знает своё задание */
const BY_LETTER = {}; TASKS.forEach(t => [...t.letter].forEach(ch => { BY_LETTER[ch] = t; }));
const ANSWER = ROWS.join("");
const COLS = "ABCDEFGHIJKLMN";
const KEY = "topic-l3-kz";

const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} if (window.__onStore) window.__onStore(k); },
  del(k) { try { localStorage.removeItem(NS + k); } catch (e) {} if (window.__onStore) window.__onStore(k); }
};

/* picks: номер вопроса → выбранный вариант */
let picks = store.get(KEY, {});
let solved = new Set(TASKS.filter(t => picks[t.n] === t.ans).map(t => t.n));

/* Столбчатая диаграмма: один ряд, подписи значений над столбиками, бледная сетка */
function barChart(c) {
  const W = 360, H = 220, L = 34, R = 8, T = 22, B = 26, iw = W - L - R, ih = H - T - B, slot = iw / c.values.length, bw = slot * .58;
  const y = v => T + ih - v / c.max * ih;
  let g = "";
  for (let v = 0; v <= c.max; v += c.step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="ch-grid"/><text x="${L - 6}" y="${y(v) + 4}" class="ch-ax" text-anchor="end">${v}</text>`;
  const bars = c.values.map((v, i) => {
    const x = L + i * slot + (slot - bw) / 2, top = y(v), r = 4, base = y(0);
    const d = `M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${base}Z`;
    return `<g class="ch-bar"><title>${DAYS[i]}: ${v} ${c.unit}</title><rect x="${L + i * slot}" y="${T}" width="${slot}" height="${ih + B}" fill="transparent"/><path d="${d}"/><text x="${x + bw / 2}" y="${top - 5}" class="ch-val" text-anchor="middle">${v}</text><text x="${x + bw / 2}" y="${H - 8}" class="ch-ax" text-anchor="middle">${DAYS[i]}</text></g>`;
  }).join("");
  return `<figure class="chart" id="chart-${c.id}"><figcaption>${c.title}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.title}: ${c.values.map((v, i) => DAYS[i] + " " + v).join(", ")}">${g}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" class="ch-base"/>${bars}</svg>
    <details><summary>Кестемен көрсету</summary><table class="mini"><tr>${DAYS.map(d => `<th>${d}</th>`).join("")}</tr><tr>${c.values.map(v => `<td>${v}</td>`).join("")}</tr></table></details></figure>`;
}
document.getElementById("charts").innerHTML = CHARTS.map(barChart).join("");

function buildGrid() {
  const width = Math.max(...ROWS.map(r => r.length));
  let html = "<tr><th class=\"rh\"></th>" + [...COLS.slice(0, width)].map(c => `<th>${c}</th>`).join("") + "</tr>";
  ROWS.forEach((row, ri) => {
    html += `<tr><th class="rh">${ri + 1}</th>`;
    for (let i = 0; i < width; i++) {
      const ch = row[i];
      if (!ch) { html += "<td class=\"gap\"></td>"; continue; }
      const t = BY_LETTER[ch];
      html += `<td data-n="${t.n}" data-ch="${ch}" aria-label="${COLS[i]}${ri + 1} ұяшығы, ${t.n}-сұрақ"><div class="cell"><span class="ch">?</span><span class="no">${t.n}</span></div></td>`;
    }
    html += "</tr>";
  });
  document.getElementById("grid").innerHTML = html;
}

function buildTasks() {
  const where = { t: "«Температура» диаграммасы", i: "«Балмұздақ» диаграммасы", both: "екі диаграмма да" };
  document.getElementById("tasks").innerHTML = TASKS.map(t => `
    <div class="task fork" id="task-${t.n}">
      <div class="hd"><span class="tn">Сұрақ ${t.n}</span><span class="fn">${where[t.chart]}</span></div>
      <p class="fork-q">${t.q}</p>
      <div class="fork-br opts4" role="group" aria-label="Сұрақтың жауабы ${t.n}">
        ${t.opts.map(o => `<button type="button" class="fork-b" data-n="${t.n}" data-b="${o[0]}" aria-pressed="false"><span>${o[0]}</span><span class="lt">?</span></button>`).join("")}
      </div>
      <p class="msg" id="msg-${t.n}" aria-live="polite"></p>
    </div>`).join("");
}

function render(animateN) {
  document.querySelectorAll("#grid td[data-n]").forEach(td => {
    const n = +td.dataset.n, t = TASKS[n - 1], p = picks[n];
    const open = solved.has(n), wrong = !!p && !open, o = wrong ? t.opts.find(x => x[0] === p) : null;
    td.classList.toggle("open", open);
    td.classList.toggle("wrongl", wrong);
    td.querySelector(".ch").textContent = open ? td.dataset.ch : o ? o[1][[...t.letter].indexOf(td.dataset.ch)] : "?";
    if (p && n === animateN) { td.classList.remove("flip"); void td.offsetWidth; td.classList.add("flip"); }
  });
  TASKS.forEach(t => {
    const box = document.getElementById("task-" + t.n), p = picks[t.n], done = solved.has(t.n);
    box.classList.toggle("done", done);
    box.classList.toggle("wrongp", !!p && !done);
    box.querySelectorAll(".fork-b").forEach(b => {
      const mine = b.dataset.b === p, o = t.opts.find(x => x[0] === b.dataset.b);
      b.setAttribute("aria-pressed", mine);
      b.classList.toggle("ok", mine && done);
      b.classList.toggle("no", mine && !done);
      b.querySelector(".lt").textContent = mine ? o[1] : "?";
      b.disabled = done;
    });
    const msg = document.getElementById("msg-" + t.n);
    const o = p ? t.opts.find(x => x[0] === p) : null;
    if (done) { msg.className = "msg ok"; msg.textContent = `Дұрыс! «${t.letter}» әрпі ашылды.`; }
    else if (o) { msg.className = "msg bad"; msg.textContent = `«${o[1]}» әрпі сөзді бұзады. ${o[2] || ""} Басқа жауапты таңда.`; }
    else { msg.className = "msg"; msg.textContent = ""; }
  });
  const total = ANSWER.length;
  const open = [...ANSWER].filter(ch => solved.has(BY_LETTER[ch].n)).length;
  document.getElementById("pbar").style.width = (open / total * 100) + "%";
  document.getElementById("pnum").textContent = `Ашылған әріптер: ${open} / ${total}`;
  if (open === total) unlock();
}

function choose(n, b) {
  const t = TASKS[n - 1];
  if (solved.has(n)) return;
  picks[n] = b;
  const ok = b === t.ans;
  if (ok) solved.add(n);
  if (window.__onAttempt) window.__onAttempt("2. Разгадка темы", "Вопрос " + n, b, ok, ok ? "" : "верно: " + t.ans);
  store.set(KEY, picks);
  render(n);
}

document.getElementById("tasks").addEventListener("click", e => {
  const b = e.target.closest(".fork-b"); if (b && !b.disabled) choose(+b.dataset.n, b.dataset.b);
});

function norm(s) { return s.toUpperCase().replace(/Ё/g, "Е").replace(/[^А-ЯЁӘҒҚҢӨҰҮҺІA-Z]/g, ""); }
function guess() {
  const inp = document.getElementById("guessIn"), msg = document.getElementById("guessMsg");
  inp.classList.remove("wrong");
  if (norm(inp.value) === ANSWER) {
    TASKS.forEach(t => { picks[t.n] = t.ans; solved.add(t.n); }); store.set(KEY, picks);
    msg.className = "msg ok"; msg.textContent = "Дұрыс! Тақырып ашылды.";
    render();
  } else {
    void inp.offsetWidth; inp.classList.add("wrong");
    msg.className = "msg bad"; msg.textContent = "Әзірге олай емес. Тағы бірнеше әріп ашыңыз.";
  }
}
document.getElementById("guessBtn").addEventListener("click", guess);
document.getElementById("guessIn").addEventListener("keydown", e => { if (e.key === "Enter") guess(); });

let unlocked = false;
function unlock() {
  const tab = document.getElementById("tab-goal");
  tab.disabled = false;
  if (unlocked) return;

function prLoad() { return store.get(PR_KEY, {}); }

function prCalls(n, out) {

function prWhy(mine, want) {

/* Данные для проверки: каждое значение из списков pick (граница условия) и несколько случайных наборов */

/* Проверка: формула, нужная функция, верный результат и тот же результат на других числах */
function prCheck(t, S) {
  for (const k of Object.keys(t.ref)) {
    const raw = String(S.cells[k] ?? "").trim();
    if (!raw) return { ok: false, cell: k, msg: `${k} ұяшығы бос. Оған формула жаз.` };
    if (!raw.startsWith("=")) return { ok: false, cell: k, msg: `${k} ұяшығында жай сан немесе мәтін тұр. Формула керек — ол «=» таңбасынан басталады.` };
    let ast;
    try { ast = xlParse(raw.slice(1)); } catch (e) {
      if (!(e instanceof XSyntax)) throw e;
      return { ok: false, cell: k, msg: `${k} ұяшығындағы формула қате жазылған: ${e.message}` };
    }
    const used = prCalls(ast, new Set());
    const miss = t.must[k].filter(f => !used.has(f));
    if (miss.length) return { ok: false, cell: k, msg: miss.length > 1 ? `${k} ұяшығындағы формулада ${miss.join(" және ")} функциялары болуы керек. Тапсырма дәл соларды тексереді.` : `${k} ұяшығындағы формулада ${miss[0]} функциясы болуы керек. Тапсырма дәл соны тексереді.` };
    const extra = (t.forbid || []).filter(f => used.has(f));
    if (extra.length) return { ok: false, cell: k, msg: `Мұнда ${extra.join(" және ")} функциясынсыз есепте: бұл «қолмен» жаттығу — қосынды санына бөлінеді.` };
    const mine = xlEvalCell({ cells: S.cells, cache: new Map() }, k, new Set());
    if (mine instanceof XErr) return { ok: false, cell: k, msg: `${k} ұяшығындағы формула ${mine.code} береді. ` + (XL_ERR[mine.code] || "Қалай жазылғанын тексер.") };
    const want = prEval(S.cells, k, t.ref[k]);
    if (!prSame(mine, want)) return { ok: false, cell: k, msg: `${k} ұяшығында ${prShow(mine)} шықты, ал басқа мән болуы керек. ` + prWhy(mine, want) };
    for (const cells of prVariants(t.vary, S.cells)) {
      const a = prEval(cells, k, raw), b = prEval(cells, k, t.ref[k]);
      if (b instanceof XErr) continue;
      if (!prSame(a, b)) {
        const keys = [...new Set((t.vary.groups || [t.vary]).flatMap(g => g.keys))];
        return { ok: false, cell: k, msg: `Қазір жауап сәйкес келді, бірақ басқа деректермен тексергенде қате табылды: егер ${keys.map(x => x + " = " + (xlNum(cells[x]) !== null ? xlFmt(xlNum(cells[x])) : cells[x])).join(", ")} болса, ${k} ұяшығында ${prShow(b)} болуы керек, ал формула ${prShow(a)} береді. Формулада дайын сандар емес, ұяшық адрестері тұрғанын және ауқымға керекті ұяшықтардың бәрі кіргенін тексер.` };
      }
    }
  }
  return { ok: true };
}

/* Задание открывается, когда решено предыдущее; уровень — когда открыто его первое задание */
function prUnlocked(id) {

function shuffleSeeded(arr, seed) {
  let h = 2166136261;
  for (const ch of String(seed)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }

  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let brkTimer = null, brkI = 0, brkLeft = 0;
function breakStep(i) {
  brkI = i;
  if (i >= BREAK.length) return breakEnd();
  document.getElementById("brkStep").textContent = `${i + 1} / ${BREAK.length} · ${BREAK[i][0]}`;
  document.getElementById("brkText").textContent = BREAK[i][1];
  brkLeft = 15; breakTick();
}
function breakTick() {
  document.getElementById("brkTime").textContent = brkLeft;
  document.getElementById("brkBar").style.width = ((brkI * 15 + (15 - brkLeft)) / (BREAK.length * 15) * 100) + "%";
}
function breakStart() {
  clearInterval(brkTimer);
  document.getElementById("breakOv").hidden = false;
  breakStep(0);
  brkTimer = setInterval(() => { brkLeft--; if (brkLeft < 0) breakStep(brkI + 1); else breakTick(); }, 1000);
}
function breakEnd() {
  clearInterval(brkTimer); brkTimer = null;
  document.getElementById("breakOv").hidden = true;
  if (window.__onBreakEnd) window.__onBreakEnd();
}
window.__breakStart = breakStart;
["breakBtn", "breakBtn2"].forEach(id => document.getElementById(id).addEventListener("click", breakStart));
document.getElementById("brkSkip").addEventListener("click", () => breakStep(brkI + 1));
document.getElementById("brkEnd").addEventListener("click", breakEnd);

function exNum(v) {
  const s = String(v).trim().replace(/\s+/g, "").replace(/ /g, "").replace("−", "-").replace(",", ".");
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;

function exGrid(data) {
  const keys = Object.keys(data);
  const maxC = Math.max(...keys.map(k => k.charCodeAt(0))), maxR = Math.max(...keys.map(k => +k.slice(1)));
  const cols = []; for (let c = 65; c <= maxC; c++) cols.push(String.fromCharCode(c));
  let h = '<div class="tablewrap"><table class="mini ex-data ex-grid"><tr><th></th>' + cols.map(c => `<th>${c}</th>`).join("") + "</tr>";
  for (let r = 1; r <= maxR; r++) h += `<tr><th>${r}</th>` + cols.map(c => { const v = data[c + r] ?? ""; return `<td class="${exNum(v) !== null ? "n" : "t"}">${v.replace(/</g, "&lt;")}</td>`; }).join("") + "</tr>";
  return h + "</table></div>";
}

  body.innerHTML = `<p class="lg-q">Деректеріңді жаз</p>
    <label class="lg-l" for="lgCls">Сынып</label><input id="lgCls" class="lg-in" maxlength="20" placeholder="мысалы, 8А" autocomplete="off">
    <label class="lg-l" for="lgName">Тегі мен аты</label><input id="lgName" class="lg-in" maxlength="80" placeholder="мысалы, Сейткали Айдана" autocomplete="off">
    <p class="lg-err" id="lgErr" aria-live="polite"></p>
    <button type="button" class="btn main lg-big" id="lgGo">Сабақты бастау</button>`;
  const go = () => {
    const c = normClass(document.getElementById("lgCls").value), n = normName(document.getElementById("lgName").value);
    const err = document.getElementById("lgErr");
    if (!/^\d{1,2}[А-ЯЁӘҒҚҢӨҰҮҺІ]?$/.test(c)) { err.textContent = "Сынып былай жазылады: сан мен әріп, мысалы, 8А."; return; }
    if (n.split(" ").length < 2 || n.length < 5) { err.textContent = "Тегің мен атыңды бос орын арқылы жаз."; return; }
    err.textContent = "Сақтап жатырмын…";
    document.getElementById("lgGo").disabled = true;
    const old = document.getElementById("lgSug"); if (old) old.remove();
    register(c, n).then(r => { document.getElementById("lgGo").disabled = false; if (r && r.suggest) suggest(r); else enter(r); })
      .catch(e => { document.getElementById("lgGo").disabled = false; err.textContent = (e && e.message) ? e.message : "Болмады. Байланысты тексеріп, тағы бір рет көр."; });
  };
  function suggest(r) {
    const err = document.getElementById("lgErr"); err.textContent = "";
    const box = document.createElement("div"); box.className = "lg-sug"; box.id = "lgSug";
    box.innerHTML = `<p>Мұндай оқушы тізімде жоқ. Мүмкін, сен — <b></b>?</p><div class="lg-row"><button type="button" class="btn main" id="sugYes">Иә, бұл менмін</button><button type="button" class="btn" id="sugNo">Жоқ</button></div>`;
    box.querySelector("b").textContent = `${r.suggest}, ${r.cls}`;
    err.after(box);
    document.getElementById("sugYes").onclick = () => { box.remove(); err.textContent = "Кіріп жатырмын…"; register(r.cls, r.suggest).then(enter).catch(e => { err.textContent = e.message || "Болмады."; }); };
    document.getElementById("sugNo").onclick = () => { box.remove(); err.textContent = "Онда тегің мен атыңның қалай жазылғанын тексер немесе мұғалімге айт, сені тізімге қоссын."; };
  }
  document.getElementById("lgGo").onclick = go;
  ["lgCls", "lgName"].forEach(id => document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
  document.getElementById("lgCls").focus();
  function enter(st) {
    me = st;
    NS = "st:" + st.id + ":";
    ov.hidden = true;
    document.getElementById("whoName").textContent = `${st.name}, ${st.cls}`;
    document.getElementById("who").hidden = false;
    startLesson();
    if (!ONLINE) return;
    syncNow();
    setInterval(syncNow, 60000);
    pollQuestion(); setInterval(pollQuestion, 5000);
  }
}

/* Вопрос учителя всплывает у всех учеников */
let shownQ = null;
function pollQuestion() {
  gsr("getQuestion").then(q => {
    setNet(true);
    const answered = lsGet(NS + "answered", []);
    const modal = document.getElementById("qModal");
    if (q && q.open && q.type === "break") {
      if (!answered.includes(q.id) && shownQ !== q.id) {
        shownQ = q.id;
        window.__onBreakEnd = () => { const a = lsGet(NS + "answered", []); if (!a.includes(q.id)) { a.push(q.id); lsSet(NS + "answered", a); } shownQ = null; };
        window.__breakStart();
      }
      return;
    }
    if (q && q.open && !answered.includes(q.id)) {
      if (shownQ !== q.id) {
        shownQ = q.id;
        document.getElementById("qText").textContent = q.text;
        document.getElementById("qAns").value = "";
        document.getElementById("qErr").textContent = "";
        modal.hidden = false;
        document.getElementById("qAns").focus();
      }
    } else if (!modal.hidden) {
      modal.hidden = true; shownQ = null;
      if (q && !q.open) toast("Мұғалім сұрақты жапты.");
    }
  }).catch(() => setNet(false));
}
function sendAnswer() {
  const text = document.getElementById("qAns").value.trim(), err = document.getElementById("qErr");
  if (!text) { err.textContent = "Жауапты жаз."; return; }
  const btn = document.getElementById("qSend"); btn.disabled = true; err.textContent = "Жіберіп жатырмын…";
  gsr("submitAnswer", { qid: shownQ, lang: "kz", text, cls: me.cls, name: me.name, id: me.id }).then(() => {
    const a = lsGet(NS + "answered", []); a.push(shownQ); lsSet(NS + "answered", a);
    document.getElementById("qModal").hidden = true; shownQ = null; btn.disabled = false;
    toast("Жауап мұғалімге жіберілді.");
  }).catch(e => { btn.disabled = false; err.textContent = (e && e.message) || "Жіберу мүмкін болмады. Тағы бір рет көр."; });
}
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3500); }

function onlineBoot() {
  window.__onStore = syncSoon;
  window.__onStage = id => { curStage = id; syncSoon(); };
  window.__onAttempt = (stage, task, answer, ok, note) => { if (me) gsr("logAttempt", { id: me.id, cls: me.cls, name: me.name, stage, task, answer: String(answer), ok: !!ok, note: note || "" }).catch(() => setNet(false)); };
  document.getElementById("qSend").addEventListener("click", sendAnswer);
  document.getElementById("qAns").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendAnswer(); });
  document.getElementById("whoChange").addEventListener("click", () => { document.getElementById("whoHint").hidden = false; });
  loginUI();
}
if (ONLINE) onlineBoot();
else {
  loginUI();
  const n = document.getElementById("netState"); n.textContent = "жауаптар осы компьютерде сақталады"; n.className = "net";
  document.getElementById("whoChange").addEventListener("click", () => { document.getElementById("whoHint").hidden = false; });
}


}
</script>
