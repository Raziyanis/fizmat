const TASKS_Z = TASKS_PR.filter(t => t.lv === "0");

function prLoad() { return store.get(PR_KEY, {}); }
function prSave(d) { store.set(PR_KEY, d); }
function prAll() { return TASKS_PR; }
/* Задание открывается, когда решено предыдущее; уровень — когда открыто его первое задание */
function prUnlocked(id) {
  const order = prAll(), i = order.findIndex(t => t.id === id), d = prLoad();
  return i <= 0 || !!(d[order[i - 1].id] && d[order[i - 1].id].ever);
}
function prLocks() {
  const order = prAll();
  order.forEach((t, i) => {
    const card = document.getElementById("pt-" + t.id); if (!card) return;
    const open = prUnlocked(t.id);
    card.classList.toggle("locked", !open);
    card.inert = !open;
    let l = card.querySelector(".tc-lock");
    if (!l) { l = document.createElement("p"); l.className = "tc-lock"; card.querySelector(".tc-head").after(l); }
    l.textContent = open ? "" : `Жабық. ${order[i - 1].id} тапсырмасы шешілгенде ашылады.`;
  });
  document.querySelectorAll(".lv").forEach(b => {
    const first = order.find(t => t.lv === b.dataset.lv);
    const open = first && prUnlocked(first.id);
    b.disabled = !open;
    b.title = open ? "" : "Алдыңғы деңгейдің барлық тапсырмасы шешілгенде деңгей ашылады";
  });
  const nx = document.getElementById("lvNext");
  if (nx && !nx.hidden) { const first = order.find(t => t.lv === nx.dataset.lv); nx.disabled = !(first && prUnlocked(first.id)); }
}
function prRender() {
  const d = prLoad();
  const solved = prAll().filter(t => d[t.id] && d[t.id].ok).length;
  document.getElementById("prBar").style.width = (solved / prAll().length * 100) + "%";
  document.getElementById("prNum").textContent = `Шешілді: ${solved} / ${prAll().length}`;
  Object.keys(LEVELS_PR).forEach(lv => {
    const list = prAll().filter(t => t.lv === lv), ok = list.filter(t => d[t.id] && d[t.id].ok).length;
    document.getElementById("lvc" + lv).textContent = `${ok}/${list.length}`;
    document.querySelector(`.lv[data-lv="${lv}"]`).classList.toggle("full", ok === list.length);
  });
  prLocks();
}
function prShowLevel(lv) {
  document.querySelectorAll(".lv").forEach(b => b.setAttribute("aria-selected", b.dataset.lv === lv));
  document.querySelectorAll("#prTasks .task-card").forEach(c => { c.hidden = c.dataset.lv !== lv; });
  document.getElementById("lvDesc").textContent = LEVELS_PR[lv].desc;
  const order = Object.keys(LEVELS_PR), nx = order[order.indexOf(lv) + 1];
  const btn = document.getElementById("lvNext");
  btn.hidden = !nx; if (nx) { btn.dataset.lv = nx; btn.textContent = `${LEVELS_PR[nx].name} деңгейіне өту →`; }
  store.set("practice-lv", lv);
  prLocks();
}

/* Карточка задания: «Что выведет?» — поле ответа; остальные — редактор, ввод и проверка на других данных.
   cfg: key — хранилище, stage — этап для учителя, idp — префикс id, doneText — подпись решённого, onDone — после проверки */
function taskCard(t, cfg) {
  const isPred = t.kind === "predict";
  const head = t.lvName ? `${t.lvName} · ${t.fn}` : `${KIND[t.kind]} · ${t.fn}`;
  const html = `
    <section class="block task-card" data-lv="${t.lv}" id="${cfg.idp}-${t.id}"${cfg.hidden ? " hidden" : ""}>
      <div class="tc-head"><span class="tc-id">${t.id}</span><span class="tc-fn">${head}</span><span class="tc-status" aria-live="polite"></span></div>
      <p class="tc-q">${t.q}</p>
      ${t.plan ? `<ol class="plan">${t.plan.map(s => `<li>${s}</li>`).join("")}</ol>` : ""}
      ${isPred ? `<pre class="code-view"></pre>
      <div class="pred"><label for="${cfg.idp}-in-${t.id}">Менің жауабым — экранда не пайда болады</label><textarea class="pred-in" id="${cfg.idp}-in-${t.id}" rows="1" spellcheck="false" autocomplete="off"></textarea></div>`
      : `<div class="pyed"></div>${t.kind === "write" || t.sampleShow ? `<div class="sample-box"><p class="small">Мысал: мұндай деректерде бағдарлама мынаны шығаруы керек</p><div class="sample"><pre class="s-in"></pre><pre class="s-out"></pre></div></div>` : ""}`}
      <div class="tc-actions">
        <button type="button" class="btn main tc-check">Тексеру</button>
        <button type="button" class="btn tc-hintbtn">Кеңес</button>
        ${isPred ? `<button type="button" class="btn tc-run" hidden>Python-да іске қосу</button>` : `<button type="button" class="btn tc-reset">Қайта бастау</button>`}
      </div>
      <p class="tc-msg" aria-live="polite"></p>
      <p class="tc-hint" hidden></p>
      ${isPred ? `<pre class="ed-out tc-out" hidden></pre>` : ""}
    </section>`;
  return {
    html,
    mount() {
      const card = document.getElementById(`${cfg.idp}-${t.id}`), msg = card.querySelector(".tc-msg"), hint = card.querySelector(".tc-hint");
      hint.textContent = t.hint;
      const saved = store.get(cfg.key, {})[t.id];
      const setStatus = ok => {
        card.classList.toggle("done", ok);
        card.querySelector(".tc-status").textContent = ok ? cfg.doneText : "";
        const run = card.querySelector(".tc-run"); if (run) run.hidden = !ok;
      };
      let ed = null, inp = null;
      if (isPred) {
        card.querySelector(".code-view").textContent = t.code;
        inp = card.querySelector(".pred-in");
        inp.addEventListener("input", () => { inp.rows = Math.max(1, inp.value.split("\n").length); msg.textContent = ""; msg.className = "tc-msg"; });
        inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); check(); } });
        if (saved && saved.a != null) inp.value = saved.a;
        card.querySelector(".tc-run").addEventListener("click", async () => {
          const out = card.querySelector(".tc-out"); out.hidden = false; out.textContent = "Орындалуда…";
          try { const r = await pyRun(t.code, []); out.textContent = r.shown + (r.err ? "\n" + pyErrText(r.err) : ""); } catch (e) { out.textContent = PY_FAIL; }
        });
      } else {
        const t0 = (t.tests || [{}])[0];
        ed = edMount(card.querySelector(".pyed"), { code: t.start, inputs: t0.inputs, onChange: () => { msg.textContent = ""; msg.className = "tc-msg"; } });
        if (!t0.inputs) { const il = card.querySelector(".ed-inlab"); if (il) il.remove(); }
        if (saved && saved.code != null) ed.code = saved.code;
        card.querySelector(".tc-reset").addEventListener("click", () => {
          ed.code = t.start; ed.inputs = t0.inputs || []; ed.clearOut(); msg.textContent = ""; hint.hidden = true;
          const all = store.get(cfg.key, {}); all[t.id] = { ok: false, ever: !!(all[t.id] && all[t.id].ever), code: t.start }; store.set(cfg.key, all);
          setStatus(false); if (cfg.onDone) cfg.onDone(t, false);
        });
      }
      if (saved) setStatus(!!saved.ok);
      const btn = card.querySelector(".tc-check");
      async function check() {
        let r, answer;
        if (isPred) {
          answer = inp.value;
          if (!answer.trim()) { msg.className = "tc-msg bad"; msg.textContent = "Жауапты жаз."; return; }
          const n = predNorm(answer);
          r = n === predNorm(t.ans) ? { ok: true } : { ok: false, msg: (t.traps && t.traps[n] ? t.traps[n] + " " : "Қате. ") + "Бағдарламаны жол-жолымен орында да, әр жолдан кейін тізім қандай болатынын жазып отыр." };
        } else {
          answer = ed.code;
          btn.disabled = true; msg.className = "tc-msg"; msg.textContent = "Бағдарлама тексерілуде…";
          r = await codeCheck(t, answer);
          btn.disabled = false;
        }
        if (window.__onAttempt) window.__onAttempt(cfg.stage, t.id + " · " + t.fn, answer, r.ok, r.ok ? "" : r.msg);
        const all = store.get(cfg.key, {}), tries = ((all[t.id] && all[t.id].tries) || 0) + 1;
        all[t.id] = { ok: r.ok, ever: r.ok || !!(all[t.id] && all[t.id].ever), tries, [isPred ? "a" : "code"]: answer };
        store.set(cfg.key, all);
        msg.className = "tc-msg " + (r.ok ? "ok" : "bad");
        msg.textContent = r.ok ? (isPred ? "Дұрыс! Бағдарламаны іске қосып, көз жеткізе аласың." : "Дұрыс! Бағдарлама басқа деректерде де жұмыс істейді.") : r.msg;
        if (!r.ok && tries >= 2) hint.hidden = false;
        setStatus(r.ok);
        if (cfg.onDone) cfg.onDone(t, r.ok, msg);
      }
      btn.addEventListener("click", check);
      card.querySelector(".tc-hintbtn").addEventListener("click", () => { hint.hidden = !hint.hidden; });
    }
  };
}
/* Пример ввода и вывода к заданию «Напиши программу» — вывод получаем, запустив эталон */
let samplesDone = false;
async function samplesFill() {
  if (samplesDone) return;
  const all = [...TASKS_PR, ...TASKS_PJ, ...TASKS_HW].filter(t => t.kind === "write" || t.sampleShow);
  try {
    for (const t of all) {
      const card = document.getElementById((TASKS_PJ.includes(t) ? "pj-" : TASKS_HW.includes(t) ? "hw-" : "pt-") + t.id); if (!card) continue;
      const test = (t.tests || [{}])[0], r = await pyRun(withData(t.ref, test.data), test.inputs);
      card.querySelector(".s-in").textContent = test.inputs ? "Енгізу:\n" + test.inputs.join("\n") : "Деректер:\n" + testDesc(test);
      card.querySelector(".s-out").textContent = "Шығару:\n" + outShow(r.out);
    }
    samplesDone = true;
  } catch (e) {
    document.querySelectorAll(".s-out").forEach(p => { if (!p.textContent) p.textContent = "Мысал Python жүктелгенде пайда болады."; });
  }
}

function prBuild() {
  const cards = TASKS_PR.map(t => taskCard(t, { key: PR_KEY, stage: "8. Практика", idp: "pt", doneText: "✓ шешілді", hidden: true,
    onDone: (t, ok, msg) => {
      prRender();
      if (ok && msg && TASKS_PR.filter(x => x.lv === t.lv).every(x => (prLoad()[x.id] || {}).ok)) {
        msg.textContent += t.lv === "C" ? " Сен барлық деңгейді шештің!" : ` ${t.lv} деңгейі өтілді — келесісіне өтуге болады.`;
      }
    } }));
  document.getElementById("prTasks").innerHTML = cards.map(c => c.html).join("");
  cards.forEach(c => c.mount());
  document.querySelectorAll(".lv").forEach(b => b.addEventListener("click", () => prShowLevel(b.dataset.lv)));
  document.getElementById("lvNext").addEventListener("click", e => { prShowLevel(e.currentTarget.dataset.lv); document.getElementById("practice").scrollIntoView({ behavior: "smooth" }); });
  const want = store.get("practice-lv", "0"), first = prAll().find(t => t.lv === want);
  const cur = prAll().find(t => prUnlocked(t.id) && !(prLoad()[t.id] || {}).ever) || prAll()[prAll().length - 1];
  prShowLevel(first && prUnlocked(first.id) ? want : cur.lv);
  prRender();
}

function shuffleSeeded(arr, seed) {
  let h = 2166136261;
  for (const ch of String(seed)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

  return {
    id: me.id, cls: me.cls, name: me.name, stage: STAGES[curStage] || curStage,
    expect: g("expect-l4") || "",
    match: mv.filter(x => x && x.ok).length + "/" + info.matchN,
    matchFirst: mv.filter(x => x && x.first).length,
    z: cnt(info.Z), a: cnt(info.A), b: cnt(info.B), c: cnt(info.C),
    expOk: rf ? EXP[rf.exp] || "" : "", r0: rf ? MARK[rf.res[0]] || "" : "", r1: rf ? MARK[rf.res[1]] || "" : "", r2: rf ? MARK[rf.res[2]] || "" : "",
    use: rf ? rf.use || "" : "", note: rf ? rf.note || "" : "",
    act: (() => { const a = Object.values(g("actual-l4") || {}); return a.filter(x => x && x.ok).length + "/" + info.actN; })(),
    actFirst: Object.values(g("actual-l4") || {}).filter(x => x && x.first).length,
    now: window.__prNow(),
    hw: (() => { const h = g("hw-l4") || {}; return Object.values(h).filter(x => x && x.ok).length + "/" + info.hwN; })(),
    pj: (() => { const h = g("project-l4") || {}; return Object.values(h).filter(x => x && x.ok).length + "/" + info.pjN; })(),
    rev: (() => { const a = Object.values(g("review-l4") || {}); return a.filter(x => x && x.ok).length + "/" + info.rvN + " (1-я: " + a.filter(x => x && x.first).length + ")"; })(),
    desc: (() => { const d = window.__descStatus(); return d.filter(x => x.ok).length + "/" + d.length + (d.some(x => x.ok) ? ": " + d.filter(x => x.ok).map(x => x.id).join(" ") : ""); })()
  };
}
function syncSoon() { if (!me) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1500); }
function syncNow() { if (!me) return; gsr("saveProgress", lessonSummary()).then(() => setNet(true)).catch(() => setNet(false)); }
function setNet(ok) { const n = document.getElementById("netState"); if (n) { n.textContent = ok ? "мұғаліммен байланыс бар" : "байланыс жоқ — жауаптар кейін жіберіледі"; n.className = "net " + (ok ? "on" : "off"); } }

/* Вход: ученик сам вписывает класс, фамилию и имя */
const LAT2CYR = { A: "А", B: "В", C: "С", E: "Е", H: "Н", K: "К", M: "М", O: "О", P: "Р", T: "Т", X: "Х", D: "Д", F: "Ф", G: "Г", L: "Л", I: "И", Z: "З", S: "С", Y: "У", R: "Р", N: "Н", V: "В", U: "У" };
function normClass(v) { return v.toUpperCase().replace(/\s+/g, "").replace(/[A-Z]/g, ch => LAT2CYR[ch] || ch); }
function normName(v) { return v.trim().replace(/\s+/g, " ").split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" "); }
/* Вход: онлайн — через сервер (проверка по списку класса), без сервера — только на этом компьютере */
function register(c, n) {
  return ONLINE ? gsr("registerStudent", c, n, "kz") : Promise.resolve({ id: c + " | " + n, cls: c, name: n });
}
function loginUI() {
  const ov = document.getElementById("login"), body = document.getElementById("loginBody");
  ov.hidden = false;
  body.innerHTML = `<p class="lg-q">Деректеріңді жаз</p>
    <label class="lg-l" for="lgCls">Сынып</label><input id="lgCls" class="lg-in" maxlength="20" placeholder="мысалы, 8А" autocomplete="off">
    <label class="lg-l" for="lgName">Тегі мен аты</label><input id="lgName" class="lg-in" maxlength="80" placeholder="мысалы, Сейткали Айдана" autocomplete="off">
    <p class="lg-err" id="lgErr" aria-live="polite"></p>
    <button type="button" class="btn main lg-big" id="lgGo">Сабақты бастау</button>`;
  const go = () => {
    const c = normClass(document.getElementById("lgCls").value), n = normName(document.getElementById("lgName").value);
    const err = document.getElementById("lgErr");
    if (!/^\d{1,2}[А-ЯЁӘҒҚҢӨҰҮҺІ]?$/.test(c)) { err.textContent = "Сынып былай жазылады: сан мен әріп, мысалы, 8А."; return; }
    if (n.split(" ").length < 2 || n.length < 5) { err.textContent = "Тегің мен атыңды бос орын арқылы жаз."; return; }
    err.textContent = "Сақтап жатырмын…";
    document.getElementById("lgGo").disabled = true;
    const old = document.getElementById("lgSug"); if (old) old.remove();
    register(c, n).then(r => { document.getElementById("lgGo").disabled = false; if (r && r.suggest) suggest(r); else enter(r); })
      .catch(e => { document.getElementById("lgGo").disabled = false; err.textContent = (e && e.message) ? e.message : "Болмады. Байланысты тексеріп, тағы бір рет көр."; });
  };
  function suggest(r) {
    const err = document.getElementById("lgErr"); err.textContent = "";
    const box = document.createElement("div"); box.className = "lg-sug"; box.id = "lgSug";
    box.innerHTML = `<p>Мұндай оқушы тізімде жоқ. Мүмкін, сен — <b></b>?</p><div class="lg-row"><button type="button" class="btn main" id="sugYes">Иә, бұл менмін</button><button type="button" class="btn" id="sugNo">Жоқ</button></div>`;
    box.querySelector("b").textContent = `${r.suggest}, ${r.cls}`;
    err.after(box);
    document.getElementById("sugYes").onclick = () => { box.remove(); err.textContent = "Кіріп жатырмын…"; register(r.cls, r.suggest).then(enter).catch(e => { err.textContent = e.message || "Болмады."; }); };
    document.getElementById("sugNo").onclick = () => { box.remove(); err.textContent = "Онда тегің мен атыңның қалай жазылғанын тексер немесе мұғалімге айт, сені тізімге қоссын."; };
  }
  document.getElementById("lgGo").onclick = go;
  ["lgCls", "lgName"].forEach(id => document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
  document.getElementById("lgCls").focus();
  function enter(st) {
    me = st;
    NS = "st:" + st.id + ":";
    ov.hidden = true;
    document.getElementById("whoName").textContent = `${st.name}, ${st.cls}`;
    document.getElementById("who").hidden = false;
    startLesson();
    if (!ONLINE) return;
    syncNow();
    setInterval(syncNow, 60000);
    pollQuestion(); setInterval(pollQuestion, 5000);
  }
}

/* Вопрос учителя всплывает у всех учеников */
let shownQ = null;
function pollQuestion() {
  gsr("getQuestion").then(q => {
    setNet(true);
    const answered = lsGet(NS + "answered", []);
    const modal = document.getElementById("qModal");
    if (q && q.open && q.type === "break") {
      if (!answered.includes(q.id) && shownQ !== q.id) {
        shownQ = q.id;
        window.__onBreakEnd = () => { const a = lsGet(NS + "answered", []); if (!a.includes(q.id)) { a.push(q.id); lsSet(NS + "answered", a); } shownQ = null; };
        window.__breakStart();
      }
      return;
    }
    if (q && q.open && !answered.includes(q.id)) {
      if (shownQ !== q.id) {
        shownQ = q.id;
        document.getElementById("qText").textContent = q.text;
        document.getElementById("qAns").value = "";
        document.getElementById("qErr").textContent = "";
        modal.hidden = false;
        document.getElementById("qAns").focus();
      }
    } else if (!modal.hidden) {
      modal.hidden = true; shownQ = null;
      if (q && !q.open) toast("Мұғалім сұрақты жапты.");
    }
  }).catch(() => setNet(false));
}
function sendAnswer() {
  const text = document.getElementById("qAns").value.trim(), err = document.getElementById("qErr");
  if (!text) { err.textContent = "Жауапты жаз."; return; }
  const btn = document.getElementById("qSend"); btn.disabled = true; err.textContent = "Жіберіп жатырмын…";
  gsr("submitAnswer", { qid: shownQ, lang: "kz", text, cls: me.cls, name: me.name, id: me.id }).then(() => {
    const a = lsGet(NS + "answered", []); a.push(shownQ); lsSet(NS + "answered", a);
    document.getElementById("qModal").hidden = true; shownQ = null; btn.disabled = false;
    toast("Жауап мұғалімге жіберілді.");
  }).catch(e => { btn.disabled = false; err.textContent = (e && e.message) || "Жіберу мүмкін болмады. Тағы бір рет көр."; });
}
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3500); }

function onlineBoot() {
  window.__onStore = syncSoon;
  window.__onStage = id => { curStage = id; syncSoon(); };
  window.__onAttempt = (stage, task, answer, ok, note) => { if (me) gsr("logAttempt", { id: me.id, cls: me.cls, name: me.name, stage, task, answer: String(answer), ok: !!ok, note: note || "" }).catch(() => setNet(false)); };
  document.getElementById("qSend").addEventListener("click", sendAnswer);
  document.getElementById("qAns").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendAnswer(); });
  document.getElementById("whoChange").addEventListener("click", () => { document.getElementById("whoHint").hidden = false; });
  loginUI();
}
if (ONLINE) onlineBoot();
else {
  loginUI();
  const n = document.getElementById("netState"); n.textContent = "жауаптар осы компьютерде сақталады"; n.className = "net";
  document.getElementById("whoChange").addEventListener("click", () => { document.getElementById("whoHint").hidden = false; });
}


}
</script>
