  <!-- Этап 5: новая тема — список -->
  <div class="panel" id="learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
    <div>
      <h1>Одномерный массив и список</h1>
      <p class="lead">Когда значений много — оценки за четверть, покупки, температура за неделю, — заводить отдельную переменную для каждого неудобно. Их хранят в одном списке под одним именем.</p>
    </div>

    <section class="block theory-intro">
      <h2>Основные понятия</h2>
      <div class="concepts">
        <div><b>Одномерный массив</b><p>ряд значений одного вида, у каждого есть свой номер. Например, оценки ученика за четверть.</p></div>
        <div><b>Список (list)</b><p>так в Python записывают одномерный массив: <code>[5, 4, 5, 3]</code> — значения в квадратных скобках через запятую.</p></div>
        <div><b>Элемент</b><p>одно значение в списке: число, слово или другое значение.</p></div>
        <div><b>Индекс</b><p>номер элемента. Счёт начинается с 0: первый элемент — <code>a[0]</code>.</p></div>
        <div><b>Длина</b><p>сколько элементов в списке: <code>len(a)</code>.</p></div>
        <div><b>Метод</b><p>команда, которую выполняет сам список: <code>a.append(7)</code>. О методах — на следующем этапе.</p></div>
      </div>
    </section>

    <div class="fpills" role="tablist" aria-label="Разделы">
      <button type="button" class="fpill" data-f="0" aria-selected="true">1 · Список</button>
      <button type="button" class="fpill" data-f="1" aria-selected="false">2 · Индексы</button>
      <button type="button" class="fpill" data-f="2" aria-selected="false">3 · Перебор и функции</button>
    </div>

    <!-- Список -->
    <section class="block fcard" data-card="0">
      <p class="fname"><code>list</code> — список</p>
      <p class="simple"><b>Простыми словами:</b> список — как ряд пронумерованных ящиков на одной полке. В каждом ящике лежит одно значение, а у всей полки одно имя.</p>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Оценки за четверть:</span> <code>marks = [5, 4, 5, 3]</code></li><li><span>Список покупок:</span> <code>shop = ["хлеб", "молоко"]</code></li><li><span>Температура за неделю:</span> <code>t = [12, 15, 9, 18, 21, 24, 20]</code></li></ul><p class="apply-no"><b>Не подходит:</b> если значение одно — хватит обычной переменной: <code>age = 14</code>.</p></div>
      <p class="how"><span>Как записать:</span> <code>a = [3, 8, 1]</code></p>
      <div class="theory">
      <h3>Определение</h3>
      <p>Одномерный массив — упорядоченный набор элементов, у каждого из которых есть номер (индекс). В Python одномерный массив записывают как список (list): элементы перечисляют в квадратных скобках через запятую.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>имя = [элемент1, элемент2, …]</code></p>
      <p>Пустой список: <code>a = []</code>. Элемент списка можно заменить: <code>a[0] = 10</code>.</p>
      <h3>Примеры</h3>
      <p class="small-note">Кнопка «Открыть в редакторе» переносит пример в редактор ниже — там его можно изменить и запустить.</p>
      <div class="exlist" data-ex="list"></div>
      <h3>Важно знать</h3>
      <ul><li>Скобки у списка <b>квадратные</b>, элементы разделяют <b>запятой</b>.</li><li>Текст в списке пишут в кавычках: <code>["хлеб", "молоко"]</code>. Без кавычек Python примет слово за имя переменной и выдаст <code>NameError</code>.</li><li>Список можно менять: заменять, добавлять и удалять элементы.</li></ul>
      <h3>Связь с математикой</h3>
      <p>В математике последовательность записывают как a₁, a₂, …, aₙ. В Python нумерация начинается с нуля: a[0], a[1], …, a[n − 1].</p>
      </div>
      <div class="tryed"><span class="trylab">Попробуй сам</span><div class="pyed" data-ed="list"></div></div>
      <p class="remember"><b>Запомни:</b> список — одно имя для многих значений. Номера элементов начинаются с 0.</p>
    </section>

    <!-- Индексы -->
    <section class="block fcard" data-card="1" hidden>
      <p class="fname"><code>a[i]</code> — элемент по индексу</p>
      <p class="simple"><b>Простыми словами:</b> индекс — номер места в списке, как номер места в очереди. Только счёт начинается с нуля. С конца считают отрицательными номерами: −1 — последний.</p>
      <div class="tablewrap"><table class="idx"><tr><th>элемент</th><td class="v">К</td><td class="v">О</td><td class="v">Т</td><td class="v">И</td><td class="v">К</td></tr><tr><th>индекс</th><td class="i">0</td><td class="i">1</td><td class="i">2</td><td class="i">3</td><td class="i">4</td></tr><tr><th>с конца</th><td class="n">−5</td><td class="n">−4</td><td class="n">−3</td><td class="n">−2</td><td class="n">−1</td></tr></table></div>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Первая оценка в четверти:</span> <code>marks[0]</code></li><li><span>Температура в воскресенье, последний день:</span> <code>t[-1]</code></li><li><span>Исправить цену третьего товара:</span> <code>price[2] = 900</code></li></ul><p class="apply-no"><b>Не подходит:</b> номер, которого нет в списке, — будет ошибка <code>IndexError</code>.</p></div>
      <p class="how"><span>Как записать:</span> <code>a[0]</code>, <code>a[-1]</code>, <code>a[2] = 7</code></p>
      <div class="theory">
      <h3>Определение</h3>
      <p>Индекс — целое число, номер элемента в списке. Выражение <code>a[i]</code> даёт элемент с индексом i. В списке из n элементов индексы идут от 0 до n − 1, а с конца — от −1 до −n.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>список[индекс]</code></p>
      <h3>Примеры</h3>
      <div class="exlist" data-ex="idx"></div>
      <h3>Важно знать</h3>
      <ul><li>Первый элемент — <code>a[0]</code>, а не <code>a[1]</code>.</li><li>Последний — <code>a[-1]</code> или <code>a[len(a) - 1]</code>. Индекс <code>a[len(a)]</code> уже не существует.</li><li>Индекс — только целое число: <code>a[1.5]</code> — ошибка <code>TypeError</code>.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Попробуй сам</span><div class="pyed" data-ed="idx"></div></div>
      <p class="remember"><b>Запомни:</b> первый — <code>a[0]</code>, последний — <code>a[-1]</code>.</p>
    </section>

    <!-- Перебор и функции -->
    <section class="block fcard" data-card="2" hidden>
      <p class="fname"><code>for x in a</code> — перебор списка, <code>len()</code>, <code>sum()</code>, <code>max()</code>, <code>min()</code></p>
      <p class="simple"><b>Простыми словами:</b> цикл <code>for</code> проходит по списку, как учитель по журналу: берёт по очереди каждый элемент. Функции <code>len</code>, <code>sum</code>, <code>max</code>, <code>min</code> смотрят на весь список сразу. Это не методы списка: их пишут перед скобками — <code>len(a)</code>, а не <code>a.len()</code>.</p>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Средний балл:</span> <code>sum(marks) / len(marks)</code></li><li><span>Самая высокая температура недели:</span> <code>max(t)</code></li><li><span>Вывести все покупки по одной:</span> <code>for x in shop: print(x)</code></li></ul><p class="apply-no"><b>Не подходит:</b> чтобы изменить список — добавить или удалить элемент, — нужны методы списка.</p></div>
      <p class="how"><span>Как записать:</span> <code>for x in a:</code>, <code>for i in range(len(a)):</code></p>
      <div class="theory">
      <h3>Определение</h3>
      <p>Перебор — обработка всех элементов списка по очереди в цикле. Встроенные функции работают со всем списком: <code>len(a)</code> — количество элементов, <code>sum(a)</code> — сумма, <code>max(a)</code> и <code>min(a)</code> — наибольший и наименьший элемент.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>for x in a:</code></p>
      <p><code>for x in a</code> даёт сами значения, <code>for i in range(len(a))</code> — номера, а значение берут как <code>a[i]</code>.</p>
      <h3>Примеры</h3>
      <div class="exlist" data-ex="loop"></div>
      <h3>Важно знать</h3>
      <ul><li><code>sum</code>, <code>max</code> и <code>min</code> работают с числами. Для пустого списка <code>max([])</code> выдаёт ошибку <code>ValueError</code>.</li><li>Деление <code>/</code> даёт дробное число: <code>sum([4, 5]) / 2</code> = 4.5.</li><li>Строки внутри цикла сдвигают на 4 пробела.</li></ul>
      <h3>Связь с математикой</h3>
      <p>Среднее арифметическое = сумма элементов : их количество, в Python — <code>sum(a) / len(a)</code>.</p>
      </div>
      <div class="tryed"><span class="trylab">Попробуй сам</span><div class="pyed" data-ed="loop"></div></div>
      <p class="remember"><b>Запомни:</b> <code>len</code>, <code>sum</code>, <code>max</code>, <code>min</code> — функции: <code>len(a)</code>. Методы пишут через точку: <code>a.append(5)</code>.</p>
    </section>

    </div>

  <!-- Этап 6: методы списка -->
  <div class="panel" id="methods" role="tabpanel" aria-labelledby="tab-methods" hidden>
    <div>
      <h1>Методы списка</h1>
      <p class="lead">Метод — команда, которую выполняет сам список. Методы добавляют, удаляют, упорядочивают и ищут элементы. Большинство методов меняют список «на месте» и ничего не возвращают.</p>
    </div>

    <section class="block">
      <h2>Как записать метод</h2>
      <div class="anatomy">
        <div class="part"><span class="tok arg">marks</span><span class="lab">какой список</span></div>
        <div class="part"><span class="tok dot">.</span><span class="lab">точка</span></div>
        <div class="part"><span class="tok fnc">append</span><span class="lab">что сделать</span></div>
        <div class="part"><span class="tok">(</span><span class="lab">открыли</span></div>
        <div class="part"><span class="tok arg">5</span><span class="lab">с чем</span></div>
        <div class="part"><span class="tok">)</span><span class="lab">закрыли</span></div>
      </div>
      <p class="tip">Скобки нужны всегда, даже если внутри пусто: <code>a.sort()</code>. Без скобок команда не выполнится.</p>
    </section>

    <div class="fpills" role="tablist" aria-label="Методы">
      <button type="button" class="fpill" data-f="3" aria-selected="true">1 · append, insert</button>
      <button type="button" class="fpill" data-f="4" aria-selected="false">2 · pop, remove</button>
      <button type="button" class="fpill" data-f="5" aria-selected="false">3 · sort, reverse</button>
      <button type="button" class="fpill" data-f="6" aria-selected="false">4 · index, count</button>
      <button type="button" class="fpill" data-f="7" aria-selected="false">Шпаргалка и ошибки</button>
    </div>

    <!-- append, insert -->
    <section class="block fcard" data-card="3">
      <p class="fname"><code>append()</code> и <code>insert()</code> — добавить</p>
      <p class="simple"><b>Простыми словами:</b> <code>append</code> — встать в конец очереди. <code>insert</code> — пропустить кого-то вперёд на нужное место: остальные сдвигаются.</p>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Добавить покупку в конец списка:</span> <code>shop.append("сыр")</code></li><li><span>Записать в список оценки, введённые с клавиатуры:</span> <code>marks.append(int(input()))</code></li><li><span>Поставить срочное дело первым:</span> <code>todo.insert(0, "уроки")</code></li></ul><p class="apply-no"><b>Не подходит:</b> чтобы заменить элемент, метод не нужен — <code>a[i] = x</code>.</p></div>
      <p class="how"><span>Как записать:</span> <code>a.append(x)</code>, <code>a.insert(i, x)</code></p>
      <div class="theory">
      <h3>Определение</h3>
      <p><code>append(x)</code> добавляет элемент x в конец списка. <code>insert(i, x)</code> вставляет элемент x на место с индексом i, а элементы правее сдвигаются на одну позицию.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>список.append(x)</code> · <code>список.insert(индекс, x)</code></p>
      <h3>Примеры</h3>
      <div class="exlist" data-ex="add"></div>
      <h3>Важно знать</h3>
      <ul><li><code>append</code> добавляет ровно один элемент за раз.</li><li>Методы ничего не возвращают: <code>a = a.append(5)</code> — ошибка, в <code>a</code> окажется <code>None</code>. Пиши просто <code>a.append(5)</code>.</li><li><code>insert</code>: сначала номер, потом значение — <code>insert(0, "а")</code>.</li><li>Ввод списка с клавиатуры: пустой список и цикл с <code>append</code>.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Попробуй сам</span><div class="pyed" data-ed="add"></div></div>
      <p class="remember"><b>Запомни:</b> <code>append</code> — в конец, <code>insert(i, x)</code> — на место i.</p>
    </section>

    <!-- pop, remove -->
    <section class="block fcard" data-card="4" hidden>
      <p class="fname"><code>pop()</code> и <code>remove()</code> — удалить</p>
      <p class="simple"><b>Простыми словами:</b> <code>pop</code> достаёт ящик по номеру — по умолчанию последний — и отдаёт его тебе. <code>remove</code> ищет вещь по названию и выбрасывает первую такую.</p>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Отменить последнее действие:</span> <code>history.pop()</code></li><li><span>Вычеркнуть купленный товар:</span> <code>shop.remove("хлеб")</code></li><li><span>Обслужить первого в очереди:</span> <code>queue.pop(0)</code></li></ul><p class="apply-no"><b>Не подходит:</b> удалить все одинаковые элементы сразу — <code>remove</code> убирает только первый.</p></div>
      <p class="how"><span>Как записать:</span> <code>a.pop()</code>, <code>a.pop(i)</code>, <code>a.remove(x)</code></p>
      <div class="theory">
      <h3>Определение</h3>
      <p><code>pop(i)</code> удаляет элемент с индексом i и возвращает его; без аргумента удаляет последний. <code>remove(x)</code> удаляет первый элемент, равный x.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>список.pop(индекс)</code> · <code>список.remove(x)</code></p>
      <h3>Примеры</h3>
      <div class="exlist" data-ex="del"></div>
      <h3>Важно знать</h3>
      <ul><li><code>pop</code> удаляет по номеру, <code>remove</code> — по значению.</li><li>Если элемента нет, <code>remove</code> выдаёт ошибку <code>ValueError</code>. Сначала проверь: <code>if x in a:</code>.</li><li><code>pop</code> из пустого списка выдаёт ошибку <code>IndexError</code>.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Попробуй сам</span><div class="pyed" data-ed="del"></div></div>
      <p class="remember"><b>Запомни:</b> <code>pop(i)</code> — «убери номер i», <code>remove(x)</code> — «убери значение x».</p>
    </section>

    <!-- sort, reverse -->
    <section class="block fcard" data-card="5" hidden>
      <p class="fname"><code>sort()</code> и <code>reverse()</code> — порядок</p>
      <p class="simple"><b>Простыми словами:</b> <code>sort</code> — построить класс по росту, от низкого к высокому. <code>reverse</code> — развернуть строй задом наперёд, не сравнивая рост.</p>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Оценки по возрастанию:</span> <code>marks.sort()</code></li><li><span>Рейтинг от лучшего к худшему:</span> <code>scores.sort(reverse=True)</code></li><li><span>Новые сообщения сверху:</span> <code>msgs.reverse()</code></li></ul><p class="apply-no"><b>Не подходит:</b> чтобы узнать только самое большое число, сортировать не нужно — есть <code>max(a)</code>.</p></div>
      <p class="how"><span>Как записать:</span> <code>a.sort()</code>, <code>a.sort(reverse=True)</code>, <code>a.reverse()</code></p>
      <div class="theory">
      <h3>Определение</h3>
      <p><code>sort()</code> упорядочивает элементы списка по возрастанию: числа — от меньшего к большему, слова — по алфавиту. С аргументом <code>reverse=True</code> — по убыванию. <code>reverse()</code> переставляет элементы в обратном порядке.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>список.sort()</code> · <code>список.reverse()</code></p>
      <h3>Примеры</h3>
      <div class="exlist" data-ex="order"></div>
      <h3>Важно знать</h3>
      <ul><li><code>sort</code> меняет сам список и возвращает <code>None</code>: <code>b = a.sort()</code> — в <code>b</code> окажется <code>None</code>.</li><li><code>reverse</code> не сортирует, а только переворачивает.</li><li>Слова Python сравнивает по кодам букв: заглавные идут раньше строчных, а казахские буквы Ә, Ғ, Қ, Ң, Ө, Ұ, Ү, Һ, І и буква Ё — после Я.</li><li>Числа и слова в одном списке отсортировать нельзя — ошибка <code>TypeError</code>.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Попробуй сам</span><div class="pyed" data-ed="order"></div></div>
      <p class="remember"><b>Запомни:</b> <code>sort()</code> — по порядку, <code>reverse()</code> — задом наперёд. Оба меняют список и ничего не возвращают.</p>
    </section>

    <!-- index, count -->
    <section class="block fcard" data-card="6" hidden>
      <p class="fname"><code>index()</code> и <code>count()</code> — найти</p>
      <p class="simple"><b>Простыми словами:</b> <code>index</code> отвечает на вопрос «на каком месте стоит?», <code>count</code> — «сколько раз встречается?». Сам список они не меняют.</p>
      <div class="apply"><p class="apply-h">Где применяется</p><ul><li><span>Место ученика в рейтинге:</span> <code>top.index("Тимур") + 1</code></li><li><span>Сколько пятёрок в журнале:</span> <code>marks.count(5)</code></li><li><span>Есть ли товар в списке:</span> <code>"сыр" in shop</code></li></ul><p class="apply-no"><b>Не подходит:</b> <code>index</code> для элемента, которого нет, — будет <code>ValueError</code>. Сначала проверь через <code>in</code>.</p></div>
      <p class="how"><span>Как записать:</span> <code>a.index(x)</code>, <code>a.count(x)</code>, <code>x in a</code></p>
      <div class="theory">
      <h3>Определение</h3>
      <p><code>index(x)</code> возвращает индекс первого элемента, равного x. <code>count(x)</code> возвращает, сколько раз x встречается в списке. Оператор <code>x in a</code> даёт <code>True</code>, если x есть в списке, и <code>False</code>, если нет.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>список.index(x)</code> · <code>список.count(x)</code></p>
      <h3>Примеры</h3>
      <div class="exlist" data-ex="find"></div>
      <h3>Важно знать</h3>
      <ul><li><code>index</code> находит только первый подходящий элемент.</li><li><code>count</code> элемента, которого нет, даёт 0, а не ошибку.</li><li><code>in</code> — не метод, а оператор: его пишут без точки и скобок.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Попробуй сам</span><div class="pyed" data-ed="find"></div></div>
      <p class="remember"><b>Запомни:</b> <code>index</code> — «где?», <code>count</code> — «сколько раз?».</p>
    </section>

    <!-- Шпаргалка -->
    <section class="block fcard" data-card="7" hidden>
      <p class="fname">Шпаргалка и ошибки</p>
      <div class="tablewrap">
        <table class="cheat">
          <tr><th>Команда</th><th>Что делает</th><th>Было <code>a = [3, 1, 2]</code>, стало</th></tr>
          <tr><td><code>a.append(5)</code></td><td>добавляет 5 в конец</td><td><code>[3, 1, 2, 5]</code></td></tr>
          <tr><td><code>a.insert(0, 5)</code></td><td>вставляет 5 на место 0</td><td><code>[5, 3, 1, 2]</code></td></tr>
          <tr><td><code>a.pop()</code></td><td>удаляет последний и возвращает его</td><td><code>[3, 1]</code></td></tr>
          <tr><td><code>a.pop(0)</code></td><td>удаляет элемент с индексом 0</td><td><code>[1, 2]</code></td></tr>
          <tr><td><code>a.remove(1)</code></td><td>удаляет первое значение 1</td><td><code>[3, 2]</code></td></tr>
          <tr><td><code>a.sort()</code></td><td>по возрастанию</td><td><code>[1, 2, 3]</code></td></tr>
          <tr><td><code>a.reverse()</code></td><td>задом наперёд</td><td><code>[2, 1, 3]</code></td></tr>
          <tr><td><code>a.index(2)</code></td><td>индекс значения 2</td><td>2, список не меняется</td></tr>
          <tr><td><code>a.count(3)</code></td><td>сколько раз встречается 3</td><td>1, список не меняется</td></tr>
          <tr><td><code>len(a)</code>, <code>sum(a)</code>, <code>max(a)</code>, <code>min(a)</code></td><td>функции, а не методы: длина, сумма, наибольший, наименьший</td><td>3, 6, 3, 1</td></tr>
        </table>
      </div>
      <p class="remember"><b>Три частые ошибки:</b> счёт индексов с единицы вместо нуля; <code>a = a.append(x)</code> (нужно просто <code>a.append(x)</code>); <code>remove</code> элемента, которого нет в списке.</p>
      <h3 class="th-h">Ошибки и почему они возникают</h3>
      <p class="small-note">Кнопка «Показать» открывает программу с ошибкой в редакторе ниже. Запусти её, прочитай сообщение и исправь.</p>
      <div class="tablewrap"><table class="th-ex err-table"><tr><th>Ошибка</th><th>Что значит</th><th>Почему возникает</th><th>Пример</th><th>Как исправить</th></tr>
<tr><td class="ecode">IndexError</td><td>нет элемента с таким номером</td><td>Индекс больше последнего: в списке из 3 элементов нет <code>a[3]</code>. Или <code>pop()</code> из пустого списка.</td><td><button type="button" class="showex" data-err="0">Показать</button></td><td>Помнить: индексы от 0 до len(a) − 1.</td></tr>
<tr><td class="ecode">ValueError</td><td>такого значения нет</td><td><code>remove(x)</code> или <code>index(x)</code> для элемента, которого нет в списке.</td><td><button type="button" class="showex" data-err="1">Показать</button></td><td>Сначала проверить: <code>if x in a:</code>.</td></tr>
<tr><td class="ecode">AttributeError</td><td>у значения нет такого метода</td><td>Чаще всего после <code>a = a.append(x)</code>: в <code>a</code> лежит <code>None</code>, а у <code>None</code> методов нет. Или опечатка: <code>a.add(5)</code>.</td><td><button type="button" class="showex" data-err="2">Показать</button></td><td>Методы не присваивают: просто <code>a.append(x)</code>. Проверить имя метода.</td></tr>
<tr><td class="ecode">NameError</td><td>имя не найдено</td><td>Слово без кавычек в списке, опечатка в имени переменной или списка.</td><td><button type="button" class="showex" data-err="3">Показать</button></td><td>Текст взять в кавычки, проверить написание.</td></tr>
<tr><td class="ecode">SyntaxError</td><td>ошибка записи</td><td>Пропущена запятая или скобка, круглые скобки вместо квадратных, нет двоеточия после <code>for</code>.</td><td><button type="button" class="showex" data-err="4">Показать</button></td><td>Проверить скобки, запятые и двоеточие.</td></tr>
<tr><td class="ecode">Логическая ошибка</td><td>программа работает, но ответ неверный</td><td>Взяли <code>a[1]</code> вместо первого элемента; перепутали <code>pop</code> и <code>remove</code>; ждали, что <code>reverse</code> отсортирует.</td><td><button type="button" class="showex" data-err="5">Показать</button></td><td>Запустить программу на простом примере и сравнить с ожиданием.</td></tr>
</table></div>
      <div class="tryed"><span class="trylab">Песочница</span><div class="pyed" data-ed="all"></div></div>
    </section>

        <div><b>Тізім (list)</b><p>Python-да бір өлшемді массив былай жазылады: <code>[5, 4, 5, 3]</code> — мәндер шаршы жақшада үтір арқылы жазылады.</p></div>

    <!-- Список -->
    <section class="block fcard" data-card="0">
      <p class="fname"><code>list</code> — тізім</p>
      <p class="simple"><b>Қарапайым тілмен:</b> тізім — бір сөредегі нөмірленген жәшіктер қатары сияқты. Әр жәшікте бір мән жатады, ал бүкіл сөренің бір атауы бар.</p>
      <div class="apply"><p class="apply-h">Қайда қолданылады</p><ul><li><span>Тоқсандағы бағалар:</span> <code>marks = [5, 4, 5, 3]</code></li><li><span>Сатып алу тізімі:</span> <code>shop = ["нан", "сүт"]</code></li><li><span>Апталық температура:</span> <code>t = [12, 15, 9, 18, 21, 24, 20]</code></li></ul><p class="apply-no"><b>Сәйкес келмейді:</b> мән біреу ғана болса — кәдімгі айнымалы жеткілікті: <code>age = 14</code>.</p></div>
      <p class="how"><span>Қалай жазылады:</span> <code>a = [3, 8, 1]</code></p>
      <div class="theory">
      <h3>Анықтама</h3>
      <p>Бір өлшемді массив — элементтердің реттелген жиыны, әр элементтің өз нөмірі (индексі) бар. Python-да бір өлшемді массив тізім (list) ретінде жазылады: элементтер шаршы жақшада үтір арқылы тізбектеледі.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>атау = [элемент1, элемент2, …]</code></p>
      <p>Бос тізім: <code>a = []</code>. Тізім элементін ауыстыруға болады: <code>a[0] = 10</code>.</p>
      <h3>Мысалдар</h3>
      <p class="small-note">«Редакторда ашу» батырмасы мысалды төмендегі редакторға көшіреді — онда оны өзгертіп, іске қосуға болады.</p>
      <div class="exlist" data-ex="list"></div>
      <h3>Білу маңызды</h3>
      <ul><li>Тізімнің жақшасы — <b>шаршы</b>, элементтер <b>үтірмен бөлінеді</b>.</li><li>Тізімдегі мәтін тырнақшаға алынады: <code>["нан", "сүт"]</code>. Тырнақшасыз Python сөзді айнымалының атауы деп қабылдап, мына қатені береді: <code>NameError</code>.</li><li>Тізімді өзгертуге болады: элементтерді ауыстыруға, қосуға және жоюға болады.</li></ul>
      <h3>Математикамен байланысы</h3>
      <p>Математикада тізбек a₁, a₂, …, aₙ түрінде жазылады. Python-да нөмірлеу нөлден басталады: a[0], a[1], …, a[n − 1].</p>
      </div>
      <div class="tryed"><span class="trylab">Өзің байқап көр</span><div class="pyed" data-ed="list"></div></div>
      <p class="remember"><b>Есте сақта:</b> тізім — көп мәнге арналған бір атау. Элементтердің нөмірлері 0-ден басталады.</p>
    </section>

    <!-- Индексы -->
    <section class="block fcard" data-card="1" hidden>
      <p class="fname"><code>a[i]</code> — индекс бойынша элемент</p>
      <p class="simple"><b>Қарапайым тілмен:</b> индекс — тізімдегі орынның нөмірі, кезектегі орын нөмірі сияқты. Тек санау нөлден басталады. Соңынан теріс нөмірлермен санайды: −1 — соңғысы.</p>
      <div class="tablewrap"><table class="idx"><tr><th>элемент</th><td class="v">К</td><td class="v">О</td><td class="v">Т</td><td class="v">И</td><td class="v">К</td></tr><tr><th>индекс</th><td class="i">0</td><td class="i">1</td><td class="i">2</td><td class="i">3</td><td class="i">4</td></tr><tr><th>соңынан</th><td class="n">−5</td><td class="n">−4</td><td class="n">−3</td><td class="n">−2</td><td class="n">−1</td></tr></table></div>
      <div class="apply"><p class="apply-h">Қайда қолданылады</p><ul><li><span>Тоқсандағы бірінші баға:</span> <code>marks[0]</code></li><li><span>Жексенбідегі, яғни соңғы күнгі температура:</span> <code>t[-1]</code></li><li><span>Үшінші тауардың бағасын түзету:</span> <code>price[2] = 900</code></li></ul><p class="apply-no"><b>Сәйкес келмейді:</b> тізімде жоқ нөмір — мына қате шығады: <code>IndexError</code>.</p></div>
      <p class="how"><span>Қалай жазылады:</span> <code>a[0]</code>, <code>a[-1]</code>, <code>a[2] = 7</code></p>
      <div class="theory">
      <h3>Анықтама</h3>
      <p>Индекс — бүтін сан, тізімдегі элементтің нөмірі. <code>a[i]</code> өрнегі i индексті элементті береді. n элементтен тұратын тізімде индекстер 0-ден n − 1-ге дейін, ал соңынан — −1-ден −n-ге дейін.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>тізім[индекс]</code></p>
      <h3>Мысалдар</h3>
      <div class="exlist" data-ex="idx"></div>
      <h3>Білу маңызды</h3>
      <ul><li>Бірінші элемент — <code>a[0]</code>, мынау емес: <code>a[1]</code>.</li><li>Соңғысы — <code>a[-1]</code> немесе <code>a[len(a) - 1]</code>. Мына индекс <code>a[len(a)]</code> енді жоқ.</li><li>Индекс — тек бүтін сан: <code>a[1.5]</code> — қате <code>TypeError</code>.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Өзің байқап көр</span><div class="pyed" data-ed="idx"></div></div>
      <p class="remember"><b>Есте сақта:</b> бірінші — <code>a[0]</code>, соңғысы — <code>a[-1]</code>.</p>
    </section>

    <!-- Перебор и функции -->
    <section class="block fcard" data-card="2" hidden>
      <p class="fname"><code>for x in a</code> — тізімді аралау, <code>len()</code>, <code>sum()</code>, <code>max()</code>, <code>min()</code></p>
      <p class="simple"><b>Қарапайым тілмен:</b> цикл <code>for</code> тізімді журналды қарап шыққан мұғалім сияқты аралайды: әр элементті кезекпен алады. Функциялар <code>len</code>, <code>sum</code>, <code>max</code>, <code>min</code> бүкіл тізімге бірден қарайды. Бұлар тізім әдістері емес: оларды жақшаның алдына жазады — <code>len(a)</code>, мынау емес: <code>a.len()</code>.</p>
      <div class="apply"><p class="apply-h">Қайда қолданылады</p><ul><li><span>Орташа балл:</span> <code>sum(marks) / len(marks)</code></li><li><span>Аптаның ең жоғары температурасы:</span> <code>max(t)</code></li><li><span>Барлық сатып алуды бір-бірлеп шығару:</span> <code>for x in shop: print(x)</code></li></ul><p class="apply-no"><b>Сәйкес келмейді:</b> тізімді өзгерту үшін — элемент қосу немесе жою үшін — тізім әдістері керек.</p></div>
      <p class="how"><span>Қалай жазылады:</span> <code>for x in a:</code>, <code>for i in range(len(a)):</code></p>
      <div class="theory">
      <h3>Анықтама</h3>
      <p>Аралау — тізімнің барлық элементтерін циклде кезекпен өңдеу. Кірістірілген функциялар бүкіл тізіммен жұмыс істейді: <code>len(a)</code> — элементтер саны, <code>sum(a)</code> — қосынды, <code>max(a)</code> және <code>min(a)</code> — ең үлкен және ең кіші элемент.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>for x in a:</code></p>
      <p><code>for x in a</code> мәндердің өзін береді, <code>for i in range(len(a))</code> — нөмірлерді береді, ал мәнді былай алады: <code>a[i]</code>.</p>
      <h3>Мысалдар</h3>
      <div class="exlist" data-ex="loop"></div>
      <h3>Білу маңызды</h3>
      <ul><li><code>sum</code>, <code>max</code> және <code>min</code> сандармен жұмыс істейді. Бос тізім үшін <code>max([])</code> мына қатені береді: <code>ValueError</code>.</li><li>Бөлу <code>/</code> бөлшек сан береді: <code>sum([4, 5]) / 2</code> = 4.5.</li><li>Цикл ішіндегі жолдар 4 бос орынға ығыстырылады.</li></ul>
      <h3>Математикамен байланысы</h3>
      <p>Арифметикалық орта = элементтер қосындысы : олардың саны, Python-да — <code>sum(a) / len(a)</code>.</p>
      </div>
      <div class="tryed"><span class="trylab">Өзің байқап көр</span><div class="pyed" data-ed="loop"></div></div>
      <p class="remember"><b>Есте сақта:</b> <code>len</code>, <code>sum</code>, <code>max</code>, <code>min</code> — функциялар: <code>len(a)</code>. Әдістер нүкте арқылы жазылады: <code>a.append(5)</code>.</p>
    </section>

    <!-- append, insert -->
    <section class="block fcard" data-card="3">
      <p class="fname"><code>append()</code> және <code>insert()</code> — қосу</p>
      <p class="simple"><b>Қарапайым тілмен:</b> <code>append</code> — кезектің соңына тұру. <code>insert</code> — біреуді алдыға, керекті орынға өткізу: қалғандары жылжиды.</p>
      <div class="apply"><p class="apply-h">Қайда қолданылады</p><ul><li><span>Сатып алуды тізімнің соңына қосу:</span> <code>shop.append("ірімшік")</code></li><li><span>Пернетақтадан енгізілген бағаларды тізімге жазу:</span> <code>marks.append(int(input()))</code></li><li><span>Шұғыл істі бірінші қою:</span> <code>todo.insert(0, "сабақ")</code></li></ul><p class="apply-no"><b>Сәйкес келмейді:</b> элементті ауыстыру үшін әдіс керек емес — <code>a[i] = x</code>.</p></div>
      <p class="how"><span>Қалай жазылады:</span> <code>a.append(x)</code>, <code>a.insert(i, x)</code></p>
      <div class="theory">
      <h3>Анықтама</h3>
      <p><code>append(x)</code> x элементін тізімнің соңына қосады. <code>insert(i, x)</code> x элементін i индексті орынға қояды, ал оң жақтағы элементтер бір орынға жылжиды.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>тізім.append(x)</code> · <code>тізім.insert(индекс, x)</code></p>
      <h3>Мысалдар</h3>
      <div class="exlist" data-ex="add"></div>
      <h3>Білу маңызды</h3>
      <ul><li><code>append</code> бір жолы тек бір элемент қосады.</li><li>Әдістер ештеңе қайтармайды: <code>a = a.append(5)</code> — қате, <code>a</code> ішіне мынау түседі: <code>None</code>. Жай ғана былай жаз: <code>a.append(5)</code>.</li><li><code>insert</code>: алдымен нөмір, содан кейін мән — <code>insert(0, "а")</code>.</li><li>Тізімді пернетақтадан енгізу: бос тізім және циклдегі <code>append</code>.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Өзің байқап көр</span><div class="pyed" data-ed="add"></div></div>
      <p class="remember"><b>Есте сақта:</b> <code>append</code> — соңына, <code>insert(i, x)</code> — i орнына.</p>
    </section>

    <!-- pop, remove -->
    <section class="block fcard" data-card="4" hidden>
      <p class="fname"><code>pop()</code> және <code>remove()</code> — жою</p>
      <p class="simple"><b>Қарапайым тілмен:</b> <code>pop</code> жәшікті нөмірі бойынша — әдепкіде соңғысын — алып, саған береді. <code>remove</code> затты атауы бойынша іздеп, бірінші табылғанын лақтырады.</p>
      <div class="apply"><p class="apply-h">Қайда қолданылады</p><ul><li><span>Соңғы әрекетті болдырмау:</span> <code>history.pop()</code></li><li><span>Сатып алынған тауарды сызып тастау:</span> <code>shop.remove("нан")</code></li><li><span>Кезектегі біріншіге қызмет көрсету:</span> <code>queue.pop(0)</code></li></ul><p class="apply-no"><b>Сәйкес келмейді:</b> бірдей элементтердің бәрін бірден жою — <code>remove</code> тек біріншісін жояды.</p></div>
      <p class="how"><span>Қалай жазылады:</span> <code>a.pop()</code>, <code>a.pop(i)</code>, <code>a.remove(x)</code></p>
      <div class="theory">
      <h3>Анықтама</h3>
      <p><code>pop(i)</code> i индексті элементті жойып, оны қайтарады; аргументсіз соңғысын жояды. <code>remove(x)</code> x-ке тең бірінші элементті жояды.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>тізім.pop(индекс)</code> · <code>тізім.remove(x)</code></p>
      <h3>Мысалдар</h3>
      <div class="exlist" data-ex="del"></div>
      <h3>Білу маңызды</h3>
      <ul><li><code>pop</code> нөмір бойынша жояды, <code>remove</code> — мән бойынша.</li><li>Элемент жоқ болса, <code>remove</code> мына қатені береді: <code>ValueError</code>. Алдымен тексер: <code>if x in a:</code>.</li><li><code>pop</code> бос тізімнен мына қатені береді: <code>IndexError</code>.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Өзің байқап көр</span><div class="pyed" data-ed="del"></div></div>
      <p class="remember"><b>Есте сақта:</b> <code>pop(i)</code> — «i нөмірін алып таста», <code>remove(x)</code> — «x мәнін алып таста».</p>
    </section>

    <!-- sort, reverse -->
    <section class="block fcard" data-card="5" hidden>
      <p class="fname"><code>sort()</code> және <code>reverse()</code> — рет</p>
      <p class="simple"><b>Қарапайым тілмен:</b> <code>sort</code> — сыныпты бойы бойынша аласадан биікке қарай тұрғызу. <code>reverse</code> — сапты бойын салыстырмай, кері бұру.</p>
      <div class="apply"><p class="apply-h">Қайда қолданылады</p><ul><li><span>Бағалар өсу ретімен:</span> <code>marks.sort()</code></li><li><span>Рейтинг ең жақсыдан ең нашарға:</span> <code>scores.sort(reverse=True)</code></li><li><span>Жаңа хабарламалар жоғарыда:</span> <code>msgs.reverse()</code></li></ul><p class="apply-no"><b>Сәйкес келмейді:</b> тек ең үлкен санды білу үшін сұрыптау керек емес — мына функция бар: <code>max(a)</code>.</p></div>
      <p class="how"><span>Қалай жазылады:</span> <code>a.sort()</code>, <code>a.sort(reverse=True)</code>, <code>a.reverse()</code></p>
      <div class="theory">
      <h3>Анықтама</h3>
      <p><code>sort()</code> тізім элементтерін өсу ретімен реттейді: сандарды — кішісінен үлкеніне, сөздерді — әліпби бойынша. Мына аргументпен <code>reverse=True</code> — кему ретімен. <code>reverse()</code> элементтерді кері ретпен орналастырады.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>тізім.sort()</code> · <code>тізім.reverse()</code></p>
      <h3>Мысалдар</h3>
      <div class="exlist" data-ex="order"></div>
      <h3>Білу маңызды</h3>
      <ul><li><code>sort</code> тізімнің өзін өзгертеді және мынаны қайтарады: <code>None</code>: <code>b = a.sort()</code> — мұнда <code>b</code> ішіне мынау түседі: <code>None</code>.</li><li><code>reverse</code> сұрыптамайды, тек кері бұрады.</li><li>Python сөздерді әріп кодтары бойынша салыстырады: бас әріптер кіші әріптерден бұрын тұрады, ал қазақ әріптері Ә, Ғ, Қ, Ң, Ө, Ұ, Ү, Һ, І және Ё әрпі Я-дан кейін тұрады.</li><li>Бір тізімдегі сандар мен сөздерді сұрыптауға болмайды — қате <code>TypeError</code>.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Өзің байқап көр</span><div class="pyed" data-ed="order"></div></div>
      <p class="remember"><b>Есте сақта:</b> <code>sort()</code> — рет бойынша, <code>reverse()</code> — кері ретпен. Екеуі де тізімді өзгертеді және ештеңе қайтармайды.</p>
    </section>

    <!-- index, count -->
    <section class="block fcard" data-card="6" hidden>
      <p class="fname"><code>index()</code> және <code>count()</code> — табу</p>
      <p class="simple"><b>Қарапайым тілмен:</b> <code>index</code> «қай орында тұр?» деген сұраққа жауап береді, <code>count</code> — «неше рет кездеседі?». Тізімнің өзін олар өзгертпейді.</p>
      <div class="apply"><p class="apply-h">Қайда қолданылады</p><ul><li><span>Оқушының рейтингтегі орны:</span> <code>top.index("Тимур") + 1</code></li><li><span>Журналда неше бес бар:</span> <code>marks.count(5)</code></li><li><span>Тізімде тауар бар ма:</span> <code>"ірімшік" in shop</code></li></ul><p class="apply-no"><b>Сәйкес келмейді:</b> <code>index</code> жоқ элемент үшін — мына қате болады: <code>ValueError</code>. Алдымен мынамен тексер: <code>in</code>.</p></div>
      <p class="how"><span>Қалай жазылады:</span> <code>a.index(x)</code>, <code>a.count(x)</code>, <code>x in a</code></p>
      <div class="theory">
      <h3>Анықтама</h3>
      <p><code>index(x)</code> x-ке тең бірінші элементтің индексін қайтарады. <code>count(x)</code> x тізімде неше рет кездесетінін қайтарады. Мына оператор <code>x in a</code> мынаны береді: <code>True</code>, егер x тізімде болса, және <code>False</code>, егер болмаса.</p>
      <h3>Синтаксис</h3>
      <p class="syn"><code>тізім.index(x)</code> · <code>тізім.count(x)</code></p>
      <h3>Мысалдар</h3>
      <div class="exlist" data-ex="find"></div>
      <h3>Білу маңызды</h3>
      <ul><li><code>index</code> тек бірінші сәйкес элементті табады.</li><li><code>count</code> жоқ элемент үшін қате емес, 0 береді.</li><li><code>in</code> — әдіс емес, оператор: ол нүктесіз және жақшасыз жазылады.</li></ul>
      </div>
      <div class="tryed"><span class="trylab">Өзің байқап көр</span><div class="pyed" data-ed="find"></div></div>
      <p class="remember"><b>Есте сақта:</b> <code>index</code> — «қайда?», <code>count</code> — «неше рет?».</p>
    </section>

    <!-- Шпаргалка -->
    <section class="block fcard" data-card="7" hidden>
      <p class="fname">Анықтамалық және қателер</p>
      <div class="tablewrap">

      <p class="remember"><b>Жиі кездесетін үш қате:</b> индекстерді нөлден емес, бірден санау; <code>a = a.append(x)</code> (жай ғана керегі: <code>a.append(x)</code>); <code>remove</code> тізімде жоқ элемент.</p>
      <h3 class="th-h">Қателер және олардың себептері</h3>

  IndexError: "Нет элемента с таким номером (IndexError): в списке из n элементов индексы от 0 до n − 1. Или pop() из пустого списка.",
  ValueError: "Такого значения нет в списке (ValueError): remove() или index() ищут элемент, которого в списке нет. Сначала проверь: if x in a.",
  ValueErrorInt: "Не получилось превратить ввод в число (ValueError): int() ждёт целое число без пробелов и букв.",
  ValueErrorEmpty: "Список пустой (ValueError): max() и min() не могут выбрать из пустого списка.",
  AttributeError: "У этого значения нет такого метода (AttributeError). Проверь имя метода.",
  AttributeErrorNone: "У None нет методов (AttributeError). Скорее всего, где-то есть a = a.append(…) или a = a.sort(): метод меняет список сам и возвращает None. Пиши без присваивания: a.append(…).",
  TypeError: "Неподходящий тип данных (TypeError): например, к числу прибавляют текст, забыли int() при вводе или индекс — не целое число.",
  ZeroDivisionError: "Деление на ноль (ZeroDivisionError).",
  EOFError: "Программа просит больше данных, чем есть во входных данных: проверь, сколько раз вызывается input().",
  Timeout: "Программа работает слишком долго — похоже на бесконечный цикл. Проверь условие цикла while."
};
function pyErrText(e) {
  let k = e.type;
  if (k === "TabError") k = "IndentationError";
  if (k === "ValueError" && /invalid literal/.test(e.msg)) k = "ValueErrorInt";
  if (k === "ValueError" && /empty/.test(e.msg)) k = "ValueErrorEmpty";
  if (k === "AttributeError" && /NoneType/.test(e.msg)) k = "AttributeErrorNone";
  const text = PY_ERR[k] || "Ошибка " + e.type + ": " + e.msg;
  return e.line ? `Строка ${e.line}. ${text}` : text;
}
/* Сравнение вывода: без пробелов в конце строк и пустых строк в конце */
const outNorm = s => String(s).replace(/\r/g, "").split("\n").map(l => l.replace(/\s+$/, "")).join("\n").replace(/\n+$/, "");
const outShow = s => outNorm(s) || "(ничего)";

/* Редактор кода: Tab — отступ, Enter сохраняет отступ, после «:» добавляет 4 пробела, Ctrl+Enter — запустить */
function edMount(box, o) {
  box.innerHTML = `<div class="ed"><div class="ed-bar"><span><b>Python</b></span><span>Tab — отступ · Ctrl+Enter — запустить</span></div><textarea class="ed-code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Код программы"></textarea></div>`
    + (o.inputs ? `<label class="ed-inlab">Входные данные: каждое значение с новой строки<textarea class="ed-in" rows="2" spellcheck="false"></textarea></label>` : "")
    + `<div class="ed-act"><button type="button" class="btn ed-run">▶ Запустить</button></div>`
    + `<div class="ed-outwrap" hidden><span class="ed-lab">Вывод программы</span><pre class="ed-out"></pre><p class="ed-err"></p></div>`;
  const ta = box.querySelector(".ed-code"), inp = box.querySelector(".ed-in"), runBtn = box.querySelector(".ed-run");
  const fit = () => { ta.rows = Math.max(4, ta.value.split("\n").length + 1); };
  const put = s => { ta.setRangeText(s, ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); };
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); api.run(); return; }
    if (e.key === "Tab" && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      if (e.shiftKey) {
        const st = ta.value.lastIndexOf("\n", ta.selectionStart - 1) + 1, sp = /^ {0,4}/.exec(ta.value.slice(st))[0].length;
        if (sp) { const p = ta.selectionStart; ta.setRangeText("", st, st + sp, "preserve"); ta.selectionStart = ta.selectionEnd = Math.max(st, p - sp); ta.dispatchEvent(new Event("input")); }
      } else put("    ");
      return;
    }
    if (e.key === "Enter" && !e.shiftKey) {
      const st = ta.value.lastIndexOf("\n", ta.selectionStart - 1) + 1, line = ta.value.slice(st, ta.selectionStart);
      let ind = /^ */.exec(line)[0];
      if (/:\s*$/.test(line)) ind += "    ";
      e.preventDefault(); put("\n" + ind);
    }
  });
  ta.addEventListener("input", () => { fit(); if (o.onChange) o.onChange(); });
  if (inp) inp.addEventListener("input", () => { inp.rows = Math.max(2, inp.value.split("\n").length); });
  const api = {
    get code() { return ta.value; },
    set code(v) { ta.value = v; fit(); },
    get inputs() { if (!inp) return []; const a = inp.value.replace(/\r/g, "").split("\n"); if (a.length && a[a.length - 1] === "") a.pop(); return a; },
    set inputs(v) { if (inp) { inp.value = (v || []).join("\n"); inp.rows = Math.max(2, (v || []).length); } },
    clearOut() { box.querySelector(".ed-outwrap").hidden = true; },
    async run() {
      const wrap = box.querySelector(".ed-outwrap"), out = box.querySelector(".ed-out"), er = box.querySelector(".ed-err");
      wrap.hidden = false; out.textContent = ""; er.textContent = "Выполняется…"; runBtn.disabled = true;
      try {
        const r = await pyRun(ta.value, api.inputs);
        out.textContent = r.shown; er.textContent = r.err ? pyErrText(r.err) : "";
        return r;
      } catch (e) { er.textContent = PY_FAIL; return null; }
      finally { runBtn.disabled = false; }
    }
  };
  runBtn.addEventListener("click", () => api.run());
  api.code = o.code || ""; api.inputs = o.inputs || [];
  box.ed = api;
  return api;
}

function startLesson() {

/* Тема в двух строках листа; буквы открываются ответами на программы робота */
const ROWS = ["ОДНОМЕРНЫЙ", "МАССИВ"];
/* opts: [вариант, буква, пояснение для неверного варианта] — верный вариант в ans */
const TASKS = [
  { n: 1, code: "a = [\"К\", \"О\", \"Т\"]\nprint(a[1])", ans: "О",
    opts: [["К", "К", "Счёт номеров начинается с нуля: «К» — это a[0], а a[1] — следующая буква."], ["О", "О"], ["Т", "Т", "«Т» — это a[2]. Номер 1 — вторая буква."], ["ошибка", "Ж", "Номер 1 есть: в списке три элемента с номерами 0, 1, 2."]] },
  { n: 2, code: "a = [\"Д\", \"У\", \"Б\"]\nprint(a[0])", ans: "Д",
    opts: [["У", "У", "a[0] — первый элемент, счёт начинается с нуля."], ["Б", "Б", "«Б» — последний элемент, это a[2] или a[-1]."], ["Д", "Д"], ["0", "Ф", "print(a[0]) выводит сам элемент, а не его номер."]] },
  { n: 3, code: "a = [\"С\", \"Ы\", \"Н\"]\nprint(a[-1])", ans: "Н",
    opts: [["С", "С", "a[-1] — последний элемент: номера с минусом считают с конца."], ["Н", "Н"], ["Ы", "Ы", "«Ы» — это a[-2], предпоследний."], ["ошибка", "Щ", "Номер с минусом — не ошибка: a[-1] — последний элемент."]] },
  { n: 4, code: "a = [\"Р\", \"У\"]\na.append(\"М\")  # добавить в конец\nprint(a[2])", ans: "М",
    opts: [["Р", "Р", "append добавляет в конец, а не в начало."], ["У", "У", "После append в списке три элемента: a[2] — новый, третий."], ["ошибка", "Ш", "После append в списке три элемента, поэтому номер 2 есть."], ["М", "М"]] },
  { n: 5, code: "a = [\"Л\", \"Е\", \"С\"]  # len(a) — длина списка\nprint(a[len(a) - 2])", ans: "Е",
    opts: [["Л", "Л", "len(a) − 2 = 3 − 2 = 1, а не 0."], ["Е", "Е"], ["С", "С", "len(a) = 3, значит, нужен a[3 − 2], то есть a[1]."], ["ошибка", "Ю", "len(a) − 2 = 1 — такой номер есть."]] },
  { n: 6, code: "a = [\"Ы\", \"Б\", \"А\"]\na.insert(0, \"Р\")  # вставить на место 0\nprint(a[0])", ans: "Р",
    opts: [["Ы", "Ы", "insert(0, …) ставит новый элемент на место 0, а «Ы» сдвигается вправо."], ["А", "А", "«А» в конце списка, а нужен a[0]."], ["Р", "Р"], ["0", "Ц", "print(a[0]) выводит элемент, а не номер."]] },
  { n: 7, code: "a = [\"М\", \"Ы\", \"Ш\", \"Ь\"]\na.pop()  # убрать последний\nprint(a[-2])", ans: "Ы",
    opts: [["Ш", "Ш", "После pop() «Ь» исчез: последний теперь «Ш», а a[-2] — предпоследний."], ["Ы", "Ы"], ["Ь", "Ь", "pop() убрал «Ь» из списка."], ["М", "М", "a[-2] — второй с конца, а «М» — первый."]] },
  { n: 8, code: "a = [\"Й\", \"О\", \"Г\"]\na.reverse()  # перевернуть\nprint(a[2])", ans: "Й",
    opts: [["Г", "Г", "После переворота «Г» стоит первым — это a[0]."], ["О", "О", "«О» осталась в середине — это a[1]."], ["Й", "Й"], ["ошибка", "Я", "В списке три элемента, номер 2 есть."]] },
  { n: 9, code: "a = [\"Б\", \"А\", \"Л\"]\na.remove(\"Б\")  # убрать букву «Б»\nprint(a[0])", ans: "А",
    opts: [["Б", "Б", "remove(\"Б\") удалил «Б» из списка."], ["А", "А"], ["Л", "Л", "После удаления «Б» остались «А» и «Л»: a[0] — «А»."], ["ошибка", "Э", "«Б» есть в списке, поэтому remove сработал без ошибки."]] },
  { n: 10, code: "a = [\"Т\", \"С\", \"У\"]\na.sort()  # по алфавиту\nprint(a[0])", ans: "С",
    opts: [["Т", "Т", "sort() расставил буквы по алфавиту: С, Т, У."], ["У", "У", "По алфавиту «У» — последняя."], ["С", "С"], ["ошибка", "Х", "Буквы можно сортировать: по алфавиту."]] },
  { n: 11, code: "a = [\"Л\", \"И\", \"С\", \"А\"]\nb = a.pop(1)  # убрать a[1]\nprint(b)", ans: "И",
    opts: [["Л", "Л", "pop(1) убирает элемент с номером 1 — второй по счёту."], ["И", "И"], ["С", "С", "Номер 1 — это «И»: счёт с нуля."], ["список", "Ч", "В b попадает убранный элемент, а не весь список."]] },
  { n: 12, code: "a = [\"В\", \"А\", \"В\", \"А\"]\nn = a.count(\"В\")  # сколько раз «В»\nprint(a[n])", ans: "В",
    opts: [["2", "П", "print(a[n]) выводит элемент с номером n, а не само число n."], ["А", "А", "count(\"В\") = 2, а a[2] — третий элемент: «В»."], ["В", "В"], ["ошибка", "З", "Номер 2 есть: элементы 0, 1, 2, 3."]] }
];
TASKS.forEach(t => { const o = t.opts.find(x => x[0] === t.ans); t.letter = o[1]; });
/* буква может открываться группой («УН»): каждая буква листа знает своё задание */
const BY_LETTER = {}; TASKS.forEach(t => [...t.letter].forEach(ch => { BY_LETTER[ch] = t; }));
const ANSWER = ROWS.join("").replace(/ /g, "");
const COLS = "ABCDEFGHIJKLMN";
const KEY = "topic-l4";

const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} if (window.__onStore) window.__onStore(k); },
  del(k) { try { localStorage.removeItem(NS + k); } catch (e) {} if (window.__onStore) window.__onStore(k); }
};

/* picks: номер программы → выбранный вариант */
let picks = store.get(KEY, {});
let solved = new Set(TASKS.filter(t => picks[t.n] === t.ans).map(t => t.n));

function buildGrid() {
  const width = Math.max(...ROWS.map(r => r.length));
  let html = "<tr><th class=\"rh\"></th>" + [...COLS.slice(0, width)].map(c => `<th>${c}</th>`).join("") + "</tr>";
  ROWS.forEach((row, ri) => {
    html += `<tr><th class="rh">${ri + 1}</th>`;
    for (let i = 0; i < width; i++) {
      const ch = row[i];
      if (!ch || ch === " ") { html += "<td class=\"gap\"></td>"; continue; }
      const t = BY_LETTER[ch];
      html += `<td data-n="${t.n}" data-ch="${ch}" aria-label="ячейка ${COLS[i]}${ri + 1}, программа ${t.n}"><div class="cell"><span class="ch">?</span><span class="no">${t.n}</span></div></td>`;
    }
    html += "</tr>";
  });
  document.getElementById("grid").innerHTML = html;
}

function buildTasks() {
  document.getElementById("tasks").innerHTML = TASKS.map(t => `
    <div class="task fork" id="task-${t.n}">
      <div class="hd"><span class="tn">Программа ${t.n}</span><span class="fn">что выведет?</span></div>
      <pre class="code-view"></pre>
      <div class="fork-br opts4" role="group" aria-label="Ответ к программе ${t.n}">
        ${t.opts.map(o => `<button type="button" class="fork-b" data-n="${t.n}" data-b="${o[0]}" aria-pressed="false"><span>${o[0]}</span><span class="lt">?</span></button>`).join("")}
      </div>
      <p class="msg" id="msg-${t.n}" aria-live="polite"></p>
    </div>`).join("");
  TASKS.forEach(t => { document.querySelector(`#task-${t.n} .code-view`).textContent = t.code; });
}

function render(animateN) {
  document.querySelectorAll("#grid td[data-n]").forEach(td => {
    const n = +td.dataset.n, t = TASKS[n - 1], p = picks[n];
    const open = solved.has(n), wrong = !!p && !open, o = wrong ? t.opts.find(x => x[0] === p) : null;
    td.classList.toggle("open", open);
    td.classList.toggle("wrongl", wrong);
    td.querySelector(".ch").textContent = open ? td.dataset.ch : o ? o[1][[...t.letter].indexOf(td.dataset.ch)] : "?";
    if (p && n === animateN) { td.classList.remove("flip"); void td.offsetWidth; td.classList.add("flip"); }
  });
  TASKS.forEach(t => {
    const box = document.getElementById("task-" + t.n), p = picks[t.n], done = solved.has(t.n);
    box.classList.toggle("done", done);
    box.classList.toggle("wrongp", !!p && !done);
    box.querySelectorAll(".fork-b").forEach(b => {
      const mine = b.dataset.b === p, o = t.opts.find(x => x[0] === b.dataset.b);
      b.setAttribute("aria-pressed", mine);
      b.classList.toggle("ok", mine && done);
      b.classList.toggle("no", mine && !done);
      b.querySelector(".lt").textContent = mine ? o[1] : "?";
      b.disabled = done;
    });
    const msg = document.getElementById("msg-" + t.n);
    const o = p ? t.opts.find(x => x[0] === p) : null;
    if (done) { msg.className = "msg ok"; msg.textContent = `Верно! Открыта буква «${t.letter}».`; }
    else if (o) { msg.className = "msg bad"; msg.textContent = `Буква «${o[1]}» ломает слово. ${o[2] || ""} Выбери другой ответ.`; }
    else { msg.className = "msg"; msg.textContent = ""; }
  });
  const total = ANSWER.length;
  const open = [...ANSWER].filter(ch => solved.has(BY_LETTER[ch].n)).length;
  document.getElementById("pbar").style.width = (open / total * 100) + "%";
  document.getElementById("pnum").textContent = `Открыто букв: ${open} из ${total}`;
  if (open === total) unlock();
}

function choose(n, b) {
  const t = TASKS[n - 1];
  if (solved.has(n)) return;
  picks[n] = b;
  const ok = b === t.ans;
  if (ok) solved.add(n);
  if (window.__onAttempt) window.__onAttempt("2. Разгадка темы", "Программа " + n, b, ok, ok ? "" : "верно: " + t.ans);
  store.set(KEY, picks);
  render(n);
}

document.getElementById("tasks").addEventListener("click", e => {
  const b = e.target.closest(".fork-b"); if (b && !b.disabled) choose(+b.dataset.n, b.dataset.b);
});

function norm(s) { return s.toUpperCase().replace(/Ё/g, "Е").replace(/[^А-ЯЁӘҒҚҢӨҰҮҺІA-Z]/g, ""); }
function guess() {
  const inp = document.getElementById("guessIn"), msg = document.getElementById("guessMsg");
  inp.classList.remove("wrong");
  if (norm(inp.value) === ANSWER) {
    TASKS.forEach(t => { picks[t.n] = t.ans; solved.add(t.n); }); store.set(KEY, picks);
    msg.className = "msg ok"; msg.textContent = "Верно! Тема открыта.";
    render();
  } else {
    void inp.offsetWidth; inp.classList.add("wrong");
    msg.className = "msg bad"; msg.textContent = "Пока не то. Откройте ещё несколько букв.";
  }
}
document.getElementById("guessBtn").addEventListener("click", guess);
document.getElementById("guessIn").addEventListener("keydown", e => { if (e.key === "Enter") guess(); });

let unlocked = false;
function unlock() {
  const tab = document.getElementById("tab-goal");
  tab.disabled = false;
  if (unlocked) return;
  unlocked = true;
  setTimeout(() => showExp(store.get(EXP_KEY, "")), 0);  // после загрузки остальных частей урока
  document.getElementById("guessMsg").className = "msg ok";
  document.getElementById("guessMsg").textContent = "Тема разгадана! Открываем тему и цель урока…";
  setTimeout(() => { show("goal"); window.scrollTo({ top: 0, behavior: "smooth" }); }, 1400);
}

const PANELS = ["review", "puzzle", "goal", "actual", "learn", "methods", "match", "practice", "project", "reflect", "hw"];

document.getElementById("resetBtn").addEventListener("click", () => {

const bigBtn = document.getElementById("bigBtn");
function setBig(on) { document.documentElement.classList.toggle("big", on); bigBtn.setAttribute("aria-pressed", on); store.set("big", on); }
bigBtn.addEventListener("click", () => setBig(!document.documentElement.classList.contains("big")));

/* Ожидания ученика: пока хранятся только в его браузере */
const EXP_KEY = "expect-l4";
const expText = document.getElementById("expText");
function showExp(text) {
  // этапы 4–11 открыты, только когда тема разгадана и ожидания записаны
  const has = !!text && [...ANSWER].every(ch => solved.has(BY_LETTER[ch].n));
  document.getElementById("expForm").hidden = has;
  document.getElementById("expSaved").hidden = !has;
  document.getElementById("expShow").textContent = text || "";
  document.getElementById("afterExp").hidden = !has;
  ["reflect", "actual", "learn", "methods", "match", "practice", "project", "hw"].forEach(p => { document.getElementById("tab-" + p).disabled = !has; });
  document.getElementById("toLearn").hidden = !has;
}

/* Карточки нового материала: 0–2 — список, 3–7 — методы; каждая панель листается своими кнопками */
const CARD_NAMES = ["список", "индексы", "перебор и функции", "append, insert", "pop, remove", "sort, reverse", "index, count", "шпаргалка и ошибки"];
const CARD_SETS = { learn: [0, 1, 2], methods: [3, 4, 5, 6, 7] };
const cardCur = { learn: 0, methods: 3 };
function showCard(i) {
  const panel = i < 3 ? "learn" : "methods", set = CARD_SETS[panel], first = set[0], last = set[set.length - 1];
  cardCur[panel] = i;
  document.querySelectorAll(`#${panel} .fcard`).forEach(c => { c.hidden = +c.dataset.card !== i; });
  document.querySelectorAll(`#${panel} .fpill`).forEach(p => p.setAttribute("aria-selected", +p.dataset.f === i));
  const pv = document.getElementById(panel === "learn" ? "lPrev" : "mPrev"), nx = document.getElementById(panel === "learn" ? "lNext" : "mNext");
  pv.textContent = i === first ? (panel === "learn" ? "← Вспомним" : "← Список") : "← Назад";

/* Проверка программ ученика: запуск на нескольких наборах данных и сравнение с эталоном */
const pyLit = v => Array.isArray(v) ? "[" + v.map(pyLit).join(", ") + "]" : typeof v === "string" ? JSON.stringify(v) : String(v);
const predNorm = s => String(s).replace(/\r/g, "").replace(/[«»"“”'‘’]/g, "").replace(/\s+/g, " ").trim()
  .replace(/\s*([,\[\]\(\)])\s*/g, "$1").toLowerCase().replace(/ё/g, "е");
/* Режимы сравнения вывода: строгий (по строкам), loose — без регистра и пробелов у знаков препинания, nums — только числа по порядку */
function cmpOut(mode, a, b) {
  if (mode === "nums") { const n = s => (outNorm(s).match(/-?\d+(?:\.\d+)?/g) || []).join(" "); return n(a) === n(b); }
  if (mode === "loose") { const l = s => outNorm(s).split("\n").map(x => x.toLowerCase().replace(/ё/g, "е").replace(/\s*([.,:;!?—-])\s*/g, "$1").replace(/\s+/g, " ").trim()).join("\n"); return l(a) === l(b); }
  return outNorm(a).split("\n").map(x => x.replace(/\s+/g, " ").trim()).join("\n") === outNorm(b).split("\n").map(x => x.replace(/\s+/g, " ").trim()).join("\n");
}
function testDesc(test) {
  const p = [];
  Object.entries(test.data || {}).forEach(([k, v]) => p.push(`${k} = ${pyLit(v)}`));
  if (test.inputs) p.push("ввод: " + test.inputs.join(", "));
  return p.join("; ");
}
function withData(code, data) {
  let c = code;
  for (const [k, v] of Object.entries(data || {})) {
    const re = new RegExp("^" + k + "\\s*=\\s*\\[.*\\]\\s*$", "m");
    if (!re.test(c)) return null;
    c = c.replace(re, k + " = " + pyLit(v));
  }
  return c;
}
async function codeCheck(t, code) {
  if (!code.trim()) return { ok: false, msg: "Редактор пустой. Напиши программу." };
  const tests = t.tests || [{}];
  try {
    for (let i = 0; i < tests.length; i++) {
      const test = tests[i], sc = withData(code, test.data), rc = withData(t.ref, test.data);
      if (sc === null) return { ok: false, msg: `Оставь строку «${Object.keys(test.data).join(", ")} = […]» как в начале: по ней программу проверяют на других данных.` };
      const r = await pyRun(sc, test.inputs), w = await pyRun(rc, test.inputs);
      const where = i ? `Проверка на других данных (${testDesc(test)}): ` : (testDesc(test) ? `Данные: ${testDesc(test)}.\n` : "");
      if (r.err) return { ok: false, msg: where + pyErrText(r.err) };
      if (!cmpOut(t.cmp, r.out, w.out)) {
        return { ok: false, msg: (i ? where + "ответ не совпал.\n" : where) + `Программа вывела:\n${outShow(r.out)}\nА нужно:\n${outShow(w.out)}` + (i ? "\nПроверь, что программа работает с любым списком, а не только с тем, что в задании." : "") };
      }
    }
    const calls = await pyCalls(code), miss = (t.must || []).filter(m => !calls.includes(m));
    if (miss.length) return { ok: false, msg: `Вывод верный, но задание проверяет ${miss.length > 1 ? "методы" : "метод"} ${miss.map(m => m + "()").join(", ")}: используй ${miss.length > 1 ? "их" : "его"}.` };
    return { ok: true };
  } catch (e) { return { ok: false, msg: PY_FAIL }; }
}

/* Задание открывается, когда решено предыдущее; уровень — когда открыто его первое задание */
function prUnlocked(id) {
  const order = prAll(), i = order.findIndex(t => t.id === id), d = prLoad();
  return i <= 0 || !!(d[order[i - 1].id] && d[order[i - 1].id].ever);
}
function prLocks() {
  const order = prAll();
  order.forEach((t, i) => {
    const card = document.getElementById("pt-" + t.id); if (!card) return;
    const open = prUnlocked(t.id);
    card.classList.toggle("locked", !open);
    card.inert = !open;
    let l = card.querySelector(".tc-lock");
    if (!l) { l = document.createElement("p"); l.className = "tc-lock"; card.querySelector(".tc-head").after(l); }
    l.textContent = open ? "" : `Закрыто. Откроется, когда будет решено задание ${order[i - 1].id}.`;
  });
  document.querySelectorAll(".lv").forEach(b => {
    const first = order.find(t => t.lv === b.dataset.lv);
    const open = first && prUnlocked(first.id);
    b.disabled = !open;
    b.title = open ? "" : "Уровень откроется, когда будут решены все задания предыдущего уровня";
  });
  const nx = document.getElementById("lvNext");
  if (nx && !nx.hidden) { const first = order.find(t => t.lv === nx.dataset.lv); nx.disabled = !(first && prUnlocked(first.id)); }
}
function prRender() {
  const d = prLoad();
  const solved = prAll().filter(t => d[t.id] && d[t.id].ok).length;
  document.getElementById("prBar").style.width = (solved / prAll().length * 100) + "%";
  document.getElementById("prNum").textContent = `Решено: ${solved} из ${prAll().length}`;
  Object.keys(LEVELS_PR).forEach(lv => {
    const list = prAll().filter(t => t.lv === lv), ok = list.filter(t => d[t.id] && d[t.id].ok).length;
    document.getElementById("lvc" + lv).textContent = `${ok}/${list.length}`;
    document.querySelector(`.lv[data-lv="${lv}"]`).classList.toggle("full", ok === list.length);
  });
  prLocks();
}
function prShowLevel(lv) {
  document.querySelectorAll(".lv").forEach(b => b.setAttribute("aria-selected", b.dataset.lv === lv));

/* Карточка задания: «Что выведет?» — поле ответа; остальные — редактор, ввод и проверка на других данных.
   cfg: key — хранилище, stage — этап для учителя, idp — префикс id, doneText — подпись решённого, onDone — после проверки */
function taskCard(t, cfg) {
  const isPred = t.kind === "predict";
  const head = t.lvName ? `${t.lvName} · ${t.fn}` : `${KIND[t.kind]} · ${t.fn}`;
  const html = `
    <section class="block task-card" data-lv="${t.lv}" id="${cfg.idp}-${t.id}"${cfg.hidden ? " hidden" : ""}>
      <div class="tc-head"><span class="tc-id">${t.id}</span><span class="tc-fn">${head}</span><span class="tc-status" aria-live="polite"></span></div>
      <p class="tc-q">${t.q}</p>
      ${t.plan ? `<ol class="plan">${t.plan.map(s => `<li>${s}</li>`).join("")}</ol>` : ""}
      ${isPred ? `<pre class="code-view"></pre>
      <div class="pred"><label for="${cfg.idp}-in-${t.id}">Мой ответ — что появится на экране</label><textarea class="pred-in" id="${cfg.idp}-in-${t.id}" rows="1" spellcheck="false" autocomplete="off"></textarea></div>`
      : `<div class="pyed"></div>${t.kind === "write" || t.sampleShow ? `<div class="sample-box"><p class="small">Пример: при таких данных программа должна вывести</p><div class="sample"><pre class="s-in"></pre><pre class="s-out"></pre></div></div>` : ""}`}
      <div class="tc-actions">
        <button type="button" class="btn main tc-check">Проверить</button>
        <button type="button" class="btn tc-hintbtn">Подсказка</button>
        ${isPred ? `<button type="button" class="btn tc-run" hidden>Запустить в Python</button>` : `<button type="button" class="btn tc-reset">Начать заново</button>`}
      </div>
      <p class="tc-msg" aria-live="polite"></p>
      <p class="tc-hint" hidden></p>
      ${isPred ? `<pre class="ed-out tc-out" hidden></pre>` : ""}
    </section>`;
  return {
    html,
    mount() {
      const card = document.getElementById(`${cfg.idp}-${t.id}`), msg = card.querySelector(".tc-msg"), hint = card.querySelector(".tc-hint");
      hint.textContent = t.hint;
      const saved = store.get(cfg.key, {})[t.id];
      const setStatus = ok => {
        card.classList.toggle("done", ok);
        card.querySelector(".tc-status").textContent = ok ? cfg.doneText : "";
        const run = card.querySelector(".tc-run"); if (run) run.hidden = !ok;
      };
      let ed = null, inp = null;
      if (isPred) {
        card.querySelector(".code-view").textContent = t.code;
        inp = card.querySelector(".pred-in");
        inp.addEventListener("input", () => { inp.rows = Math.max(1, inp.value.split("\n").length); msg.textContent = ""; msg.className = "tc-msg"; });
        inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); check(); } });
        if (saved && saved.a != null) inp.value = saved.a;
        card.querySelector(".tc-run").addEventListener("click", async () => {
          const out = card.querySelector(".tc-out"); out.hidden = false; out.textContent = "Выполняется…";
          try { const r = await pyRun(t.code, []); out.textContent = r.shown + (r.err ? "\n" + pyErrText(r.err) : ""); } catch (e) { out.textContent = PY_FAIL; }
        });
      } else {
        const t0 = (t.tests || [{}])[0];
        ed = edMount(card.querySelector(".pyed"), { code: t.start, inputs: t0.inputs, onChange: () => { msg.textContent = ""; msg.className = "tc-msg"; } });
        if (!t0.inputs) { const il = card.querySelector(".ed-inlab"); if (il) il.remove(); }
        if (saved && saved.code != null) ed.code = saved.code;
        card.querySelector(".tc-reset").addEventListener("click", () => {
          ed.code = t.start; ed.inputs = t0.inputs || []; ed.clearOut(); msg.textContent = ""; hint.hidden = true;
          const all = store.get(cfg.key, {}); all[t.id] = { ok: false, ever: !!(all[t.id] && all[t.id].ever), code: t.start }; store.set(cfg.key, all);
          setStatus(false); if (cfg.onDone) cfg.onDone(t, false);
        });
      }
      if (saved) setStatus(!!saved.ok);
      const btn = card.querySelector(".tc-check");
      async function check() {
        let r, answer;
        if (isPred) {
          answer = inp.value;
          if (!answer.trim()) { msg.className = "tc-msg bad"; msg.textContent = "Впиши ответ."; return; }
          const n = predNorm(answer);
          r = n === predNorm(t.ans) ? { ok: true } : { ok: false, msg: (t.traps && t.traps[n] ? t.traps[n] + " " : "Неверно. ") + "Выполни программу по строкам и записывай, каким становится список после каждой строки." };
        } else {
          answer = ed.code;
          btn.disabled = true; msg.className = "tc-msg"; msg.textContent = "Проверяю программу…";
          r = await codeCheck(t, answer);
          btn.disabled = false;
        }
        if (window.__onAttempt) window.__onAttempt(cfg.stage, t.id + " · " + t.fn, answer, r.ok, r.ok ? "" : r.msg);
        const all = store.get(cfg.key, {}), tries = ((all[t.id] && all[t.id].tries) || 0) + 1;
        all[t.id] = { ok: r.ok, ever: r.ok || !!(all[t.id] && all[t.id].ever), tries, [isPred ? "a" : "code"]: answer };
        store.set(cfg.key, all);
        msg.className = "tc-msg " + (r.ok ? "ok" : "bad");
        msg.textContent = r.ok ? (isPred ? "Верно! Можешь запустить программу и убедиться." : "Верно! Программа работает и на других данных.") : r.msg;
        if (!r.ok && tries >= 2) hint.hidden = false;
        setStatus(r.ok);
        if (cfg.onDone) cfg.onDone(t, r.ok, msg);
      }
      btn.addEventListener("click", check);
      card.querySelector(".tc-hintbtn").addEventListener("click", () => { hint.hidden = !hint.hidden; });
    }
  };
}

function shuffleSeeded(arr, seed) {
  let h = 2166136261;
  for (const ch of String(seed)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }

  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* Редактор кода: Tab — отступ, Enter сохраняет отступ, после «:» добавляет 4 пробела, Ctrl+Enter — запустить */
function edMount(box, o) {
  box.innerHTML = `<div class="ed"><div class="ed-bar"><span><b>Python</b></span><span>Tab — шегініс · Ctrl+Enter — іске қосу</span></div><textarea class="ed-code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Бағдарлама коды"></textarea></div>`
    + (o.inputs ? `<label class="ed-inlab">Кіріс деректері: әр мән жаңа жолдан<textarea class="ed-in" rows="2" spellcheck="false"></textarea></label>` : "")
    + `<div class="ed-act"><button type="button" class="btn ed-run">▶ Іске қосу</button></div>`
    + `<div class="ed-outwrap" hidden><span class="ed-lab">Бағдарлама шығарғаны</span><pre class="ed-out"></pre><p class="ed-err"></p></div>`;
  const ta = box.querySelector(".ed-code"), inp = box.querySelector(".ed-in"), runBtn = box.querySelector(".ed-run");
  const fit = () => { ta.rows = Math.max(4, ta.value.split("\n").length + 1); };
  const put = s => { ta.setRangeText(s, ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); };
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); api.run(); return; }
    if (e.key === "Tab" && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      if (e.shiftKey) {
        const st = ta.value.lastIndexOf("\n", ta.selectionStart - 1) + 1, sp = /^ {0,4}/.exec(ta.value.slice(st))[0].length;
        if (sp) { const p = ta.selectionStart; ta.setRangeText("", st, st + sp, "preserve"); ta.selectionStart = ta.selectionEnd = Math.max(st, p - sp); ta.dispatchEvent(new Event("input")); }
      } else put("    ");
      return;
    }
    if (e.key === "Enter" && !e.shiftKey) {
      const st = ta.value.lastIndexOf("\n", ta.selectionStart - 1) + 1, line = ta.value.slice(st, ta.selectionStart);
      let ind = /^ */.exec(line)[0];
      if (/:\s*$/.test(line)) ind += "    ";
      e.preventDefault(); put("\n" + ind);
    }
  });
  ta.addEventListener("input", () => { fit(); if (o.onChange) o.onChange(); });
  if (inp) inp.addEventListener("input", () => { inp.rows = Math.max(2, inp.value.split("\n").length); });
  const api = {
    get code() { return ta.value; },
    set code(v) { ta.value = v; fit(); },
    get inputs() { if (!inp) return []; const a = inp.value.replace(/\r/g, "").split("\n"); if (a.length && a[a.length - 1] === "") a.pop(); return a; },
    set inputs(v) { if (inp) { inp.value = (v || []).join("\n"); inp.rows = Math.max(2, (v || []).length); } },
    clearOut() { box.querySelector(".ed-outwrap").hidden = true; },
    async run() {

}

function render(animateN) {

    td.classList.toggle("open", open);
    td.classList.toggle("wrongl", wrong);

  });

    box.classList.toggle("done", done);
    box.classList.toggle("wrongp", !!p && !done);
    box.querySelectorAll(".fork-b").forEach(b => {
      const mine = b.dataset.b === p, o = t.opts.find(x => x[0] === b.dataset.b);
      b.setAttribute("aria-pressed", mine);
      b.classList.toggle("ok", mine && done);
      b.classList.toggle("no", mine && !done);
      b.querySelector(".lt").textContent = mine ? o[1] : "?";
      b.disabled = done;
    });
    const msg = document.getElementById("msg-" + t.n);
    const o = p ? t.opts.find(x => x[0] === p) : null;
    if (done) { msg.className = "msg ok"; msg.textContent = `Дұрыс! «${t.letter}» әрпі ашылды.`; }
    else if (o) { msg.className = "msg bad"; msg.textContent = `«${o[1]}» әрпі сөзді бұзады. ${o[2] || ""} Басқа жауапты таңда.`; }
    else { msg.className = "msg"; msg.textContent = ""; }

  document.getElementById("pnum").textContent = `Ашылған әріптер: ${open} / ${total}`;

}

function choose(n, b) {
  const t = TASKS[n - 1];
  if (solved.has(n)) return;
  picks[n] = b;
  const ok = b === t.ans;
  if (ok) solved.add(n);
  if (window.__onAttempt) window.__onAttempt("2. Разгадка темы", "Программа " + n, b, ok, ok ? "" : "верно: " + t.ans);
  store.set(KEY, picks);
  render(n);
}

}

/* Проверка программ ученика: запуск на нескольких наборах данных и сравнение с эталоном */
const pyLit = v => Array.isArray(v) ? "[" + v.map(pyLit).join(", ") + "]" : typeof v === "string" ? JSON.stringify(v) : String(v);
const predNorm = s => String(s).replace(/\r/g, "").replace(/[«»"“”'‘’]/g, "").replace(/\s+/g, " ").trim()
  .replace(/\s*([,\[\]\(\)])\s*/g, "$1").toLowerCase().replace(/ё/g, "е");
/* Режимы сравнения вывода: строгий (по строкам), loose — без регистра и пробелов у знаков препинания, nums — только числа по порядку */
function cmpOut(mode, a, b) {
  if (mode === "nums") { const n = s => (outNorm(s).match(/-?\d+(?:\.\d+)?/g) || []).join(" "); return n(a) === n(b); }
  if (mode === "loose") { const l = s => outNorm(s).split("\n").map(x => x.toLowerCase().replace(/ё/g, "е").replace(/\s*([.,:;!?—-])\s*/g, "$1").replace(/\s+/g, " ").trim()).join("\n"); return l(a) === l(b); }
  return outNorm(a).split("\n").map(x => x.replace(/\s+/g, " ").trim()).join("\n") === outNorm(b).split("\n").map(x => x.replace(/\s+/g, " ").trim()).join("\n");
}
function testDesc(test) {
  const p = [];
  Object.entries(test.data || {}).forEach(([k, v]) => p.push(`${k} = ${pyLit(v)}`));
  if (test.inputs) p.push("енгізу: " + test.inputs.join(", "));
  return p.join("; ");
}
function withData(code, data) {
  let c = code;
  for (const [k, v] of Object.entries(data || {})) {
    const re = new RegExp("^" + k + "\\s*=\\s*\\[.*\\]\\s*$", "m");
    if (!re.test(c)) return null;
    c = c.replace(re, k + " = " + pyLit(v));
  }
  return c;
}
async function codeCheck(t, code) {
  if (!code.trim()) return { ok: false, msg: "Редактор бос. Бағдарлама жаз." };
  const tests = t.tests || [{}];
  try {
    for (let i = 0; i < tests.length; i++) {
      const test = tests[i], sc = withData(code, test.data), rc = withData(t.ref, test.data);
      if (sc === null) return { ok: false, msg: `«${Object.keys(test.data).join(", ")} = […]» жолын бастапқыдай қалдыр: бағдарлама басқа деректерде сол жол арқылы тексеріледі.` };
      const r = await pyRun(sc, test.inputs), w = await pyRun(rc, test.inputs);
      const where = i ? `Басқа деректерде тексеру (${testDesc(test)}): ` : (testDesc(test) ? `Деректер: ${testDesc(test)}.\n` : "");
      if (r.err) return { ok: false, msg: where + pyErrText(r.err) };
      if (!cmpOut(t.cmp, r.out, w.out)) {
        return { ok: false, msg: (i ? where + "жауап сәйкес келмеді.\n" : where) + `Бағдарлама шығарғаны:\n${outShow(r.out)}\nАл керегі:\n${outShow(w.out)}` + (i ? "\nБағдарлама тапсырмадағы тізіммен ғана емес, кез келген тізіммен жұмыс істейтінін тексер." : "") };
      }
    }
    const calls = await pyCalls(code), miss = (t.must || []).filter(m => !calls.includes(m));
    if (miss.length) return { ok: false, msg: `Шығарылғаны дұрыс, бірақ тапсырма ${miss.map(m => m + "()").join(", ")} ${miss.length > 1 ? "әдістерін" : "әдісін"} тексереді: ${miss.length > 1 ? "оларды" : "оны"} қолдан.` };
    return { ok: true };
  } catch (e) { return { ok: false, msg: PY_FAIL }; }
}
